<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ReadyGO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* ReadyGO (ReadyCare orientation module) — styled to match ReadyCareHQ / ReadyOps: Hanken Grotesk, navy headings, ReadyCare blue actions, white 20px cards on light gray. */
:root{
  --bg:#F5F5F6; --surface:#FFFFFF; --sunk:#F2F4F7; --ink:#131317; --muted:#474550; --line:#DCDCE0;
  --head:#12074A; --navy:#12074A; --orange:#EE6900;
  --accent:#0060AB; --accent-ink:#FFFFFF; --accent-soft:#E7F0FA;
  --pending:#B45309; --pending-soft:#FFF1E5;
  --ok:#1E7A46; --ok-soft:#E1F3E8; --bad:#BA1A1A; --bad-soft:#FFDAD6;
  --ic-fill:var(--surface); --hz-wall:#E6EDEE; --hz-floor:#D8C8AC; --hz-line:#8697A0; --hz-obj:#9A7B5C; --hz-bed:#F7F7F3; --hz-night:#25344C; --hz-shade:#5C6168;
  --f-display:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px; --shadow:0 4px 7.5px rgba(0,28,57,.04),0 1px 2px rgba(0,28,57,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0B1F; --surface:#17142F; --sunk:#110E26; --ink:#ECEBF5; --muted:#ABA8C2; --line:#2B2750;
  --head:#F0EEFF; --navy:#1C1554; --orange:#FF8A3D;
  --accent:#5EAEF2; --accent-ink:#081A2E; --accent-soft:#16284A;
  --pending:#F5A35C; --pending-soft:#33230F;
  --ok:#6FCF97; --ok-soft:#14301F; --bad:#FF8A80; --bad-soft:#3D1715; --hz-wall:#243033; --hz-floor:#3B3428; --hz-line:#5C6E74; --hz-obj:#6E5640; --hz-bed:#CDD3D2;
  --shadow:0 4px 10px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0B1F; --surface:#17142F; --sunk:#110E26; --ink:#ECEBF5; --muted:#ABA8C2; --line:#2B2750;
  --head:#F0EEFF; --navy:#1C1554; --orange:#FF8A3D;
  --accent:#5EAEF2; --accent-ink:#081A2E; --accent-soft:#16284A;
  --pending:#F5A35C; --pending-soft:#33230F;
  --ok:#6FCF97; --ok-soft:#14301F; --bad:#FF8A80; --bad-soft:#3D1715; --hz-wall:#243033; --hz-floor:#3B3428; --hz-line:#5C6E74; --hz-obj:#6E5640; --hz-bed:#CDD3D2;
  --shadow:0 4px 10px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;display:flex;flex-direction:column;min-height:100vh}
#app{flex:1;width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0;color:var(--head);letter-spacing:-.4px}
h1{font-size:clamp(1.8rem,4vw,2.5rem)}
h2{font-size:1.45rem}
h3{font-size:1.12rem}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.10);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:68rem;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--f-display);font-size:1.05rem}
.brand span{font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.meter{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .bar{width:110px}

.wrap{max-width:68rem;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
.read{max-width:46rem;width:100%;margin:0 auto;display:grid;gap:22px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;cursor:pointer;font-weight:700;font-size:.95rem;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:8px;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

.tag{font-family:var(--f-mono);font-size:.74rem;padding:2px 7px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.prog{background:var(--accent-soft);color:var(--accent)}
.chip.todo{background:var(--sunk);color:var(--muted)}
.chip.pend{background:var(--pending-soft);color:var(--pending)}
.chip.lock{background:var(--sunk);color:var(--muted)}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.hero .lede{font-size:1.1rem;color:var(--muted);max-width:36rem;margin-top:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;min-height:42px;width:100%}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;list-style:none;padding:0;margin:0}
.mod{display:grid;grid-template-columns:2.8rem minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.mod:hover{border-color:var(--accent)}
.mod .n{font-family:var(--f-display);font-size:1.35rem;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.mod .t{font-weight:700;line-height:1.3}
.mod .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.mod.final{grid-column:1/-1;background:var(--accent-soft);border-color:transparent}
.mod.final .n{font-size:1.1rem}
.mod[disabled]{cursor:not-allowed;opacity:.75}

/* Lesson */
.back{justify-self:start}
.lesson-head{display:grid;gap:8px}
.presenter{display:grid;grid-template-columns:116px minmax(0,1fr);gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.portrait{width:116px;aspect-ratio:1;border-radius:50%;background:var(--accent-soft);overflow:hidden;display:grid;place-items:center;max-width:100%}
.portrait svg{width:78%;height:78%}
.presenter .who{font-weight:700}
.player{display:grid;gap:8px}
.wave{display:flex;gap:3px;align-items:flex-end;height:22px}
.wave i{width:4px;border-radius:2px;background:var(--accent);height:30%;opacity:.45}
.speaking .wave i{animation:w 1s ease-in-out infinite;opacity:1}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.25s}.wave i:nth-child(4){animation-delay:.05s}.wave i:nth-child(5){animation-delay:.3s}.wave i:nth-child(6){animation-delay:.15s}.wave i:nth-child(7){animation-delay:.2s}
@keyframes w{0%,100%{height:25%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){.speaking .wave i{animation:none}}
.player select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-height:42px}

.sec{display:grid;gap:10px}
.sec h3{padding-top:6px}
.sec ul,.sec ol{margin:0;padding-left:1.3rem;display:grid;gap:4px}
.sec li::marker{color:var(--accent)}
.callout{border-radius:var(--r);padding:14px 16px;display:grid;gap:6px}
.callout.key{background:var(--accent-soft)}
.callout.warn{background:var(--bad-soft)}
.callout.warn b{color:var(--bad)}
.callout.pending{background:var(--pending-soft);border:1px dashed var(--pending)}
.callout.pending .eyebrow{color:var(--pending)}
.steps{counter-reset:s;list-style:none;padding:0 !important}
.steps li{counter-increment:s;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:650;color:var(--accent)}
.acro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acro div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.acro dl{margin:8px 0 0;display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:4px 6px}
.acro dt{font-family:var(--f-display);font-weight:650;color:var(--accent);font-size:1.15rem;line-height:1.3}
.acro dd{margin:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums}

/* Quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:18px}
.q{display:grid;gap:8px;border:0;padding:0;margin:0;min-width:0}
.q legend{font-weight:700;padding:0;margin-bottom:6px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{font-size:.92rem;color:var(--muted)}
.result{border-radius:var(--r);padding:14px 16px;font-weight:700}
.result.pass{background:var(--ok-soft);color:var(--ok)}
.result.fail{background:var(--bad-soft);color:var(--bad)}
.ack{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer}
.ack input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}

/* Certificate */
.cert{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,4vw,40px);display:grid;gap:18px;text-align:center}
.cert .seal{width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--ok-soft);display:grid;place-items:center;color:var(--ok)}
.cert .name{font-family:var(--f-display);font-size:clamp(1.6rem,5vw,2.4rem)}
.cert table{text-align:left}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;z-index:20}

/* Illustration + activities */
.ic{width:100%;height:100%;display:block}
.mtile{width:2.8rem;height:2.8rem;border-radius:10px;background:var(--accent-soft);color:var(--accent);padding:7px}
.mod.final .mtile{background:var(--surface)}
.banner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:22px 24px;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;right:-10px;top:-10px;width:220px;height:calc(100% + 20px);background-image:radial-gradient(var(--accent) 1.3px,transparent 1.5px);background-size:16px 16px;opacity:.16;pointer-events:none}
.banner .big{position:relative;z-index:1;width:108px;height:108px;border-radius:50%;background:var(--surface);color:var(--accent);padding:20px;border:6px solid var(--bg)}
.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.act-head{display:grid;gap:2px}
.sort{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sc{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--bg);align-content:start}
.sc.good{border-color:var(--ok);background:var(--ok-soft)}
.sc.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.88rem}
.scene{border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.scene svg{display:block;width:100%;height:auto}
.hz{cursor:pointer;outline:none}
.hz .ring{stroke:transparent;transition:stroke .2s}
.hz:hover .ring,.hz:focus-visible .ring{stroke:rgba(242,179,42,.45)}
.hz.on .ring{stroke:#F2B32A}
.hz .num{opacity:0;font:700 22px var(--f-body);fill:#F2B32A;paint-order:stroke;stroke:#25344C;stroke-width:4px}
.hz.on .num{opacity:1}
.hzlist{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.doors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.door{background:none;border:0;padding:0;cursor:pointer;display:grid;gap:6px;justify-items:center;font-size:.8rem;font-weight:700;line-height:1.2;text-align:center}
.dpanel{position:relative;width:100%;max-width:78px;aspect-ratio:1/1.7;background:var(--hz-obj);border:3px solid var(--hz-line);border-radius:3px 3px 0 0;transition:background .3s}
.knob{position:absolute;right:12%;top:48%;width:8px;height:8px;border-radius:50%;background:var(--hz-bed)}
.gtag{position:absolute;right:2%;top:56%;width:16px;height:22px;background:#F2C230;border-radius:2px;opacity:0;transform:scale(.4);transition:.3s}
.door.open .dpanel{background:var(--hz-night)}
.door.open .gtag{opacity:1;transform:none}
.door.locked .dpanel{animation:shake .4s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.clock{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:14px 0 6px}
.tick{display:grid;gap:4px;align-content:start;padding:24px 10px 0 0;position:relative;border-top:4px solid var(--accent)}
.tick::before{content:"";position:absolute;top:-12px;left:0;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--accent);box-sizing:border-box}
.tick.now::before{background:var(--bad);border-color:var(--bad)}
.tick .t{font-family:var(--f-display);font-weight:650;font-size:1.05rem}
.tick .d{font-size:.84rem;color:var(--muted);line-height:1.35}
.celebrate{display:flex;gap:14px;align-items:center;background:var(--ok-soft);border-radius:var(--r);padding:14px 16px;width:100%}
.celebrate .ic-wrap{flex:none;width:52px;height:52px;border-radius:50%;background:var(--surface);color:var(--ok);padding:8px;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.celebrate .ic-wrap,.door.locked .dpanel{animation:none}}

.ecard{background:#fff;color:#111;border:2px solid #1a1a1a;border-radius:14px;overflow:hidden;max-width:30rem;width:100%;font-family:var(--f-display);box-shadow:var(--shadow)}
.ec-row{display:grid;grid-template-columns:40% 60%;border-top:1.5px solid #1a1a1a}
.ec-row:first-child{border-top:0}
.ec-row>span{padding:8px 12px}
.ec-c{font-weight:800;text-transform:uppercase;letter-spacing:.03em;text-align:center;display:flex;align-items:center;justify-content:center;border-right:1.5px solid #1a1a1a}
.ec-m{font-weight:700;text-transform:uppercase}
.ec-m small{display:block;text-transform:none;font-weight:500;font-size:.85rem;margin-top:2px}
.ec-m ul{margin:2px 0 0;padding-left:1.1rem;text-transform:none;font-weight:400;font-size:.88rem;display:grid;gap:1px}
.ec-m li::marker{color:#111}
.ec-head span{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800;text-align:center;border-right:1.5px solid #1a1a1a}
.ec-head span:last-child{border-right:0}
@media print{.ecard{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* Immunization election form */
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:var(--shadow)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vcard{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;box-shadow:var(--shadow)}
.vcard:hover{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.vplay{flex:none;width:48px;height:48px;border-radius:50%;background:#C4302B;color:#fff;display:grid;place-items:center}
.vtxt{display:grid;gap:2px;min-width:0}
@media print{.video{display:none}}
.abts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.abt{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:6px;align-content:start;border-top:4px solid var(--accent)}
.abt-h{display:grid;gap:2px}
.abt-h b{color:var(--head);font-size:1.02rem}
.abt ul{margin:0;padding-left:1.1rem;display:grid;gap:2px}
@media (max-width:760px){.abts{grid-template-columns:minmax(0,1fr)}}
.imz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:22px}
.imz-v{display:grid;gap:10px;border:0;padding:0 0 18px;margin:0;min-width:0;border-bottom:1px solid var(--line)}
.imz-v legend{font-family:var(--f-display);font-weight:650;font-size:1.12rem;padding:0;margin-bottom:4px}
.imz-v .vis{font-size:.86rem;color:var(--muted)}
.imz-opts{display:grid;gap:8px}
.imz-sub{display:grid;gap:10px;padding:12px 14px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.imz-sub .field input,.imz-sub .field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:42px;width:100%;font:inherit;color:inherit}
.imz-sub .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.imz-decl{font-size:.92rem;background:var(--surface);border-left:4px solid var(--accent);padding:10px 12px;border-radius:0 6px 6px 0}
.imz-sign{display:grid;gap:12px}
.imz-sign .sig{font-family:var(--f-display);font-size:1.25rem;font-style:italic}
.imz-sum{display:grid;gap:6px}
.imz-sum table td:first-child{font-weight:700;white-space:nowrap}
.err{color:var(--bad);font-weight:700;font-size:.9rem}
.scr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.scr .row{gap:14px}
.gotopics{list-style:none;padding:0 !important;margin:8px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
.gotopics li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:3px 0}
.sform{display:grid}

function sortWidget(el, key){
  const S2 = SORTS[key]; let right=0, done=0;
  el.innerHTML = `<div class="act"><div class="act-head"><span class="eyebrow">Practice · not graded</span><b>${S2.title}</b><span class="small muted" id="${key}-score">0 of ${S2.items.length} answered</span></div>
    <div class="sort">${S2.items.map((it,i)=>`<div class="sc" data-i="${i}"><p>${esc(it[0])}</p><div class="row"><button class="btn sm" data-c="a">${S2.a}</button><button class="btn sm" data-c="b">${S2.b}</button></div><p class="why" hidden></p></div>`).join("")}</div>
    ${S2.note?`<p class="small"><b>${esc(S2.note)}</b></p>`:""}</div>`;
  el.querySelectorAll(".sc").forEach(card=>{
    card.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const it=S2.items[+card.dataset.i], ok=b.dataset.c===it[1];
      card.classList.add(ok?"good":"bad"); card.querySelectorAll("button").forEach(x=>{x.disabled=true; if(x.dataset.c===it[1]) x.classList.add("primary");});
      const w=card.querySelector(".why"); w.hidden=false; w.innerHTML=`<b>${ok?"Right.":"Not quite."}</b> ${esc(it[2])}`;
      done++; if(ok) right++;
      el.querySelector(`#${key}-score`).textContent = done===S2.items.length ? `You got ${right} of ${S2.items.length} right` : `${done} of ${S2.items.length} answered`;
    });
  });
}

    <ellipse cx="568" cy="300" rx="52" ry="12" fill="#8EC5E8" opacity=".8"/>
    <rect x="466" y="246" width="44" height="34" fill="#C9A06A" stroke="#9C7745" stroke-width="2"/><path d="M466 258h44" stroke="#9C7745" stroke-width="2"/>
    ${HAZARDS.map((h,i)=>`<g class="hz" data-i="${i}" tabindex="0" role="button" aria-label="Possible hazard ${i+1}"><circle cx="${h.x}" cy="${h.y}" r="36" fill="transparent"/><circle class="ring" cx="${h.x}" cy="${h.y}" r="30" fill="none" stroke-width="4"/><text class="num" x="${h.x}" y="${h.y-36}" text-anchor="middle">${i+1}</text></g>`).join("")}
  </svg></div>
  <ol class="hzlist" id="hzlist"></ol>
  <div class="row"><button class="btn sm" id="hzall">Show all hazards</button></div></div>`;
  const list=el.querySelector("#hzlist");
  const reveal=i=>{ if(found.has(i)) return; found.add(i); el.querySelector(`.hz[data-i="${i}"]`).classList.add("on");
    const h=HAZARDS[i]; list.insertAdjacentHTML("beforeend",`<li><b>${i+1}. ${h.t}.</b> ${h.d}</li>`);
    el.querySelector("#hzc").textContent = found.size===5 ? "All 5 found!" : `${found.size} of 5 found`; };
  el.querySelectorAll(".hz").forEach(g=>{ g.addEventListener("click",()=>reveal(+g.dataset.i)); g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault(); reveal(+g.dataset.i);} }); });
  el.querySelector("#hzall").onclick=()=>HAZARDS.forEach((h,i)=>reveal(i));
}

function doorsWidget(el){
  const rooms=["Room 104","Staff office","Public bathroom","Storage room","Linen closet","Room 105"];
  const LOCKED=3; let tries=0; const done=new Set();
  el.innerHTML = `<div class="act"><div class="act-head"><span class="eyebrow">Practice · not graded</span><b>Code Green: search the hallway</b><span class="small muted" id="dmsg">You've been handed yellow tags. Check every room.</span></div>
    <div class="doors">${rooms.map((r,i)=>`<button class="door" data-i="${i}"><span class="dpanel"><span class="knob"></span><span class="gtag" aria-hidden="true"></span></span><span class="dl">${r}</span></button>`).join("")}</div></div>`;
  const msg=el.querySelector("#dmsg");
  el.querySelectorAll(".door").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; if(done.has(i)) return;
    if(i===LOCKED && tries===0){ tries++; b.classList.add("locked"); msg.textContent="Locked! Don't skip it. Unlock it or find someone who can. (Tap again when maintenance arrives with the key.)"; return; }
    done.add(i); b.classList.remove("locked"); b.classList.add("open");
    msg.textContent = done.size===rooms.length ? "Every room checked, door left open, yellow tag on each. Report your findings back to the command nurse." : `${rooms[i]} checked: yellow tag on, door left open. ${rooms.length-done.size} to go.`;
  });
}

{
  id:"welcome", title:"Welcome, Mission & Values", tag:"28 Pa. Code §201.20", min:6,
  narration:`Welcome to Wesley Village, part of United Methodist Homes. We're glad you're here. Let's start with who we are. Our mission: We help people to live well while navigating life's changes with peace of mind, dignity, and connection in caring and vibrant communities. Our vision: Each and every day, we aspire to be the premier community empowering people to live their best lives. Caring and connecting remain a vital part of who we are and where we are headed, so our mission and vision run parallel to our tagline: Caring. Connecting. Community. Our values were created from employee workshops and surveys, from the voices of team members like you, and we have recommitted to them. We call them LIFT. L is for Learning: we are always learning. I is for Integrity: we act with integrity. F is for Financially Responsible: we use resources wisely. T is for Teamwork: we live and work as one. Be extraordinary. Care for each other. Make a difference. This orientation covers the education every employee needs before working with our residents, whatever department you work in. Pennsylvania regulation 28 Pa. Code section 201.20 requires education on the federal C M S training topics, plus accident prevention, restorative nursing, emergency preparedness, fire safety, resident rights, cultural competency, and any needs our facility assessment identifies. You will work through fifteen short modules. In each one you can read the material, or press Listen to hear it. Most modules end with a short knowledge check, and you need eighty percent to pass. You can retake any check. Some modules also ask you to acknowledge a policy. When every module is complete, you will take a twenty question final exam. Pass it, and you will receive a completion certificate to show your supervisor. Before you start, tell us a little about yourself so we can welcome you properly, and let us know whether you are CPR certified. If you are, bring your CPR card to Staff Development so we can add it to your file. Take your time, and ask your supervisor or Staff Development if anything is unclear.`,

{
  id:"rights", title:"Resident Rights & Grievances", tag:"F550–F585 · 28 Pa. Code §201.29", min:19,
  policies:[{label:"Resident Rights (rev. 02/2024)", file:"policies/resident-rights-policy.pdf"},{label:"Grievances (rev. 08/2017)", file:"policies/grievances-policy.pdf"}],
  narration:`United Methodist Homes recognizes each resident's right to a dignified existence, to self-determination, and to communicate with and have access to people and services inside and outside the facility. Our Resident Rights policy applies to every member of the nursing home staff, which includes employees, consultants, contractors, volunteers, and anyone else who gives care or services on our behalf. Every resident at Wesley Village has the right to dignity, respect, privacy, and self-determination. Those rights come alive through empathy. Empathy is the ability to understand and share what another person is feeling, to imagine yourself in their place. It's different from sympathy. Sympathy is feeling sorry for someone, from the outside looking in. It focuses on your own reaction, can feel like pity, and often rushes to cheer the person up. Empathy is feeling with someone. It focuses on their experience, listens first, acknowledges the feeling, and builds connection. Sympathy says, oh, you poor thing. Empathy says, that sounds really hard, tell me what it's been like for you. Imagine leaving your home, your neighbors, and most of your belongings, and having strangers help you bathe and dress. Empathy matters because it protects dignity, builds trust so residents tell you about pain, fears, and problems, eases distress by helping you find the need behind a behavior, and makes care personal instead of a task. Show empathy by slowing down and getting to eye level, using the name the resident prefers, knocking and explaining before you touch, naming their feelings, being patient with repeated questions, and learning each resident's story. Treat every resident the way you would want your own family treated. Residents have the right to be fully informed: about available services and their charges, facility rules, the address and phone number of the State Ombudsman and the state survey agency, survey reports, and any planned change of room or roommate. Information must be given in a language and format they understand. Residents have the right to participate in their own care. They can refuse medication and treatment, refuse physical and chemical restraints, and review their medical record. They may manage their own finances, and they have the right to privacy in their communication, their personal care, and their medical, personal, and financial affairs. A resident can only be transferred or discharged for specific reasons, and must receive thirty days' notice that includes the reason, the date, where they are going, the right to appeal, and the ombudsman's contact information. Residents may receive visitors of their choosing, and they may also refuse visitors. They make their own everyday choices, such as what to wear and how to spend their time. Residents also have the right to complain without fear of reprisal. A grievance is any complaint expressing dissatisfaction, about care given, care not given, the behavior of staff or other residents, or anything else about their stay. If a resident or family member brings a grievance to you, you are obligated to help them report it, either by completing a written or electronic grievance form, or by contacting our Grievance Official, Nancy Gartland, Director of Social Services. Notify your supervisor at the time of the complaint. Simple requests, like a food choice, can be handled right away. Always reassure the resident that they will not face reprisal, and if you ever see reprisal happening, make sure the resident is safe and report it immediately. Residents can file grievances out loud or in writing, and anonymously, and they have the right to a written decision. If a complaint involves abuse, neglect, an unexplained injury, or missing property, it must be reported immediately as a possible abuse case, not handled only as a grievance. Pennsylvania adds its own resident rights rule, 28 Pa. Code section 201.29. A notice of resident rights must be posted near the entrances and on every floor, and each resident receives a personal copy of their rights. Residents must be told about changes in charges, verbally and in writing. While Pennsylvania only requires about thirty days' notice, we feel it's more appropriate to give sixty days, per United Methodist Homes policy. Residents on Medical Assistance cannot be charged a security deposit. Before a transfer, residents must be told whether the new facility accepts Medicare and Medical Assistance. Residents cannot take part in experimental research or treatment without Department of Health approval and their written informed consent, and they may refuse at any time. And every resident has the right to care without discrimination, including because of race, religion, age, sex, gender identity, disability, ability to pay, or use of a guide or support animal. If a resident asks you about charges, a transfer, or a research study, connect them with Social Services or the Business Office. Our policy adds more rights you will see every day. Residents receive their mail unopened. They have reasonable access to a telephone, including their own cell phone and a place to call without being overheard, and to the internet, email, and video calls. They keep and use their own belongings and furnishings as space and safety permit, in a homelike environment. They get written notice, with the reason, before their room or roommate changes, and they can refuse a room move that is only for the convenience of staff. They may share a room with their spouse, and a same-sex spouse is treated the same as any spouse. They may choose to work or not work, self-administer medications if the care team decides it is safe, and choose a representative. Residents are never charged for basic hygiene items like soap, toothpaste, deodorant, or incontinence supplies. Every staff member is responsible for the following. Report any possible violation of a resident's rights to your supervisor or the Grievance Official right away. Before a resident receives an item or service that costs extra, make sure they were told, out loud and in writing, that there is a charge and what it is. Support residents who face barriers, such as hearing problems, communication problems, or memory loss, in exercising their rights. Never hamper, pressure, treat differently, or retaliate against a resident for using their rights. Respect each resident's individuality and value their input. Watch for non-verbal communication. For example, if a resident who can't speak spits out food, that may be a choice, so offer something else. Explain health information in a way that is easy to understand. Support the resident's representative only to the extent of the authority they've been given, keep the resident involved, and report it if you believe a representative is not acting in the resident's best interest. Failing to protect a resident's rights can lead to discipline up to and including termination, removal of agency staff from our buildings, and reports to state and federal agencies. Two outside agencies protect residents. The Area Agency on Aging is the local county agency for older adults. Under Pennsylvania's Act 13, it receives and investigates reports of abuse, neglect, exploitation, and abandonment, and it's where the facility sends the written Act 13 report. Wesley Village is served by the Area Agency on Aging for Luzerne and Wyoming Counties. The Long-Term Care Ombudsman is a state-certified advocate who works for residents, not the facility. Ombudsmen help residents and families resolve complaints about care and rights. Residents may contact the Ombudsman at any time, and you must never discourage them from doing so. Some key terms. Resident rights are the civil and legal rights of nursing home residents. Exercising rights means residents have autonomy and choice, as much as possible, about how they live and receive care. Person-centered care puts the resident at the center of control and supports them in making their own choices. Residents have the right to be treated with dignity, respect, and consideration at all times. Support their choices, like setting their own schedule, choosing what to wear, and deciding when to go to bed and get up. Respect their private space and property. Speak courteously and use the name the resident chooses. Never use terms of endearment like sweetie, honey, dolly, or darling, and never use labels like feeders. Focus on each resident as an individual, and talk to them while you provide care.`,
  ack:"I have read and understand the United Methodist Homes Resident Rights and Grievances policies. I will protect, promote and respect every resident's rights, report any possible rights violation right away, and help residents and families report grievances without fear of reprisal.",
  sections:[
    {h:"Our policy: United Methodist Homes Resident Rights", html:`<p>United Methodist Homes recognizes each resident's right to a <b>dignified existence, self-determination, and communication with and access to people and services inside and outside the facility</b>. We treat each resident with respect and dignity, recognize their individuality, and care for them in a way that maintains or improves their quality of life.</p>
      <p class="small muted">This policy applies to all <b>nursing home staff</b>: employees, consultants, contractors, volunteers, and anyone who provides care or services on our behalf.</p>`},
    {h:"The foundation", html:`<p>Residents have the right to <b>dignity, respect, privacy, self-determination, visitation, grievance resolution,</b> and <b>participation in care planning</b>. This is their home, and these rights belong to them.</p>`},
    {h:"Empathy: seeing through their eyes", html:`<p><b>Empathy</b> is the ability to understand and share what another person is feeling, to imagine yourself in their place. It's different from <b>sympathy</b>, which is feeling sorry for someone. Sympathy says "that's too bad." Empathy says "I understand, and I'm here with you."</p>
      <div class="acro">
        <div><b>Sympathy</b><ul class="small" style="margin-top:6px">
          <li>Feeling <b>sorry for</b> someone, from the outside looking in</li>
          <li>Focuses on your own reaction ("That's so sad")</li>
          <li>Can feel like pity and create distance</li>
          <li>Often tries to fix or cheer up quickly ("At least...", "Don't worry")</li>
          <li><i>Example:</i> "Oh, you poor thing. That's terrible."</li></ul></div>
        <div><b>Empathy</b><ul class="small" style="margin-top:6px">
          <li>Feeling <b>with</b> someone, imagining yourself in their place</li>
          <li>Focuses on their experience and what they need</li>
          <li>Builds connection and trust</li>
          <li>Listens first, acknowledges the feeling, stays present</li>
          <li><i>Example:</i> "That sounds really hard. Tell me what it's been like for you."</li></ul></div>
      </div>
      <div class="callout key"><b>Imagine moving in here</b><span>You've left your home, your neighbors and most of your belongings. Strangers help you bathe and dress. Someone else decides when meals are served. You may be in pain, grieving, or confused about where you are. How would you want to be treated?</span></div>
      <p><b>Why it matters</b></p>
      <ul><li><b>It protects dignity.</b> Residents' rights are lived out in small moments, like how you knock, speak, and touch.</li>
        <li><b>It builds trust.</b> Residents who feel understood are more likely to tell you about pain, fears, or problems, including grievances and abuse.</li>
        <li><b>It eases distress.</b> Many "behaviors" are a resident's way of communicating a need. Empathy helps you find the need behind it.</li>
        <li><b>It improves care.</b> When you understand how a resident feels, you notice changes sooner and care feels personal, not like a task.</li>
        <li><b>It's how we'd want our own family treated.</b></li></ul>
      <p><b>Empathy in action</b></p>
      <ul><li>Slow down. Sit or kneel at eye level and give your full attention.</li>
        <li>Call residents by the name they prefer. Knock and wait before you enter.</li>
        <li>Explain what you're going to do before you touch them, and ask permission.</li>
        <li>Name the feeling: "It sounds like you really miss your home."</li>
        <li>Be patient with repeated questions. Each time may feel like the first time to them.</li>
        <li>Learn their story: their work, family, faith, and what comforts them.</li></ul>`},
    {h:"Key terms", html:`<dl class="acro" style="display:block">
      <div style="margin-bottom:10px"><b>Resident rights</b><p class="small" style="margin-top:4px">The civil and legal rights of nursing home residents.</p></div>
      <div style="margin-bottom:10px"><b>Exercising rights</b><p class="small" style="margin-top:4px">Residents have autonomy and choice, to the maximum extent possible, about how they live their everyday lives and receive care, within facility rules that don't violate a regulation.</p></div>
      <div><b>Person-centered care</b><p class="small" style="margin-top:4px">Care that puts the <b>resident at the center of control</b>, supporting them in making their own choices and having control over their daily lives.</p></div></dl>`},
    {h:"Treatment with dignity and respect", html:`<p>Residents have the right to be treated with <b>dignity, respect, and consideration at all times</b>. A person-centered approach is critical to helping each resident maintain and enhance their dignity and self-esteem. Support every resident in making choices, and honor their wishes.</p>
      <div class="acro">
        <div><b>Support their choices</b><ul class="small" style="margin-top:6px">
          <li>Let residents set their <b>own schedules</b></li>
          <li>Let them <b>choose what to wear</b></li>
          <li>Let them decide <b>when to go to bed and get up</b></li>
          <li>Involve them in their <b>plan of care</b> and honor their wishes</li></ul></div>
        <div><b>Show respect every time</b><ul class="small" style="margin-top:6px">
          <li>Respect their <b>private space and property</b>: knock and wait, close the curtain or door</li>
          <li><b>Speak courteously</b> and use the <b>name the resident chooses</b></li>
          <li><b>No terms of endearment</b>: not "sweetie," "honey," "dolly," or "darling"</li>
          <li><b>No labels</b> like "feeders" or "the 2 a.m. wanderer"</li>
          <li><b>Talk to the resident</b> while you give care, not over or about them</li></ul></div>
      </div>
      <div class="callout key"><b>Small moments, big difference</b><span>Keep residents covered during care, sit at eye level when helping with meals, say "clothing protector" instead of "bib," cover catheter bags, and answer call lights promptly.</span></div>`},
    {h:"Right to be fully informed", html:`<ul>
      <li>Available services and the charges for each</li>
      <li>Facility rules, including a written copy of resident rights</li>
      <li>Address and phone number of the State Ombudsman and state survey agency</li>
      <li>State survey reports and the facility's plan of correction</li>
      <li>Advance notice of a change in room or roommate</li>
      <li>Help if a sensory impairment exists, and information in a language they understand (Spanish, Braille, etc.)</li></ul>`},
    {h:"Right to participate in their own care", html:`<ul>
      <li>Receive adequate and appropriate care, and be told of all changes in medical condition</li>
      <li>Take part in their assessment, care planning, treatment, and discharge</li>
      <li><b>Refuse medication and treatment</b></li>
      <li><b>Refuse chemical and physical restraints</b></li>
      <li>Review their own medical record</li></ul>`},
    {h:"Finances, privacy and confidentiality", html:`<ul>
      <li>Be free from charges for services covered by Medicaid or Medicare</li>
      <li>Manage their own financial affairs</li>
      <li>Private, unrestricted communication with anyone they choose</li>
      <li>Privacy during treatment and personal care, and about medical, personal, and financial affairs</li></ul>`},
    {h:"Transfers and discharges", html:`<p>A resident may remain in the facility unless a transfer or discharge is:</p>
      <ol><li>Necessary for the resident's welfare</li><li>Appropriate because their health has improved and they no longer need nursing home care</li><li>Needed to protect the health and safety of other residents or staff</li><li>Required because, after reasonable notice, they have not paid for an item or service they requested</li></ol>
      <div class="callout key"><b>30-day notice</b><span>Residents receive 30 days' notice that includes the reason, effective date, destination, the right to appeal, and the name, address, and phone number of the State Long-Term Care Ombudsman. The facility must prepare them for a safe transfer.</span></div>`},
    {h:"Dignity, visits and independent choices", html:`<ul>
      <li>Freedom from mental and physical abuse, corporal punishment, involuntary seclusion, and restraints</li>
      <li>Security of their possessions</li>
      <li>Visits from their physician, the state survey agency, the ombudsman, relatives, friends, and service providers. <b>Residents may also refuse visitors.</b></li>
      <li>Personal decisions such as what to wear and how to spend free time</li>
      <li>Choose a physician, join community activities, and organize or join a Resident Council</li></ul>`},
    {h:"Pennsylvania resident rights (28 Pa. Code §201.29)", html:`<p>Pennsylvania's nursing home rule adopts the federal resident rights (42 CFR 483.10, the F-tags above) and adds a few of its own. Current version effective <b>July 1, 2023</b>.</p>
      <div class="acro">
        <div><b>Posted &amp; given in writing</b><p class="small" style="margin-top:6px">A notice of resident rights is posted <b>near the entrances and on every floor</b>. Each resident gets a <b>personal copy</b>, documented in their medical record. Our resident rights policies are available to residents, staff and the public.</p></div>
        <div><b>Care without discrimination</b><p class="small" style="margin-top:6px">Including because of <b>race, religion, age, sex, gender identity, disability, ability to pay,</b> or use of a <b>guide or support animal</b>.</p></div>
        <div><b>Charges &amp; deposits</b><p class="small" style="margin-top:6px">Changes in charges are explained <b>verbally and in writing</b>. While Pennsylvania only requires about <b>30 days</b>' notice, we feel it's more appropriate to give <b>60 days</b>, per UMH policy. Any security deposit needs a written agreement on how it's used and returned. <b>No security deposit</b> for residents on Medical Assistance.</p></div>
        <div><b>Transfers</b><p class="small" style="margin-top:6px">Before a transfer, the resident is told whether the receiving facility participates in <b>Medicare and Medical Assistance</b>.</p></div>
        <div style="grid-column:1/-1"><b>Experimental research or treatment</b><p class="small" style="margin-top:6px">Only with <b>Department of Health approval</b> and the resident's <b>written informed consent</b>, after being fully told what it involves. The resident may <b>refuse before or during</b> treatment.</p></div>
      </div>
      <div class="callout key"><b>Your part</b><span>Treat every resident equally, know where the rights posting is on your unit, and if a resident or family asks about charges, a transfer, or a research study, connect them with <b>Social Services</b> or the <b>Business Office</b>.</span></div>`},
    {h:"More rights you'll see every day", html:`<div class="acro">
        <div><b>Communication</b><ul class="small" style="margin-top:6px">
          <li>Receive mail and packages <b>unopened</b></li>
          <li>Use a telephone, including their own cell phone, in a place where they <b>won't be overheard</b></li>
          <li>Reasonable access to the <b>internet, email and video calls</b></li>
          <li>Visit with whomever they choose, and refuse visitors at any time</li></ul></div>
        <div><b>Home and belongings</b><ul class="small" style="margin-top:6px">
          <li>A safe, clean, comfortable, <b>homelike</b> environment</li>
          <li>Keep and use personal belongings and furnishings as space and safety permit</li>
          <li><b>Written notice with the reason</b> before a room or roommate change</li>
          <li>Refuse a room move made <b>only for staff convenience</b></li>
          <li>Share a room with a spouse or roommate of choice when possible; a <b>same-sex spouse</b> is treated the same as any spouse</li></ul></div>
        <div><b>Choices</b><ul class="small" style="margin-top:6px">
          <li>Choose to <b>work or not work</b> for the facility</li>
          <li><b>Self-administer medications</b> if the care team decides it is safe</li>
          <li>Accept, request, refuse or stop treatment, and make an <b>advance directive</b></li>
          <li>Choose a <b>representative</b> to help with decisions</li>
          <li>See the latest <b>state survey results</b>, which are posted</li></ul></div>
        <div><b>Money</b><ul class="small" style="margin-top:6px">
          <li>Manage their own money, or have the facility hold it safely <b>if they choose</b></li>
          <li>Be told <b>in advance</b> about changes to their bill</li>
          <li>Refunds due within <b>30 days</b> of discharge</li>
          <li><b>Never charged</b> for basic hygiene items: soap, shampoo, comb and brush, toothbrush and toothpaste, denture supplies, deodorant, lotion, razor, tissues, towels, incontinence supplies, basic laundry and more</li></ul></div>
      </div>`},
    {h:"What every staff member must do", html:`<p>Our policy assigns these responsibilities to <b>all staff</b>, in every department:</p>
      <ol class="steps">
        <li><span><b>Report any possible rights violation</b> right away to your supervisor or the Grievance Official. Abuse, neglect, injuries of unknown source and missing property follow the abuse reporting steps.</span></li>
        <li><span><b>Extra charges:</b> before a resident gets an item or service that costs extra, make sure they've been told, <b>out loud and in writing</b>, that there's a charge and what it is.</span></li>
        <li><span><b>Support residents who face barriers</b> (hearing, communication, memory or cognition) so they can still use their rights. A resident found incompetent can still assert rights as far as they're able.</span></li>
        <li><span><b>Never hamper, pressure, treat differently, or retaliate</b> against a resident for using their rights.</span></li>
        <li><span><b>Respect each resident's individuality</b> and value their input. Adjust how you interact for their physical limits, make sure you're understood, and always stay respectful.</span></li>
        <li><span><b>Watch for non-verbal communication.</b> If a resident who can't speak spits out food, that may be a choice: offer another option.</span></li>
        <li><span><b>Explain health information</b> in ways the resident and their representative can easily understand.</span></li></ol>`},
    {h:"Resident representatives", html:`<ul>
      <li>A representative (for example a power of attorney, guardian, or someone the resident chose) acts <b>only within the authority</b> given by the resident or a court</li>
      <li>The resident keeps every right not delegated, can make decisions outside the representative's authority, and can revoke the delegation if not found incompetent by a court</li>
      <li>Keep the resident involved in care planning, and consider their wishes</li>
      <li><b>Report it</b> if you believe a representative is not acting in the resident's best interest</li></ul>`},
    {h:"If rights aren't protected", html:`<div class="callout warn"><b>Consequences</b><span>Failing to protect, promote and respect resident rights can lead to <b>discipline up to and including termination</b>. For agency and contract staff, it's reported to their employer and may end their work at United Methodist Homes. Violations may also be reported to state and federal agencies.</span></div>`},
    {h:"Grievances: what you must do", html:`<p>A <b>grievance</b> is a complaint expressing dissatisfaction: about care given or not given, the behavior of staff or other residents, management of funds, lost clothing, a violation of rights, or anything else about the resident's stay. A complaint said out loud to you counts. It doesn't have to be in writing.</p>
      <ol class="steps">
        <li><span><b>Help them report it.</b> Complete a written or electronic grievance form with them, or contact the Grievance Official: <b>Nancy Gartland, Director of Social Services</b>.</span></li>
        <li><span><b>Notify your supervisor</b> at the time of the complaint so it can be investigated promptly.</span></li>
        <li><span><b>Reassure the resident</b> they will not face discrimination or reprisal for speaking up.</span></li></ol>
      <p>Simple complaints (a food choice, a caregiver request) can be handled immediately by the staff member who receives them.</p>
      <div class="callout warn"><b>If the complaint involves abuse, neglect, an injury of unknown source, or missing property</b><span>It is no longer only a grievance. Report it immediately to the Charge Nurse or Nursing Supervisor (see the Abuse Prevention module).</span></div>`},
    {h:"What residents are told about grievances", html:`<ul>
      <li>They may file a grievance <b>orally or in writing</b>, and <b>anonymously</b></li>
      <li>How to reach the Grievance Official, and how long a review is expected to take</li>
      <li>They have the right to a <b>written decision</b>: what was investigated, what was found, whether it was confirmed, and what is being done</li>
      <li>They may also go to outside agencies: the State Survey Agency, the Quality Improvement Organization, and the State Long-Term Care Ombudsman</li>
      <li>Resident and family groups can raise concerns and recommendations about facility policies, and the facility must consider them and respond</li></ul>
      <p>The Grievance Official keeps grievance information confidential, including the identity of anyone who files anonymously. If you witness reprisal against a resident who complained, make sure they're safe and report it immediately to the Grievance Official, Administrator, or Compliance Officer.</p>`},
    {h:"Who advocates for residents outside our walls", html:`<div class="acro">
        <div><b>Area Agency on Aging (AAA)</b><p class="small" style="margin-top:6px">The local county agency that serves older adults. Under Pennsylvania's Older Adults Protective Services Act (Act 13), the AAA <b>receives and investigates reports of abuse, neglect, exploitation and abandonment</b>. It's where the facility sends the written Act 13 report (within 48 hours). AAAs also run Pennsylvania's local Ombudsman programs.</p>
          <p class="small"><b>Wesley Village's AAA:</b> Area Agency on Aging for Luzerne and Wyoming Counties, 570-822-1158 or 1-800-252-1512.</p></div>
        <div><b>Long-Term Care Ombudsman</b><p class="small" style="margin-top:6px">A <b>federally mandated, state-certified advocate for residents</b> (staff, volunteers, or trained resident peers called PEER). Ombudsmen listen to residents and families, help resolve complaints about care or rights, educate, and investigate. They work <b>for the resident</b>, not the facility.</p>
          <p class="small">Residents may contact the Ombudsman at any time, and the Ombudsman may visit and speak with residents privately. <b>Never discourage a resident from contacting them</b>; that's reprisal.</p></div>
      </div>
      <p class="small muted">Both contacts are posted in the facility and given to residents on admission. The state's 24/7 Elder Abuse Helpline is 1-800-490-8505.</p>`}
  ],
  quiz:[
    {q:"A resident tells you the night shift keeps ignoring her call light. What should you do?",
     o:["Tell her you'll mention it at the next staff meeting","Help her report it (grievance form or the Grievance Official) and notify your supervisor now","Explain that the night shift is short-staffed","Nothing; it happened on a different shift"],a:1,
     w:"Every staff member must help the resident report a grievance and notify a supervisor at the time of the complaint."},
    {q:"Who is Wesley Village's Grievance Official?",o:["The Administrator","Nancy Gartland, Director of Social Services","The charge nurse on duty","The Compliance hotline"],a:1,
     w:"Nancy Gartland, Director of Social Services, is the Grievance Official."},
    {q:"Which of these is a resident right?",o:["Residents must see any visitor their family sends","Staff choose residents' clothing to save time","Residents may refuse medication and treatment","Only staff may review a resident's medical record"],a:2,
     w:"Residents have the right to refuse medication, treatment, and restraints, to refuse visitors, to make their own choices, and to review their own record."},
    {q:"How much notice must a resident receive before a transfer or discharge?",o:["7 days","14 days","30 days","No notice is required"],a:2,
     w:"Thirty days' notice, including the reason, date, destination, appeal rights, and ombudsman contact information."},
    {q:"A daughter mentions her mother would prefer soup instead of a sandwich at lunch. This is:",o:["A simple complaint you can handle right away","Something to ignore unless it's written down","A matter only the Administrator can address","Abuse that must be reported"],a:0,
     w:"Simple complaints such as food choices can be handled immediately by the staff member who receives them."},
    {q:"A son tells you, without filling out a form, that $40 is missing from his father's drawer. You should:",o:["Wait until he files a written grievance","Report it immediately to the Charge Nurse or Nursing Supervisor as possible misappropriation","Tell him to check the laundry","Handle it yourself by searching other rooms"],a:1,
     w:"Spoken complaints count, and missing money is possible misappropriation, which must be reported immediately."},
    {q:"Under Pennsylvania's resident rights rule, which is a protected reason residents may not be treated differently?",o:["Gender identity","Their ability to pay","Use of a guide or support animal","All of these"],a:3,
     w:"28 Pa. Code §201.29 guarantees care without discrimination, including race, religion, age, sex, gender identity, disability, ability to pay, and use of a guide or support animal."},
    {q:"Pennsylvania requires about 30 days' notice before a change in charges. How much notice does UMH policy give?",o:["24 hours, verbally","30 days","60 days, in writing","No notice is needed"],a:2,
     w:"While Pennsylvania only requires about 30 days, UMH policy gives 60 days' written notice because we feel it's more appropriate."},
    {q:"Where must the notice of resident rights be posted?",o:["Only in the Administrator's office","Near the entrances and on every floor","In the staff break room","It doesn't need to be posted"],a:1,
     w:"The notice of resident rights is posted in a conspicuous place near the entrances and on each floor."},
    {q:"A new resident is tearful and says, \"I just want to go home.\" Which response shows empathy?",o:["\"Don't cry, you'll like it here.\"","\"Everyone feels that way. You'll get over it.\"","Sitting with her and saying, \"It sounds like you really miss your home. Tell me about it.\"","Changing the subject to lunch"],a:2,
     w:"Empathy means understanding and acknowledging the feeling, not dismissing it. Sit with her, name the feeling, and invite her to share."},
    {q:"What is the main difference between empathy and sympathy?",o:["There is no difference","Sympathy is feeling sorry for someone; empathy is understanding and feeling with them","Empathy means agreeing with everything a resident says","Sympathy is more professional than empathy"],a:1,
     w:"Sympathy is feeling sorry for someone from the outside. Empathy is imagining yourself in their place and feeling with them, which builds trust."},
    {q:"A resident with advanced dementia who can't speak keeps spitting out her lunch. What should you do?",o:["Keep feeding her the same meal","Note it may be her choice and offer another option","Skip her lunch","Wait until a family member visits"],a:1,
     w:"Our policy says to observe non-verbal communication. Spitting out food may be a choice, so offer an alternative."},
    {q:"A resident asks you for an item the facility charges extra for. Before he gets it, you make sure:",o:["His family approves","He's been told out loud and in writing that there's a charge and what it is","He pays you in cash","Nothing; just give it to him"],a:1,
     w:"Before a billable item or service, the resident must be informed orally and in writing about the charge and the amount."},
    {q:"Housekeeping wants to move a resident to another room only because it's easier for staff. The resident:",o:["Must move","Can refuse a move made only for staff convenience","Must pay to stay","Has no say in room assignments"],a:1,
     w:"Residents may refuse a room transfer made solely for staff convenience, and get written notice with the reason before any room or roommate change."},
    {q:"Which item can a resident be charged for?",o:["Toothpaste and deodorant","Incontinence supplies","Basic personal laundry","A private phone line or TV they request"],a:3,
     w:"Basic hygiene items, incontinence supplies and basic laundry are never charged. Personal items they request, like a phone or TV, can be."},
    {q:"Who does the Long-Term Care Ombudsman work for?",o:["The facility","The Department of Health inspectors","The resident","The resident's insurance company"],a:2,
     w:"The Ombudsman is a state-certified advocate who works for the resident and helps resolve complaints about care and rights."},
    {q:"Under Pennsylvania's Act 13, which agency receives and investigates reports of abuse of older adults?",o:["The Area Agency on Aging","The facility's Business Office","Medicare","The local hospital"],a:0,
     w:"The county Area Agency on Aging receives and investigates Act 13 reports, including the facility's written report within 48 hours."},
    {q:"Which is the most respectful way to speak to a resident?",o:["\"Hi sweetie, time for your bath.\"","Using the name the resident has chosen","Calling her by her room number","Referring to her as one of the \"feeders\""],a:1,
     w:"Address residents by the name they choose. Avoid terms of endearment and labels like \"feeders.\""},
    {q:"You're helping a resident get dressed. Who decides what she wears?",o:["You, to save time","Her family","The resident","The charge nurse"],a:2,
     w:"Support residents in making basic choices, like what to wear and when to get up or go to bed."}
  ]
},
{
  id:"comm", title:"Communication & Cultural Competency", tag:"§483.95(a) · 28 Pa. Code §201.20(a)(5), (b)", min:14,
  narration:`Good care depends on good communication. Pennsylvania requires communication skills training for every new employee, and federal rules require it for all direct care staff. Communication is how residents tell us what they need, and how we keep them safe, comfortable, and in control of their own lives. Start every interaction the same way. Knock and wait. Approach from the front, at eye level. Say the resident's name and your own name, and explain what you are there to do. Use plain words and one idea at a time. Listen more than you talk, and give the resident time to answer. Watch body language, both theirs and yours. Then check that you were understood: ask the resident to tell you, in their own words, what will happen next. Many residents live with hearing loss. Get their attention before you speak, face them in good light, and don't cover your mouth. Speak clearly, a little slower and a little lower. Don't shout, because shouting distorts words. Turn down the TV, check that hearing aids are in, turned on, clean, and that the batteries work, and write things down if that helps. For residents with vision loss, say who you are when you enter and tell them when you leave. Describe what you are doing before you touch them. At meals, describe where food is on the plate using clock positions, like the potatoes are at three o'clock. Keep belongings where the resident expects them, and make sure glasses are clean and on. Residents with aphasia or other speech problems may understand more than they can say. Ask yes or no questions, give them time, use gestures, pictures, or a communication board, and never pretend to understand. Every resident has the right to information in a language they understand. If a resident does not speak English well, tell the nurse, who will arrange interpreter services. Don't rely on children, other residents, or untrained staff to interpret medical information. You are often the first to notice a change in a resident. Report changes to the nurse right away: new confusion, more sleepiness, not eating or drinking, new pain, falls, trouble breathing, changes in skin, or anything that just isn't normal for that person. Tell the nurse who it is, what you saw, when it started, and how it differs from usual. Families are part of our team. Be courteous, introduce yourself, and refer questions about medical care, test results, or the care plan to the nurse. Cultural competency means understanding and respecting each resident's culture, beliefs, language, and identity, and letting that shape the care we give. Residents come from many backgrounds and faiths, with different traditions about food, prayer, modesty, family roles, hair and skin care, and end-of-life. Some residents prefer a caregiver of the same gender for personal care. Some follow religious diets, such as kosher, halal, vegetarian, or no pork. Some pray at certain times, or keep religious items close. Lesbian, gay, bisexual, and transgender residents have the right to be addressed by the name and pronouns they use, and to have their partners and spouses treated like any other family. The most important skill is to ask, not assume. Ask, what's important for me to know about you? Avoid stereotypes, and remember every person is an individual. Pass what you learn on to the nurse so it can be added to the care plan. Discrimination of any kind, against residents, visitors, or coworkers, is never allowed. Report it to your supervisor right away.`,
  sections:[
    {h:"Why communication matters", html:`<p>Pennsylvania requires every new employee to be trained in <b>communication skills</b> (28 Pa. Code §201.20(b)), and federal rules require communication training for all direct care staff (42 CFR §483.95(a)). Communication is how residents tell us what they need, and how we keep them safe, comfortable and in control of their own lives.</p>`},
    {h:"Every interaction", html:`<ol class="steps">
      <li><span><b>Knock and wait.</b> Approach from the front, at eye level.</span></li>
      <li><span><b>Introduce yourself</b> by name, use the resident's preferred name, and explain why you're there.</span></li>
      <li><span><b>Use plain words</b>, one idea at a time. Skip medical jargon.</span></li>
      <li><span><b>Listen more than you talk.</b> Give the resident time to answer.</span></li>
      <li><span><b>Watch body language</b>: theirs and yours. A calm face and voice say "you're safe."</span></li>
      <li><span><b>Check understanding.</b> Ask the resident to tell you, in their own words, what happens next.</span></li></ol>`},
    {h:"Hearing, vision and speech loss", html:`<div class="acro">
      <div><b>Hearing loss</b><ul class="small" style="margin-top:6px"><li>Get their attention first; face them in good light</li><li>Speak clearly, a little slower and lower. <b>Don't shout</b></li><li>Turn down the TV or move somewhere quiet</li><li>Hearing aids: in, on, clean, working batteries</li><li>Write it down if that helps</li></ul></div>
      <div><b>Vision loss</b><ul class="small" style="margin-top:6px"><li>Say who you are when you enter, and when you leave</li><li>Describe what you'll do before you touch</li><li>At meals, use clock positions: "potatoes at 3 o'clock"</li><li>Keep belongings where the resident expects them</li><li>Glasses clean and on</li></ul></div>
      <div style="grid-column:1/-1"><b>Aphasia and speech problems</b><p class="small" style="margin-top:6px">Residents may understand much more than they can say. Ask <b>yes or no questions</b>, give them time, use gestures, pictures or a communication board. Don't finish their sentences, and <b>never pretend to understand</b>. Ask again, or try another way.</p></div></div>`},
    {h:"Language help", html:`<p>Every resident has the right to information <b>in a language they understand</b>. If a resident doesn't speak or read English well, <b>tell the nurse</b>, who arranges interpreter services.</p>
      <div class="callout warn"><b>Don't use children, other residents, or untrained staff to interpret medical information.</b><span>Mistakes in interpreting can harm a resident, and private information should stay private.</span></div>`},
    {h:"Report changes to the nurse", html:`<p>You're often the first to notice when something is different. Tell the nurse <b>right away</b> about:</p>
      <ul><li>New or worse confusion, or more sleepiness than usual</li><li>Not eating or drinking</li><li>New pain, a fall, or trouble breathing</li><li>Skin changes: redness, bruises, open areas</li><li>Changes in mood, toileting, or how they move</li><li>Anything that <b>just isn't normal</b> for that person</li></ul>
      <div class="callout key"><b>Tell the nurse: who, what, when, and what's different.</b><span>"Mrs. Lee in 112 is coughing and didn't eat breakfast. It started this morning. She usually eats everything."</span></div>`},
    {h:"Talking with families", html:`<p>Families are part of our team. Be courteous and introduce yourself. Refer questions about <b>medical care, test results or the care plan to the nurse</b>, and remember HIPAA: share information only with people the resident has approved.</p>`},
    {h:"Cultural competency", html:`<p><b>Cultural competency</b> means understanding and respecting each resident's culture, beliefs, language and identity, and letting that shape the care we give. Pennsylvania requires it as part of resident rights training (28 Pa. Code §201.20(a)(5)).</p>
      <div class="acro">
        <div><b>What it can look like</b><ul class="small" style="margin-top:6px"><li><b>Food</b>: kosher, halal, vegetarian, no pork, fasting days</li><li><b>Faith</b>: prayer times, religious items, clergy visits</li><li><b>Modesty</b>: a same-gender caregiver for personal care</li><li><b>Family</b>: who the resident wants involved in decisions</li><li><b>Personal care</b>: hair and skin care routines</li><li><b>End of life</b>: customs and rituals</li></ul></div>
        <div><b>Identity</b><p class="small" style="margin-top:6px">Lesbian, gay, bisexual and transgender residents have the right to be called by the <b>name and pronouns they use</b>, and to have partners and spouses treated like any other family. Veterans, people of every background and every generation bring their own history.</p></div></div>
      <div class="callout key"><b>Ask, don't assume.</b><span>"What's important for me to know about you?" Avoid stereotypes: every person is an individual. Share what you learn with the nurse so it's added to the care plan.</span></div>
      <p><b>Discrimination of any kind</b>, against residents, visitors or coworkers, is never allowed. Report it to your supervisor right away.</p>`},
    {h:"Practice", html:`<div data-widget="commsort"></div>`}
  ],
  quiz:[
    {q:"What's the best way to talk with a resident who has hearing loss?",o:["Speak louder until they hear you","Get their attention, face them in good light, and speak clearly, a little slower and lower","Talk from the doorway so you don't startle them","Ask a family member to repeat everything"],a:1,
     w:"Face the resident in good light and speak clearly. Shouting distorts words."},
    {q:"A resident's hearing aid doesn't seem to be working. What do you check first?",o:["Nothing. Tell the family to buy a new one","That it's in, turned on, clean, and the battery works, then tell the nurse if it still doesn't work","Turn the TV up","Write everything down from now on"],a:1,
     w:"Check that it's in, on, clean and has a working battery. Report it if it still doesn't work."},
    {q:"Serving a meal to a resident who is blind, you should:",o:["Feed her so she doesn't spill","Describe where each food is using clock positions","Say nothing so she has privacy","Put everything in one bowl"],a:1,
     w:"Clock positions (\"the potatoes are at 3 o'clock\") help residents with vision loss eat independently."},
    {q:"A resident who speaks only Spanish needs to understand a new medication. You:",o:["Ask his roommate, who speaks Spanish","Ask his 10-year-old granddaughter","Tell the nurse, who arranges interpreter services","Speak slowly in English"],a:2,
     w:"Residents have the right to information in a language they understand. Use interpreter services, not children, residents or untrained staff."},
    {q:"Mr. Ruiz is more confused than usual and didn't eat lunch. You:",o:["Wait to see if he's better tomorrow","Tell the nurse right away: who, what you saw, when it started, and how it's different","Write it on a sticky note","Tell his family at their next visit"],a:1,
     w:"Changes from a resident's normal must be reported to the nurse right away."},
    {q:"A resident with aphasia is struggling to find a word. You:",o:["Finish the sentence for her","Ask yes or no questions and give her time","Pretend you understood","Come back another day"],a:1,
     w:"Give time, ask yes or no questions, and use gestures or pictures. Never pretend to understand."},
    {q:"Cultural competency means:",o:["Treating every resident exactly the same way","Learning and respecting each resident's culture, beliefs and preferences, and asking instead of assuming","Knowing every religion's rules","Only matching staff and residents from the same background"],a:1,
     w:"Ask, don't assume. Every person is an individual, and their culture shapes what good care means to them."},
    {q:"A resident declines pork at dinner for religious reasons. You:",o:["Tell her it's all that's left","Respect it, offer an alternative, and let the nurse or Dietary know so her preferences are recorded","Scrape it off the plate","Ask her to make an exception today"],a:1,
     w:"Respect religious and cultural food practices and make sure they're recorded in her care plan and diet order."},
    {q:"A resident's daughter asks you about her mother's lab results. You:",o:["Tell her what you know","Refer her to the nurse","Show her the chart","Tell her to call the doctor's office"],a:1,
     w:"Refer medical questions and test results to the nurse."}
  ]
},
{
  id:"abuse", title:"Abuse Prevention", tag:"F600–F610 · PA OAPSA (Act 13)", min:22,
  policy:{label:"Abuse, Neglect, Misappropriation of Resident Property, Exploitation, and Crime (rev. 06/2023)", file:"policies/abuse-neglect-exploitation-policy.pdf"},
  narration:`United Methodist Homes honors, supports, and enforces every resident's right to be free from abuse, neglect, misappropriation of their property, and exploitation. That includes freedom from corporal punishment, involuntary seclusion, and any physical or chemical restraint that isn't needed to treat the resident's symptoms. Abuse is the willful infliction of injury, unreasonable confinement, intimidation, or punishment that results in physical harm, pain, or mental anguish. It also includes depriving a resident of goods or services they need. Willful means the person acted deliberately. It does not mean they intended to cause harm. Abuse can be verbal, physical, sexual, or mental, and it includes abuse carried out through technology, such as taking or sharing demeaning photos or recordings of residents. Neglect is failing to provide the goods and services a resident needs to avoid physical harm, pain, mental anguish, or emotional distress. Exploitation is taking advantage of a resident for personal gain through manipulation, intimidation, threats, or coercion. Misappropriation is using a resident's belongings or money without their consent, including taking their medications. Accepting money from a resident, for any reason, must be reported. Watch for warning signs: unexplained bruises, especially on both arms, the inner thighs, or in the shape of a hand; fear of a caregiver; a sudden change in behavior; weight loss or dehydration without a medical cause; untreated pressure sores; poor hygiene; and missing money or possessions. Allegations must never be dismissed because a resident has dementia. If you witness or suspect abuse: stop it, and make sure the resident is safe. Then report it immediately to the Charge Nurse or Nursing Supervisor. If your concern involves your supervisor, go to the department director or the Administrator. Don't question the resident or witnesses yourself, and preserve any evidence. If sexual abuse is suspected, do not change the resident's clothing, bathe them, brush their teeth, or remove bedding. Reporting is time sensitive. Abuse, or anything causing serious bodily injury, must reach the state within two hours. Other allegations must reach the state within twenty-four hours. Under federal law and Pennsylvania's Older Adults Protective Services Act, the duty to report belongs to you personally, not only to the facility. Your report is handled confidentially, and you are protected from retaliation when you report in good faith. Failing to report can lead to termination, action against your professional license, and for a suspected crime, fines or jail. Committing abuse leads to termination. You are expected to cooperate with every investigation and give a signed, dated written statement, and never speak to the media about an incident. Pennsylvania recognizes seven forms of abuse of older adults, and every one must be reported. One, physical abuse: force that causes unnecessary pain or injury, including rough handling and misusing medications or restraints. Two, sexual abuse, including sexual harassment: any unwanted sexual contact or behavior. Three, emotional or psychological abuse, which includes verbal and mental abuse: yelling, insults, threats, treating an adult like a child, ignoring or isolating a resident, and demeaning photos or videos. Four, financial exploitation, including misappropriation: taking or using a resident's money, belongings, or medications without consent, or pressuring them for loans or gifts. Five, caregiver neglect: failing to provide the care a resident needs, like turning, toileting, feeding, or answering call lights. Six, self-neglect: a resident failing to meet their own basic needs, such as repeatedly refusing meals or care. Residents have the right to refuse, so never force care, but always tell the nurse. Seven, abandonment: a caretaker deserting a resident, such as walking off a shift without being relieved, or leaving a resident alone on an outing. Federal rules also use the terms verbal abuse, mental abuse, misappropriation, involuntary seclusion, and restraints used for discipline or convenience. Abuse can be committed by anyone: other residents, visitors, family members, staff, and volunteers. Prevent abuse by taking care of yourself. If you feel frustrated or angry with a resident, make sure they're safe, step away, and ask a coworker to take over. Never provide care while you're upset.`,
  sections:[
    {h:"Our policy", html:`<p>United Methodist Homes' skilled nursing facilities <b>honor, support and enforce</b> each resident's right to be free from abuse, neglect, misappropriation of resident property, and exploitation, including freedom from corporal punishment, involuntary seclusion, and any physical or chemical restraint not required to treat the resident's symptoms.</p>
      <div class="callout key"><b>Abuse</b><span>The willful infliction of injury, unreasonable confinement, intimidation, or punishment with resulting physical harm, pain, or mental anguish. It also includes <b>depriving a resident of goods or services</b> needed for their physical, mental, and psychosocial well-being, and abuse <b>carried out through technology</b>.</span><span><b>Willful</b> means the person acted deliberately. It does <i>not</i> mean they intended to cause harm.</span></div>`},
    {h:"The 7 forms of abuse in Pennsylvania", html:`<p>Pennsylvania's Older Adults Protective Services program recognizes these forms of abuse. <b>Every one must be reported.</b></p>
      <div class="abts">
        <div class="abt"><div class="abt-h"><b>1. Physical abuse</b></div>
          <p class="small">Force that causes unnecessary pain, injury, or harm, including physical punishment. It can still be abuse even if the person believes they are helping.</p>
