          <p class="small"><b>In a nursing home this looks like:</b></p><ul class="small"><li>Hitting, slapping, pinching, kicking, shoving, or burning</li><li>Rough handling: yanking a resident up by the arm, forcing limbs during dressing</li><li>Misusing medications or restraints to control a resident</li><li>Force-feeding, or holding a resident down for care they refuse</li></ul>
          <p class="small"><b>Watch for:</b> unexplained bruises (especially on both arms, inner thighs, or in the shape of a hand), fractures, burns, fear of a particular caregiver</p></div>
        <div class="abt"><div class="abt-h"><b>2. Sexual abuse</b><span class="small muted">Includes sexual harassment</span></div>
          <p class="small">Any unwanted or non-consensual sexual contact, behavior, or activity. A resident who cannot consent cannot agree to sexual activity.</p>
          <p class="small"><b>In a nursing home this looks like:</b></p><ul class="small"><li>Unwanted touching, or touching during care that isn't part of care</li><li>Sexual comments, jokes, or advances toward a resident</li><li>Exposing a resident unnecessarily, or taking sexual or nude photos</li><li>Forcing a resident to view sexual material</li></ul>
          <p class="small"><b>Watch for:</b> bruising or bleeding in genital areas, torn or stained underclothing, trouble walking or sitting, fear or withdrawal around a certain person</p></div>
        <div class="abt"><div class="abt-h"><b>3. Emotional / psychological abuse</b><span class="small muted">Includes verbal and mental abuse</span></div>
          <p class="small">Words or behavior that cause emotional pain, fear, or distress.</p>
          <p class="small"><b>In a nursing home this looks like:</b></p><ul class="small"><li>Yelling at, insulting, mocking, or swearing at a resident</li><li>Threats: "If you keep pressing that call light, no one will come"</li><li>Treating an adult like a child, or repeatedly ignoring them</li><li>Isolating a resident from family, friends, or activities</li><li>Demeaning photos or videos, or posting them on social media</li></ul>
          <p class="small"><b>Watch for:</b> withdrawal, fearfulness, agitation, sudden changes in mood or behavior, a resident who stops talking around certain staff</p></div>
        <div class="abt"><div class="abt-h"><b>4. Financial exploitation</b><span class="small muted">Includes misappropriation</span></div>
          <p class="small">Using a resident's money, property, or belongings without informed consent, or with consent gained by pressure, trickery, or threats, for someone else's benefit.</p>
          <p class="small"><b>In a nursing home this looks like:</b></p><ul class="small"><li>Taking money, jewelry, or belongings from a resident's room</li><li>Diverting a resident's medications (for example, pain pills)</li><li>Using a resident's cards, checks, or accounts without permission</li><li>Pressuring a resident for "loans" or gifts, or accepting tips</li><li>Family or others changing wills, accounts, or deeds without consent</li></ul>
          <p class="small"><b>Watch for:</b> missing money or valuables, sudden changes in finances, unpaid bills, new "friends" or relatives taking over a resident's affairs</p></div>
        <div class="abt"><div class="abt-h"><b>5. Caregiver neglect</b></div>
          <p class="small">Failing to provide the goods or services a resident needs to avoid a serious threat to their physical or mental health.</p>
          <p class="small"><b>In a nursing home this looks like:</b></p><ul class="small"><li>Not following the care plan: turning, toileting, feeding, fluids</li><li>Ignoring call lights or requests for help</li><li>Leaving a resident in urine or feces</li><li>Not getting medical help when it's needed</li></ul>
          <p class="small"><b>Watch for:</b> pressure injuries, weight loss, dehydration, poor hygiene, soiled clothing or bedding, untreated health problems</p></div>
        <div class="abt"><div class="abt-h"><b>6. Self-neglect</b><span class="small muted">The most common form substantiated in PA</span></div>
          <p class="small">When an older adult fails to provide for their own basic needs in a way that seriously threatens their health or safety.</p>
          <p class="small"><b>In a nursing home this looks like:</b></p><ul class="small"><li>A resident repeatedly refusing meals, fluids, bathing, or medications</li><li>Hoarding food or items in a way that creates a health hazard</li><li>A resident who can't manage their own care but refuses help</li></ul>
          <p class="small"><b>Watch for:</b> weight loss, poor hygiene, refusals that put the resident at risk. <b>Residents have the right to refuse</b>, so never force care, but always tell the nurse so it can be addressed and care-planned</p></div>
        <div class="abt"><div class="abt-h"><b>7. Abandonment</b></div>
          <p class="small">The desertion of an older adult by a caretaker: the person responsible for their care leaves them without making sure someone else is caring for them.</p>
          <p class="small"><b>In a nursing home this looks like:</b></p><ul class="small"><li>Walking off your shift without being relieved, leaving residents without care</li><li>Leaving a resident alone and unsupervised on an outing or appointment</li><li>A family member or representative who drops off a resident and disappears</li></ul>
          <p class="small"><b>Watch for:</b> residents left unattended, a unit without assigned staff, a resident left waiting with no one responsible for them</p></div>
      </div>`},
    {h:"Federal terms you'll also hear", html:`<p>Federal nursing home rules (F600–F610) use these terms too. They overlap with the seven forms above.</p>
      <div class="tbl"><table><tbody>
      <tr><td><b>Verbal abuse</b></td><td>Disparaging or derogatory oral, written, or gestured language toward residents or their families, or within their hearing, regardless of their age, ability to understand, or disability.</td></tr>
      <tr><td><b>Mental abuse</b></td><td>Conduct that causes humiliation, intimidation, fear, shame, agitation, or degradation, including demeaning photos or recordings shared by text or social media.</td></tr>
      <tr><td><b>Misappropriation</b></td><td>Deliberately misplacing, taking, or using a resident's belongings or money without consent, including theft of eyeglasses, hearing aids, or phones, and <b>diverting medications</b>.</td></tr>
      <tr><td><b>Involuntary seclusion</b></td><td>Separating or confining a resident against their will (or their representative's).</td></tr>
      <tr><td><b>Chemical / physical restraint</b></td><td>A drug, device, or method used for <b>discipline or convenience</b> rather than to treat medical symptoms.</td></tr>
      <tr><td><b>Exploitation</b></td><td>Taking advantage of a resident for personal gain through manipulation, intimidation, threats, or coercion.</td></tr></tbody></table></div>
      <div class="callout warn"><b>Never accept money from a resident.</b><span>Staff accepting money for any reason, or a resident giving a gift to keep receiving care, must be reported as exploitation.</span></div>`},
    {h:"Who can be an abuser?", html:`<p>Abuse can be committed by <b>anyone</b> who comes in contact with a resident:</p>
      <ul><li><b>Other residents</b> (resident-to-resident abuse must be reported too)</li><li>Visitors</li><li>Family members</li><li>Facility and agency staff</li><li>Volunteers</li></ul>`},
    {h:"Warning signs", html:`<div class="acro">
      <div><b>Possible physical or sexual abuse</b><ul style="margin-top:8px"><li>Bruises on both arms, the inner thighs, or in the shape of a hand or object</li><li>Bruises in different stages of healing</li><li>Unexplained fractures, burns, cuts, or bite marks</li><li>Fear of a caregiver, or of being alone with one</li><li>A sudden change in behavior</li><li>Torn or stained underclothing; trouble walking or sitting</li></ul></div>
      <div><b>Possible neglect or exploitation</b><ul style="margin-top:8px"><li>Weight loss or dehydration without an illness-related cause</li><li>Untreated pressure sores or health problems</li><li>Poor personal hygiene</li><li>Missing money or valuables</li><li>Sudden changes in finances, or new "relatives" taking over affairs</li><li>A resident tells you it is happening</li></ul></div></div>
      <div class="callout key"><b>Injury of unknown source</b><span>Nobody saw it happen, the resident can't explain it, <b>and</b> it is suspicious because of where it is, how large it is, or how many injuries there are. These must be reported.</span><span><b>Never dismiss a report because the resident has dementia or memory problems.</b></span></div>
      <p class="small muted">Not every accident is abuse. A staff member who trips and falls onto a resident, or backs into a resident they didn't see, has not committed abuse. Report it anyway so it can be assessed.</p>`},
    {h:"Try it: report it or not?", html:`<div data-widget="reportit"></div>`},
    {h:"If you witness or suspect abuse", html:`<ol class="steps">
      <li><span><b>Stop the abuse and protect the resident.</b> Remove them from the unsafe situation, or keep the accused away from this and other residents.</span></li>
      <li><span><b>Report immediately to the Charge Nurse or Nursing Supervisor.</b> If the concern involves your supervisor, go to the department director or the Administrator.</span></li>
      <li><span><b>Don't investigate yourself.</b> Do not question the resident or witnesses; managers handle that.</span></li>
      <li><span><b>Preserve evidence.</b> Leave the area as untouched as possible.</span></li></ol>
      <div class="callout warn"><b>Suspected sexual abuse</b><span>Stay calm and supportive. Until the resident or their representative decides what to do, <b>do not change their clothing, bathe or shower them, brush their teeth, or remove bedding</b> or anything else from the scene.</span></div>`},
    {h:"Preventing abuse: take care of yourself", html:`<p>Caregiving is rewarding and demanding. Stress, fatigue, and short staffing are when patience runs thin and mistakes happen.</p>
      <ul><li><b>Feeling frustrated or angry with a resident?</b> Make sure they're safe, step away, and ask a coworker or your nurse to take over.</li>
      <li><b>Never provide care while you're upset.</b> Come back when you're calm.</li>
      <li>A resident who hits, yells or refuses care is usually communicating a need. Look for the cause (see the Dementia module).</li>
      <li>Talk to your supervisor if workload or stress is getting to you. Asking for help is a strength.</li></ul>`},
    {h:"Reporting deadlines", html:`${CLOCK_HTML}
      <p>Reports are timed by the clock, not business hours. The Charge Nurse or Supervisor notifies the Director of Nursing and Administrator, and the facility files the state reports, but <b>federal law and Pennsylvania's Older Adults Protective Services Act (Act 13) make reporting your personal duty as well.</b></p>
      <div class="tbl"><table><thead><tr><th>Situation</th><th>Must be reported</th></tr></thead><tbody>
      <tr><td>Alleged <b>abuse</b>, or anything resulting in <b>serious bodily injury</b></td><td class="num"><b>Within 2 hours</b></td></tr>
      <tr><td>Alleged neglect, exploitation, mistreatment, or misappropriation without serious bodily injury</td><td class="num"><b>Within 24 hours</b></td></tr>
      <tr><td>Reasonable suspicion of a <b>crime</b> against a resident</td><td>2 hours with serious bodily injury, otherwise 24 hours, to the Department of Health <i>and</i> local police</td></tr>
      <tr><td>PA Act 13: reasonable cause to suspect abuse</td><td>Immediate oral report to the Area Agency on Aging; written report within 48 hours</td></tr></tbody></table></div>
      <div class="tbl"><table><thead><tr><th>Agency</th><th>Phone</th></tr></thead><tbody>
      <tr><td>PA Department of Health (field office)</td><td class="num">1-570-963-4331</td></tr>
      <tr><td>Area Agency on Aging</td><td class="num">1-570-822-1158</td></tr>
      <tr><td>Long-Term Care Ombudsman</td><td class="num">1-570-550-3811</td></tr>
      <tr><td>Jenkins Township Police</td><td class="num">1-570-654-1281</td></tr></tbody></table></div>`},
    {h:"Your rights and responsibilities", html:`<ul>
      <li><b>Your report is confidential</b>, and you are protected from retaliation and from civil or criminal liability when you report in good faith. "Resident confidentiality" is never a reason not to report.</li>
      <li><b>Cooperate with investigations.</b> You'll be asked for a written statement, signed and dated, with your shift and job title.</li>
      <li><b>Do not speak to the media.</b> A designated spokesperson handles all inquiries.</li>
      <li><b>Feeling burned out or stressed?</b> Tell your supervisor. Recognizing frustration early is part of preventing abuse.</li></ul>
      <div class="callout warn"><b>Consequences</b><span><b>Committing</b> abuse, neglect, mistreatment, or a crime against a resident leads to termination and reports to state agencies and licensing boards.</span><span><b>Failing to report</b> leads to discipline up to termination and possible action against a professional license. Failing to report a suspected crime can bring fines, jail time, or both.</span></div>`}
  ],
  ack:"I have read and understand the United Methodist Homes policy on Abuse, Neglect, Misappropriation of Resident Property, Exploitation, and Crime, including my personal duty to report any suspicion immediately.",
  quiz:[
    {q:"In the definition of abuse, \"willful\" means:",o:["The person meant to cause injury","The person acted deliberately, whether or not they intended harm","The resident was able to understand what happened","A witness saw it happen"],a:1,
     w:"Willful means the individual acted deliberately; intent to injure is not required."},
    {q:"A coworker posts a photo of a resident in a compromised position to a private group chat. This is:",o:["Not abuse, because the resident didn't see it","Mental abuse that must be reported","Only a HIPAA issue","Fine if the coworker deletes it later"],a:1,
     w:"Taking or sharing demeaning photos or recordings of residents is mental abuse."},
    {q:"You see a staff member pinching a resident. After stopping it and making sure the resident is safe, you:",o:["Report at the end of your shift","Report immediately to the Charge Nurse or Nursing Supervisor","Talk to the coworker privately later","Interview other residents to collect evidence"],a:1,
     w:"Report immediately to the Charge Nurse or Nursing Supervisor. Don't investigate yourself."},
    {q:"Your concern involves your own supervisor. Who do you report to?",o:["Nobody; wait until they're off shift","The department director or the Administrator","The resident's family","A coworker"],a:1,
     w:"If the concern involves your supervisor, report to the department director or Administrator."},
    {q:"Alleged abuse, or anything causing serious bodily injury, must be reported to the state within:",o:["2 hours","24 hours","48 hours","5 working days"],a:0,
     w:"Abuse or serious bodily injury: immediately, and no later than 2 hours. Other allegations: within 24 hours."},
    {q:"A resident with dementia says a staff member hit her last night. You should:",o:["Ignore it; she's often confused","Report it immediately","Ask her to repeat the story to several coworkers first","Wait to see whether bruises appear"],a:1,
     w:"Allegations must never be dismissed because of a resident's cognitive impairment."},
    {q:"A resident tells you she was sexually assaulted. Until she or her representative decides what to do, you should NOT:",o:["Stay calm and supportive","Make sure she's safe","Help her shower and change clothes","Report it immediately"],a:2,
     w:"Do not change clothing, bathe, brush teeth, or remove bedding. These may be evidence."},
    {q:"A kind resident offers you $20 \"for being so good to me.\" What's right?",o:["Accept it if it's under $25","Accept it and share with the unit","Politely decline. Staff accepting money from a resident must be reported","Accept it but don't tell anyone"],a:2,
     w:"Staff accepting money from a resident, for any reason, is reportable exploitation."},
    {q:"How many forms of abuse does Pennsylvania's protective services program recognize?",o:["3","5","7","10"],a:2,
     w:"Physical, sexual, emotional/psychological, financial exploitation, caregiver neglect, self-neglect, and abandonment."},
    {q:"A CNA leaves in the middle of her shift without telling anyone, and her residents go without care. This is:",o:["Not abuse, just a policy issue","Abandonment","Self-neglect","Misappropriation"],a:1,
     w:"Abandonment is the desertion of an older adult by a caretaker, including leaving residents without care."},
    {q:"A resident has refused meals and fluids for two days. What should you do?",o:["Force her to eat","Ignore it; it's her right","Respect her right to refuse, but tell the nurse right away","Wait until the weekly care plan meeting"],a:2,
     w:"Repeated refusals that threaten health may be self-neglect. Never force care, but always report it so it can be addressed."},
    {q:"Telling a resident \"If you keep pushing that call light, no one is coming\" is:",o:["A joke","Emotional / psychological (verbal) abuse","Acceptable if the resident presses it often","Neglect only if they need help"],a:1,
     w:"Threats and intimidation are emotional, psychological and verbal abuse."},
    {q:"Who can commit abuse against a resident?",o:["Only staff","Only family","Anyone, including other residents, visitors, family, staff and volunteers","Only strangers"],a:2,
     w:"Abuse can be committed by anyone who comes in contact with a resident, including other residents."},
    {q:"You're exhausted and a resident keeps resisting care, and you feel yourself getting angry. You:",o:["Finish quickly anyway","Make sure the resident is safe, step away, and ask a coworker to take over","Raise your voice so they cooperate","Skip their care"],a:1,
     w:"Never provide care while you're upset. Make sure the resident is safe, step away, and get help."}
  ]
},
{
  id:"infection", title:"Infection Prevention", tag:"F880–F882 · OSHA 1910.1030", min:18,
  narration:`Infection prevention protects our residents and protects you. It includes hand hygiene, personal protective equipment, transmission-based precautions, outbreak response, surveillance, and antibiotic stewardship. OSHA's Bloodborne Pathogens Standard exists to reduce your exposure to Hepatitis B, Hepatitis C, H I V, and other bloodborne pathogens. It covers every employee who could reasonably be expected to contact blood or other potentially infectious materials as part of their job. Our written Exposure Control Plan is on the intranet and is reviewed every year. It covers engineering controls, work practices, Hepatitis B vaccination, post-exposure management, and standard precautions such as hand hygiene, P P E, waste disposal, cleaning, linen handling, cough etiquette, and safe injection practices. Hand hygiene is the single most important thing you do. You must use soap and water after caring for a resident with C diff or norovirus, before you eat, after you use the bathroom, and whenever your hands are visibly soiled. Alcohol-based hand rub can be used at any other time, including before and after care, after touching objects in a resident's area, after removing gloves or other P P E, and before any aseptic procedure. If you are exposed to blood or body fluid, flush and wash the area, and notify your supervisor immediately. The incident will be documented, and you will be referred for evaluation and follow-up at no cost to you. Departments that need N 95 respirators are fit tested on hire, every year, and whenever needed, such as when your mask model is no longer available, your weight changes, or you have extensive dental work. Finally, if you are sick, do not report to work. Contact your supervisor or the Staff Development and Employee Health Department for direction. Bloodborne pathogens are germs in human blood, like hepatitis B and H I V, that can cause serious disease. They enter through the eyes, mouth, mucous membranes, broken skin, or a puncture. They spread directly, through a cut, puncture, or splash, or indirectly, by touching a contaminated surface and then your eyes, mouth, or an open sore. Reduce your risk with frequent hand hygiene, the hepatitis B vaccine, which is offered all year even if you declined before, sharps safety features, and putting used sharps in a sharps box immediately. Wear gloves when touching blood, body fluids, or broken skin. Wear a gown when your clothing may be soiled, and a mask with goggles or a face shield when splashes are likely. Standard precautions mean treating everyone's blood and body fluids as potentially infectious. If it's wet and it comes from the human body, treat it as infectious. Contact precautions, for germs like MRSA, C diff, and norovirus, mean gloves when entering the room. Droplet precautions, for influenza and whooping cough, add a mask. Airborne precautions, for measles, chickenpox, and tuberculosis, require a fit-tested N 95 and a negative-pressure room. The biohazard symbol goes on regulated waste, refrigerators holding blood or specimens, and contaminated equipment. Here are the reminders our Infection Preventionist, Shannan Lord, shares most often from her unit rounds. Perform hand hygiene before entering and when exiting every resident's room, and every time you leave the dirty utility room. Never wear gloves or other P P E in the hallway; take them off before you leave the room. Keep the tops of clean linen carts completely clear. Never set anything on the hallway handrails, even for a moment, because handrails are easily contaminated. Dirty linen never goes on the floor; take it straight to the dirty utility room. Put dirty trays and cups in the dietary cart near Newing instead of leaving them in the lounges, and call Dietary if there's no cart. Every resident with a Foley catheter needs a privacy bag on their wheelchair and their bed. Always wear the required P P E in isolation rooms, and if an isolation room has no sign on the door, notify nursing immediately. Questions? Call Shannan Lord at extension 5276. If you have questions about bloodborne pathogens or our Exposure Control Plan, you have the right to ask. Call Shannan Lord, our Infection Preventionist, at extension 5276, or Staff Development. Tuberculosis, or TB, spreads through the air when a person with active TB coughs, sneezes, or talks. Latent TB infection has no symptoms and is not contagious. Active TB disease is contagious. Its signs include a cough lasting three weeks or more, coughing up blood, fever, night sweats, weight loss, and tiredness. You are screened for TB when you are hired. If you develop symptoms, tell Employee Health and don't come to work until you are cleared. If a resident has TB symptoms, tell the nurse right away and put a mask on the resident if they can tolerate it. The nurse will start airborne precautions, which require a fit-tested N 95.`,
  sections:[
    {h:"Bloodborne Pathogens Standard", html:`<p>OSHA's (Occupational Safety and Health Administration) Bloodborne Pathogens Standard reduces occupational exposure to <b>Hepatitis B, Hepatitis C, HIV</b> and other bloodborne pathogens. It covers every employee who could be <i>reasonably anticipated</i> to contact blood or other potentially infectious materials on the job.</p>
      <p>Our written <b>Exposure Control Plan</b> is on the Intranet and reviewed annually. It covers engineering controls, work practices, HBV vaccination, post-exposure management, and standard precautions: hand hygiene, PPE, waste disposal, cleaning and disinfection, laundry and linen, respiratory hygiene and cough etiquette, and safe injection practices.</p>`},
    {h:"", html:`<div class="callout key"><b>Questions about bloodborne pathogens or our Exposure Control Plan?</b><span>OSHA gives you the right to ask, and to get an answer from someone who knows. Call <b>Shannan Lord, Infection Preventionist, ext. 5276</b>, or Staff Development / Employee Health.</span></div>`},
    {h:"Bloodborne pathogens: how they spread", html:`<p><b>Bloodborne pathogens</b> are microorganisms in human blood that can cause disease, including <b>hepatitis B (HBV)</b> and <b>HIV</b>. They enter the body through the eyes, mouth, other mucous membranes, broken skin, or a puncture, and can cause serious illness or death.</p>
      <div class="acro">
        <div><b>Direct transmission</b><ul class="small" style="margin-top:6px"><li>A cut or puncture: a needlestick, broken glass</li><li>A splash onto broken skin or into the eyes, nose or mouth</li></ul></div>
        <div><b>Indirect transmission</b><ul class="small" style="margin-top:6px"><li>Touching a contaminated surface, then touching your eyes, mouth, or an open sore</li></ul></div></div>`},
    {h:"Reduce your risk", html:`<ul>
      <li><b>Perform hand hygiene often</b> (see below)</li>
      <li><b>Get vaccinated.</b> Hepatitis B vaccine is offered on hire and all year, <b>even if you declined it before</b>. Contact Staff Development. (See the Employee Immunizations module.)</li>
      <li><b>Use all safety features:</b> safety razors and safety mechanisms on sharps; follow manufacturers' instructions for equipment</li>
      <li><b>Put used sharps in a sharps box immediately</b></li>
      <li><b>Wear the right PPE</b> for the task</li></ul>
      <div class="acro">
        <div><b>Gloves</b><p class="small" style="margin-top:6px">Touching blood, body fluids, secretions, excretions, contaminated items, mucous membranes, or broken skin.</p></div>
        <div><b>Gown</b><p class="small" style="margin-top:6px">When your clothing or skin may contact blood, body fluids, secretions or excretions.</p></div>
        <div style="grid-column:1/-1"><b>Mask with goggles, or a face shield</b><p class="small" style="margin-top:6px">Care likely to cause splashes or sprays of blood or body fluids.</p></div></div>`},
    {h:"Hand hygiene", html:`<div class="acro">
      <div><b>Soap and water MUST be used</b><ul style="margin-top:8px">
        <li>After care for a resident with <b>C. diff</b></li><li>After care for a resident with <b>norovirus</b></li><li>Before you eat</li><li>After using the bathroom</li><li>When hands are visibly soiled</li></ul></div>
      <div><b>Alcohol-based hand rub is fine any other time</b><ul style="margin-top:8px">
        <li>Before and after providing care</li><li>After touching objects in a resident care area</li><li>After removing gloves or other PPE</li><li>Before any procedure requiring aseptic technique</li></ul></div></div>`},
    {h:"Try it: soap or sanitizer?", html:`<div data-widget="handhygiene"></div>`},
    {h:"Standard and transmission-based precautions", html:`<div class="callout key"><b>Standard precautions: treat everyone's blood and body fluids as potentially infectious.</b><span>If it's wet and it comes from the human body, treat it as infectious. Minimum PPE: gloves for contact with the resident or body fluids.</span></div>
      <div class="tbl"><table><thead><tr><th>Precaution</th><th>Spread by</th><th>Examples</th><th>What you add</th></tr></thead><tbody>
        <tr><td><b>Contact</b></td><td>Touching the resident or items in the room</td><td>MRSA, VRE, C. diff, norovirus, scabies</td><td>Gloves when <b>entering the room</b>; change gloves after contact with infective material (wound drainage, stool)</td></tr>
        <tr><td><b>Droplet</b></td><td>Coughs and sneezes; droplets travel about 3 feet</td><td>Influenza, pertussis (whooping cough), mumps</td><td>A <b>mask</b> when entering the room, plus gloves</td></tr>
        <tr><td><b>Airborne</b></td><td>Germs that travel long distances through the air</td><td>Measles, SARS, chickenpox, tuberculosis</td><td>A <b>fit-tested N95</b> and a <b>negative-pressure</b> isolation room</td></tr></tbody></table></div>`},
    {h:"Biohazard labels", html:`<p>The biohazard symbol is required on:</p>
      <ul><li>All bagged or containerized regulated waste: blood and body fluid specimens, infectious waste, contaminated sharps</li>
      <li>Refrigerators and freezers holding blood or other potentially infectious materials</li>
      <li>All contaminated equipment (an adhesive biohazard label on the front)</li></ul>`},
    {h:"If you are exposed", html:`<ol class="steps">
      <li><span>Flush the area with water. If skin is broken, let it bleed freely, but <b>do not squeeze</b> to force bleeding.</span></li>
      <li><span>Wash well with soap and water, apply antiseptic and a bandage.</span></li>
      <li><span><b>Notify your supervisor immediately.</b></span></li></ol>
      <p>The incident is documented, and you'll be referred to a health care professional for evaluation and follow-up <b>at no cost to you</b>, including testing for HIV, Hepatitis B and Hepatitis C. The source individual will be asked to consent to testing.</p>
      ${P("Exposure steps awaiting Infection Prevention review","This slide was marked for review in the source deck. Confirm these steps before this module goes live.")}`},
    {h:"Reminders from our Infection Preventionist", html:`<p>Our Infection Preventionist rounds the units regularly. These are the reminders she shares most often (Sept. 2025). <b>Questions? Shannan Lord, IP, ext. 5276.</b></p>
      <ul>
        <li><b>Hand hygiene before entering AND when exiting every resident's room.</b> This is super important. Also clean your hands every time you leave the <b>dirty utility room</b>; there's a sanitizer right outside the door.</li>
        <li><b>Never wear gloves or PPE in the hallway.</b> Remove them before you leave the resident's room.</li>
        <li><b>Nothing on top of clean linen carts:</b> no slings, papers, drinks, briefs, or anything else.</li>
        <li><b>Nothing on the hallway handrails, even for a moment.</b> Handrails are easily contaminated. A cup set on a handrail and then delivered to a room can contaminate the resident's bedside table and belongings.</li>
        <li><b>Dirty linen never goes on the floor</b>, even in a bag. Take it to the dirty utility room immediately.</li>
        <li><b>Don't leave trays or clothing protectors on lounge counters.</b> Put dirty trays and cups in the dietary cart near <b>Newing</b> (between the East and West units). No cart there? Call Dietary right away.</li>
        <li><b>Every resident with a Foley catheter needs a privacy bag</b> on both their wheelchair and their bed.</li>
        <li><b>Wear the required PPE in isolation rooms at all times.</b> The sign on the door shows the type of isolation and the PPE needed. <b>No sign? Notify nursing immediately</b> so one is posted.</li></ul>
      <div data-widget="icrounds"></div>`},
    {h:"Tuberculosis (TB)", html:`<p>TB is a bacterial infection, usually of the lungs, that spreads <b>through the air</b> when a person with <b>active TB</b> coughs, sneezes or talks. Pennsylvania requires every nursing home to have a TB infection control plan that follows CDC guidance (28 Pa. Code §201.22).</p>
      <div class="acro">
        <div><b>Latent TB infection</b><p class="small" style="margin-top:6px">The germ is in the body but inactive. <b>No symptoms, not contagious.</b> Treatment can keep it from becoming active.</p></div>
        <div><b>Active TB disease</b><p class="small" style="margin-top:6px"><b>Contagious.</b> Cough lasting 3 weeks or more, coughing up blood, fever, night sweats, weight loss, tiredness.</p></div></div>
      <ul><li><b>You're screened when you're hired</b> (a TB test and a symptom check) so we know you're safe to work with residents.</li>
        <li><b>Develop TB symptoms?</b> Tell Employee Health and don't come to work until you're cleared.</li>
        <li><b>A resident has TB symptoms?</b> Tell the nurse right away. Put a surgical mask on the resident if they can tolerate it; the nurse starts <b>airborne precautions</b>, which require a fit-tested N95.</li></ul>`},
    {h:"Respiratory protection: N95 fit testing", html:`<p>Required departments are fit tested <b>on hire, annually,</b> and <b>as needed</b>: when the mask you were fitted for is no longer available, you lose or gain weight, or you have extensive dental work.</p>`},
    {h:"Illness reporting", html:`<div class="callout key"><b>If you are sick, do NOT report to work.</b><span>Contact your immediate supervisor and/or the Staff Development / Employee Health Department for direction.</span></div>`},
    {h:"", html:P("Current COVID-19 testing requirements","The 2023 orientation deck lists outbreak testing rules marked \"subject to change.\" Confirm current requirements with Employee Health / Infection Control before adding them. Influenza and pneumococcal vaccines are covered in the Employee Immunizations module.")}
  ],
  quiz:[
    {q:"You just finished care for a resident with C. diff. How do you clean your hands?",o:["Alcohol-based hand rub","Soap and water","Gloves are enough","A disinfectant wipe"],a:1,
     w:"Soap and water is required after care for residents with C. diff or norovirus."},
    {q:"When is alcohol-based hand rub appropriate?",o:["When your hands are visibly soiled","Before you eat lunch","After touching a resident's bed rail","After using the bathroom"],a:2,
     w:"Hand rub is fine after touching objects in a resident care area. The other three require soap and water."},
    {q:"Which situation requires a repeat N95 fit test?",o:["You changed units","You had extensive dental work","It's been six months","You wore the mask for a full shift"],a:1,
     w:"Re-test if your mask model is unavailable, your weight changes, or you have extensive dental work, plus annually."},
    {q:"You wake up with a fever and vomiting before your shift. What do you do?",o:["Come in and wear a mask","Come in but avoid residents","Stay home and contact your supervisor or Employee Health","Ask a coworker to cover without telling anyone"],a:2,
     w:"If you are sick, do not report to work. Contact your supervisor or Staff Development / Employee Health."},
    {q:"After a needlestick, which step is wrong?",o:["Wash the area with soap and water","Squeeze the area to force bleeding","Notify your supervisor immediately","Accept follow-up evaluation at no cost"],a:1,
     w:"Do not 'milk' or squeeze the area. Wash it and notify your supervisor immediately."},
    {q:"Standard precautions mean:",o:["Only residents with a known infection are treated as infectious","Treating everyone's blood and body fluids as potentially infectious","Wearing an N95 at all times","Washing hands once per shift"],a:1,
     w:"If it's wet and it comes from the human body, treat it as infectious."},
    {q:"A resident is on droplet precautions for influenza. Before entering the room you put on:",o:["Nothing extra","A mask (plus gloves)","An N95 and a negative-pressure room","Shoe covers"],a:1,
     w:"Droplet precautions add a mask when entering the room. Airborne precautions require a fit-tested N95 and a negative-pressure room."},
    {q:"Which of these requires airborne precautions?",o:["MRSA","Norovirus","Tuberculosis","Scabies"],a:2,
     w:"Airborne: measles, SARS, chickenpox, tuberculosis. MRSA, norovirus and scabies are contact precautions."},
    {q:"You declined the hepatitis B vaccine when you were hired. Can you still get it?",o:["No","Yes, any time during the year. Contact Staff Development","Only at your annual review","Only if you have an exposure"],a:1,
     w:"The hepatitis B vaccine is available throughout the year, even if you previously declined it."},
    {q:"When must you perform hand hygiene for a resident's room?",o:["Only when you leave","Only if you touched the resident","Before entering AND when exiting","Once at the start of your shift"],a:2,
     w:"Perform hand hygiene before entering and again when exiting every resident's room."},
    {q:"You finish care in an isolation room and need supplies down the hall. You:",o:["Keep your gloves on to save time","Remove gloves and PPE before leaving the room, then clean your hands","Remove only your gown","Wear your mask in the hallway"],a:1,
     w:"Never wear gloves or PPE in the hallway. Remove them before leaving the resident's room."},
    {q:"Which of these can go on top of a clean linen cart?",o:["A sling","Your drink","A package of briefs","Nothing"],a:3,
     w:"Nothing goes on top of clean linen carts."},
    {q:"You arrive at an isolation room and there's no sign on the door. You:",o:["Guess which PPE to wear","Skip the room","Notify nursing immediately so a sign is posted","Ask the resident"],a:2,
     w:"Every isolation room needs a sign showing the isolation type and required PPE. If one is missing, notify nursing immediately."},
    {q:"Which is a common sign of active TB disease?",o:["A rash on the hands","A cough lasting 3 weeks or more, with night sweats or weight loss","Pink eye","A sore throat for one day"],a:1,
     w:"A cough lasting three weeks or more, coughing up blood, fever, night sweats and weight loss can signal active TB. Report it right away."},
    {q:"A coworker has latent TB infection. Can she spread TB?",o:["Yes, through the air","No. Latent TB has no symptoms and isn't contagious","Only by touch","Only to residents"],a:1,
     w:"Latent TB isn't contagious. Only active TB disease spreads through the air."}
  ]
},
{
  id:"immun", title:"Employee Immunizations: Hepatitis B, Pneumococcal & Influenza", tag:"OSHA 1910.1030 · F880 · F883", min:8,
  narration:`Vaccines protect you, your family, and the residents we care for. As part of orientation, every new employee reviews three vaccines: hepatitis B, pneumococcal, and influenza. For each one you will read the C D C Vaccine Information Statement, then tell us how you want to proceed. You can receive the vaccine here from Employee Health, tell us you already received it in the community, or decline it. Hepatitis B is a serious liver infection spread through blood and body fluids. Because you may be exposed to blood or other potentially infectious materials, OSHA's Bloodborne Pathogens Standard requires us to offer you the hepatitis B vaccine series at no cost to you. If you decline, you must sign the OSHA declination statement. You can change your mind at any time, and you will still receive the vaccine at no cost. Pneumococcal disease causes pneumonia, bloodstream infections, and meningitis. The C D C recommends pneumococcal vaccine for adults based on age and certain health conditions. Employee Health will review whether it is recommended for you. Influenza spreads easily in a nursing home, and staff can spread it to residents even before they feel sick. Getting the flu vaccine every season is one of the most important things you can do to protect our residents. If you decline the flu vaccine, you must follow facility policy for unvaccinated staff during flu season, including wearing a mask. If you received a vaccine in the community, bring your record to Employee Health. When you have made a choice for all three vaccines, type your full name to sign. Employee Health will verify your record and give any vaccines you chose to receive here. Here is what the C D C Vaccine Information Statements say. The hepatitis B vaccine is given as a series of shots. Soreness where the shot is given and fever can happen. Tell Employee Health if you have had a serious allergic reaction to a previous dose, to baker's yeast, or to latex. The pneumococcal conjugate vaccine, called P C V, is recommended for adults fifty and older who haven't had one, and for younger adults with certain medical conditions. Redness, swelling, or pain where the shot is given, fever, headache, muscle aches, or chills can happen. The flu vaccine is given once each season, and protection takes about two weeks to develop. The flu vaccine does not cause the flu. Tell Employee Health if you have had an allergic reaction to a previous flu vaccine or have ever had Guillain-Barre Syndrome. Fainting can happen after any shot. A severe allergic reaction is very rare. If you see hives, swelling of the face and throat, trouble breathing, a fast heartbeat, dizziness, or weakness, call 9 1 1. Reactions can be reported to the Vaccine Adverse Event Reporting System, and the National Vaccine Injury Compensation Program may compensate people injured by certain vaccines. Next you will complete the same forms you would sign on paper: the Hepatitis B Vaccine Consent Form, the Pneumococcal Conjugate Vaccine Consent or Declination, and the Influenza Vaccine Consent or Declination. On each one, you choose to receive the vaccine or decline it. For hepatitis B you can also tell us you already received the series or are immune, and for P C V and flu you can tell us you already received it somewhere else. If you have questions, ask Employee Health before you sign.`,
  sections:[
    {h:"Why it matters", html:`<p>Vaccines protect <b>you, your family, and our residents</b>. Many of our residents are older and medically fragile, so an illness that is mild for you can be life-threatening for them.</p>
      <p>For each vaccine below, read the <b>CDC Vaccine Information Statement (VIS)</b>, then complete the same consent or declination forms you would sign on paper with Employee Health.</p>`},
    {h:"Hepatitis B", html:`<ul><li>A serious liver infection spread through <b>blood and body fluids</b>, including needlesticks and other sharps injuries.</li>
      <li>OSHA's Bloodborne Pathogens Standard requires us to offer the hepatitis B series <b>at no cost to you</b> if you have occupational exposure.</li>
      <li>If you decline, you must sign the <b>OSHA mandatory declination statement</b>. You can change your mind later and still receive the series at no cost.</li>
      <li><b>About the vaccine (CDC VIS):</b> it's given as a series of shots, usually over several months. Soreness where the shot is given and fever can happen. Tell Employee Health if you've had a serious allergic reaction to a previous dose, to baker's yeast, or to latex.</li></ul>`},
    {h:"Pneumococcal", html:`<ul><li>Pneumococcal bacteria cause pneumonia, bloodstream infections, and meningitis.</li>
      <li>The CDC recommends a pneumococcal conjugate vaccine (PCV) for <b>adults 50 and older</b> who haven't had one, and for adults 19 to 49 with certain medical conditions or risk factors.</li>
      <li><b>Possible reactions (CDC VIS):</b> redness, swelling, pain or tenderness where the shot is given, fever, loss of appetite, headache, muscle aches, joint pain or chills. Fainting can happen after any shot. A severe allergic reaction is very rare: hives, swelling of the face and throat, trouble breathing, a fast heartbeat, dizziness or weakness. Call 911.</li>
      <li>Tell Employee Health if you've had an allergic reaction to a previous PCV dose or to any vaccine containing diphtheria toxoid, or have any severe, life-threatening allergies.</li></ul>`},
    {h:"Influenza", html:`<ul><li>Flu spreads quickly in a nursing home. Staff can spread it to residents <b>before they feel sick</b>.</li>
      <li>A flu vaccine is recommended <b>every season</b> for all healthcare workers.</li>
      <li><b>About the vaccine (CDC VIS):</b> one dose each season. Protection takes about 2 weeks to develop. <b>The flu vaccine does not cause flu.</b> It can be given at the same time as other vaccines, and at any time during pregnancy.</li>
      <li>Tell Employee Health if you've had an allergic reaction to a previous flu vaccine, have severe life-threatening allergies, or have ever had <b>Guillain-Barré Syndrome</b>.</li>
      <li>If you decline, follow facility policy for unvaccinated staff during flu season.</li></ul>`},
    {h:"If there's a problem after a vaccine", html:`<ul><li>Signs of a severe allergic reaction (hives, swelling of the face and throat, trouble breathing, a fast heartbeat, dizziness or weakness): <b>call 911</b>.</li>
      <li>For other concerns, call your health care provider and tell Employee Health.</li>
      <li>Reactions can be reported to the <b>Vaccine Adverse Event Reporting System (VAERS)</b>: vaers.hhs.gov or 1-800-822-7967.</li>
      <li>The <b>National Vaccine Injury Compensation Program</b> (hrsa.gov/vaccinecompensation, 1-800-338-2382) may compensate people injured by certain vaccines.</li></ul>`},
    {h:"CDC Vaccine Information Statements", html:`<div class="tbl"><table><thead><tr><th>Vaccine</th><th>VIS edition</th><th></th></tr></thead><tbody>
      <tr><td>Hepatitis B (Interim)</td><td class="num">1/31/2025</td><td><a href="https://www.cdc.gov/vaccines/hcp/current-vis/hepatitis-b.html" target="_blank" rel="noopener">Read the VIS</a></td></tr>
      <tr><td>Pneumococcal Conjugate (PCV)</td><td class="num">5/29/2025</td><td><a href="https://www.cdc.gov/vaccines/hcp/current-vis/pneumococcal-conjugate.html" target="_blank" rel="noopener">Read the VIS</a></td></tr>
      <tr><td>Influenza (Injected)</td><td class="num">1/31/2025</td><td><a href="https://www.cdc.gov/vaccines/hcp/current-vis/flu.html" target="_blank" rel="noopener">Read the VIS</a></td></tr>
      </tbody></table></div>
      <p class="small muted">Printed copies are available from Employee Health. If a link doesn't open, ask for a paper copy.</p>`},
    {h:"", html:`<div class="callout key"><b>Received a vaccine in the community?</b><span>Bring your vaccination record (or titer result) to the Staff Development / Employee Health Department. Your choice isn't final until Employee Health verifies it.</span></div>`}
  ],
  form:"immun",
  quiz:[
    {q:"Who pays for the hepatitis B vaccine series offered by the facility?",o:["You do","Your health insurance","The facility, at no cost to you","Half and half"],a:2,
     w:"OSHA requires the employer to offer the hepatitis B series at no cost to employees with occupational exposure."},
    {q:"You declined the hepatitis B vaccine on hire. A year later you change your mind. What happens?",o:["You can't get it through the facility","You can receive the series at no cost","You must pay for it","You must wait until your annual review"],a:1,
     w:"The OSHA declination states you can receive the series at no cost if you later want it and remain at risk."},
    {q:"Why is the flu vaccine so important for nursing home staff?",o:["It's only important for residents","Staff can spread flu to residents before feeling sick","It prevents COVID-19","It replaces hand hygiene"],a:1,
     w:"Staff can spread influenza before symptoms start, and our residents are at high risk of serious illness."}
  ]
},
{
  id:"dementia", title:"Aging, Dementia & Behavioral Health", tag:"F740–F744 · F699", min:14,
  narration:`Behavioral health care is about the whole person. The word psychosocial underscores the close connection between our psychological experience, meaning our thoughts, emotions, and behavior, and our wider social experience, meaning our relationships, traditions, and culture. Mental health includes our emotional, psychological, and social well-being. It affects how we think, feel, and act, how we handle stress, how we relate to others, and how we make choices. It matters at every stage of life, including for the residents we care for. At Wesley Village, caring for residents living with dementia or behavioral health needs means using person-centered approaches, appropriate behavioral interventions, and effective communication. Get to know each resident as a person: their history, their preferences, and what comforts them. Some changes are a normal part of aging, like loss of strength, some loss of sight and hearing, less energy, increased forgetfulness, and more difficulty learning new things. These are not dementia. A resident's well-being is affected by their relationships, by the roles they've lost, and by how involved they are in the life of the community. Major life changes can lead to behavior problems, so always look for the root cause: a new home, fewer family visits, different food, changed sleep habits, pain, or being surrounded by strangers. Dementia describes severe brain changes that cause memory loss and make daily activities hard, and it affects language, memory, and decision-making. Alzheimer's disease is the most common type. Next, watch the video from dementia care expert Teepa Snow on her GEMS Brain Change Model, which describes how abilities change as dementia progresses. When a resident repeats themselves, respond with patience and answer the same way each time. For hoarding, label belongings and offer a rummage drawer, and never call it stealing. For sundowning, remove triggers, play soft music, and keep a calm routine. If a resident has a harmless hallucination, it may be ignored; if it's distressing, reassure them and don't argue. Prevent catastrophic reactions by avoiding triggers like fatigue, overstimulation, pain, hunger, and needing the toilet. If a resident becomes violent, block blows, never hit back, step out of reach, and call for help without leaving the resident alone. Then watch Teepa Snow's video on ten ways to de-escalate a crisis. Trauma-informed care means recognizing that past trauma may shape a resident's reactions, avoiding triggers, explaining before you act, and offering choices. Remember, our residents were not always elderly, sick, injured, or dependent.`,
  sections:[
    {h:"Psychosocial well-being", html:`<p>The term <b>psychosocial</b> underscores the close connection between the psychological side of our experience (thoughts, emotions, behavior) and our wider social experience (relationships, traditions, culture).</p>
      <p><b>Why it matters:</b> mental health includes emotional, psychological, and social well-being. It affects how we think, feel, and act, how we handle stress, relate to others, and make choices, at every stage of life.</p>`},
    {h:"Our approach", html:`<div class="callout key"><b>Person-centered approaches, behavioral interventions, and effective communication.</b><span>Get to know each resident as a person: their history, preferences, routines, and what brings them comfort.</span></div>`},
    {h:"Normal aging", html:`<p>Some changes are a normal part of aging. They are <b>not</b> dementia:</p>
      <div class="acro">
        <div><b>Body</b><ul class="small" style="margin-top:6px"><li>Loss of muscle and physical strength</li><li>Some loss of sight and hearing</li><li>Less energy; decreased appetite</li><li>Thicker nails, greying hair, thicker ear and nasal hair</li><li>Skin changes: dryness, age spots, skin tags</li></ul></div>
        <div><b>Mind</b><ul class="small" style="margin-top:6px"><li>Mild decline in mental function</li><li>More difficulty learning new things</li><li>Increased forgetfulness</li><li>Shorter attention span</li></ul></div></div>`},
    {h:"What affects psychosocial well-being", html:`<ul>
      <li><b>Unsettled relationships:</b> unhappy with a roommate or other residents, conflict with family or friends, little personal contact, a recent loss of someone close, trouble adjusting to new routines</li>
      <li><b>Past roles:</b> strongly identifying with who they used to be; sadness, anger, or emptiness over lost roles; a daily routine very different from life at home</li>
      <li><b>Involvement:</b> how much they take part in the life of the community, from group activities to solitary pursuits</li></ul>`},
    {h:"Look for the root cause", html:`<p>Major life changes can lead to "behavior problems." Stop and ask: <b>what could be causing this?</b></p>
      <div class="tbl"><table><tbody>
        <tr><td><b>A new home</b></td><td>Did they come from a large house? Were they independent? Do they now share a room?</td></tr>
        <tr><td><b>Family visits less</b></td><td>Many families are uncomfortable in long-term care. Make an extra effort to welcome them.</td></tr>
        <tr><td><b>Different food</b></td><td>Did they cook for themselves or their family? Is a "Sunday tradition" broken?</td></tr>
        <tr><td><b>Sleep habits</b></td><td>Did they work nights? Were they an early riser, a napper, or a late-night TV watcher?</td></tr>
        <tr><td><b>Pain</b></td><td>Are they here after a hospital stay? Is pain new and frightening to them?</td></tr>
        <tr><td><b>Strangers</b></td><td>A new place full of new people. Are they usually quiet or outgoing?</td></tr></tbody></table></div>`},
    {h:"What is dementia?", html:`<p><b>Dementia</b> describes severe changes in the brain that cause memory loss and make it hard to perform basic daily activities. In most people it also changes behavior and personality. Dementia affects three areas: <b>language, memory, and decision-making</b>.</p>
      <p><b>Alzheimer's disease</b> is the most common type. Others include vascular dementia, dementia with Lewy bodies, Parkinson's disease dementia, frontotemporal dementia, Creutzfeldt-Jakob disease, Wernicke-Korsakoff syndrome, and mixed dementia.</p>`},
    {h:"Watch: Teepa's GEMS® Brain Change Model", html:`<p>Dementia care expert <b>Teepa Snow</b> (Positive Approach to Care) explains the <b>GEMS® Brain Change Model</b>, which describes how abilities change as dementia progresses, so you can focus on what each person can still do and support them where they are.</p>
      <a class="vcard" href="https://www.youtube.com/watch?v=Z6UVjp_y8HY" target="_blank" rel="noopener"><span class="vplay" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span><span class="vtxt"><span class="eyebrow">Video · opens on YouTube</span><b>Teepa's GEMS® Brain Change Model</b><span class="small muted">Teepa Snow · Positive Approach® to Care</span></span></a>`},
    {h:"Responding to difficult behaviors", html:`<div class="tbl"><table><thead><tr><th>Behavior</th><th>What helps</th></tr></thead><tbody>
      <tr><td><b>Perseveration</b><br><span class="small muted">Repeating a word, phrase, or gesture</span></td><td>Respond with patience. Don't try to stop it. Answer each time using the same words.</td></tr>
      <tr><td><b>Pillaging and hoarding</b></td><td>Label belongings and the resident's door. Provide a rummage drawer. Never call it "stealing." Prepare the family and ask them to report unfamiliar items.</td></tr>
      <tr><td><b>Disruptiveness</b></td><td>Gain their attention and stay calm. Move to a private area and ask about the behavior. Praise improvements, explain changes, and encourage positive activities.</td></tr>
      <tr><td><b>Sundowning</b><br><span class="small muted">Late-day confusion and agitation</span></td><td>Remove triggers and stress. Play soft music, plan calming activities, keep a bedtime routine, cut caffeine, offer a back rub, distract, and encourage daily exercise.</td></tr>
      <tr><td><b>Hallucinations and delusions</b></td><td>If harmless, they may be ignored. If distressing: reassure, stay calm, and <b>don't argue</b>.</td></tr>
      <tr><td><b>Catastrophic reactions</b></td><td>Avoid triggers: fatigue, changes in routine, overstimulation, difficult choices or tasks, pain, hunger, needing the toilet. Distract.</td></tr>
      <tr><td><b>Violent behavior</b></td><td>Block blows and <b>never hit back</b>. Step out of reach and call for help, but don't leave the resident alone. Remove triggers and use calming techniques.</td></tr></tbody></table></div>`},
    {h:"Watch: 10 ways to de-escalate a crisis with Teepa Snow", html:`<p>Teepa Snow shares <b>ten practical ways to de-escalate a crisis</b> with someone living with dementia. Watch for how she approaches, positions herself, and uses her voice and hands.</p>
      <a class="vcard" href="https://www.youtube.com/watch?v=xNznZ2MnV3I" target="_blank" rel="noopener"><span class="vplay" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span><span class="vtxt"><span class="eyebrow">Video · opens on YouTube</span><b>10 ways to de-escalate a crisis</b><span class="small muted">Teepa Snow · Positive Approach® to Care</span></span></a>`},
    {h:"Trauma-informed care", html:`<p>Many residents have lived through trauma: war, abuse, accidents, disasters, or loss. Trauma-informed care means recognizing that a resident's reactions may be shaped by past trauma, and caring for them in ways that <b>avoid triggers and prevent re-traumatization</b>.</p>
      <ul><li>Learn each resident's history and known triggers from the care plan</li><li>Explain what you're going to do before you do it, and ask permission</li><li>Offer choices and give the resident as much control as possible</li><li>Watch for signs of fear or distress, and report changes to the nurse</li></ul>`},
    {h:"", html:`<div class="callout key"><b>Remember</b><span>Our residents were not always elderly, sick, injured, or dependent. Every one of them has a life story.</span></div>`}
  ],
  quiz:[
    {q:"The word \"psychosocial\" connects which two things?",o:["Medications and diagnoses","Thoughts, emotions and behavior with relationships, traditions and culture","Diet and exercise","Staffing and scheduling"],a:1,
     w:"Psychosocial links the psychological (thoughts, emotions, behavior) with the social (relationships, traditions, culture)."},
    {q:"Mental health affects:",o:["Only how we feel","How we handle stress, relate to others, and make choices","Only younger people","Only residents with a diagnosis"],a:1,
     w:"Mental health affects how we think, feel, act, handle stress, relate to others, and make choices, at every age."},
    {q:"Caring for residents with dementia at Wesley Village relies on:",o:["Restraints when behavior is difficult","Person-centered approaches, behavioral interventions, and effective communication","Keeping residents in their rooms","The same routine for every resident"],a:1,
     w:"Our approach is person-centered, with behavioral interventions and effective communication."},
    {q:"Which of these is a normal part of aging, not dementia?",o:["Getting lost in a familiar place","Being unable to recognize family","Increased forgetfulness and difficulty learning new things","Being unable to perform basic daily activities"],a:2,
     w:"Mild forgetfulness and slower learning are normal with aging. Dementia causes severe changes that interfere with daily life."},
    {q:"A resident with dementia asks \"When is lunch?\" for the tenth time. You:",o:["Tell her you already answered","Ignore her","Answer patiently, using the same words each time","Ask her to stop asking"],a:2,
     w:"For perseveration, respond with patience, don't try to stop it, and answer each time with the same words."},
    {q:"A resident tells you there are bugs on the wall and is becoming frightened. You:",o:["Argue that there are no bugs","Reassure him, stay calm, and don't argue","Laugh it off","Leave the room"],a:1,
     w:"When hallucinations are distressing, reassure, stay calm, and do not argue."},
    {q:"A resident swings at you during care. What should you NOT do?",o:["Block the blow","Step out of reach","Call for help","Hit back"],a:3,
     w:"Never hit back. Block blows, step out of reach, call for help, and don't leave the resident alone."},
    {q:"A new resident who used to cook for her large family refuses meals and is irritable. A good first step is to:",o:["Report her as non-compliant","Look for the root cause, such as missing her role and family traditions","Skip her meals","Move her to another unit"],a:1,
     w:"Behaviors often have a root cause. Major life changes, like losing a role or tradition, can lead to behavior changes."}
  ]
},
{
  id:"accidents", title:"Accident Prevention & Workplace Safety", tag:"F689 · OSHA", min:16,
  narration:`We prevent avoidable accidents through adequate supervision and the right assistive devices. For people over sixty-five, the two leading causes of unintentional injury and death are falls and fires. When an older person falls, they may lose physical function or become permanently disabled, and that loss of independence can lead to further decline, depression, helplessness, and isolation. Common causes of slips, trips, and falls include frayed carpet and slippery rugs, loose tiles, wet floors, cluttered hallways, slippery shoes, slippers, or socks, ice and snow, poor lighting and burnt-out bulbs, loose handrails, slipping in the tub or shower, and trying to get out of bed or a chair without needed help. To prevent falls, use non-slip mats in and around tubs and showers. Pay attention to when a resident needs help getting in and out of bed or a chair. Keep a night light on, because getting up at night to use the bathroom is a common time for falls. Keep stairways well lit, never store anything on the stairs, even for a moment, and make sure handrails are secure on both sides. Encourage residents to stay active with exercise that builds leg strength, like walking or tai chi. It's one of the best ways to prevent falls. Finally, lockout tagout. Only authorized employees may lock out machinery. The steps are: prepare for shutdown, shut down the machine, locate every energy-isolating device, attach a lock or tag to each, release any stored energy, and verify the machine is isolated and de-energized. Protect yourself with good body mechanics. Pull, push, or roll instead of lifting when you can. Keep movements smooth, work close to the load, use your leg and arm muscles instead of your back, and raise the bed. OSHA's recommended limit for lifting a resident is thirty-five pounds, so use lifts and get help. Avoid repetitive motions and awkward postures like twisting while lifting. If you're hurt at work, no matter how minor, complete an Employee Incident Report. Unlocked wheelchair brakes, broken walkers, and medications that cause dizziness also raise fall risk. Under OSHA's Hazard Communication Standard, every chemical has a Safety Data Sheet with sixteen sections, including first aid and the protective equipment to use. Read labels and their pictograms before using a product. Food brought by visitors must be labeled with the resident's name and date, and can be stored for seventy-two hours only. Change gloves and wash hands between food items. To prevent choking, serve the correct diet texture, seat residents upright, offer fluids, make sure the mouth is empty before the next bite, and tell nursing if a resident coughs or gags while eating.`,
  sections:[
    {h:"Why it matters", html:`<p>For people over 65, the two leading causes of unintentional injury and death are <b>falls</b> and <b>fires</b>. A fall can permanently reduce a resident's ability to function, and the loss of independence that follows can lead to further decline, depression, helplessness, and isolation. We prevent avoidable accidents with <b>adequate supervision and assistive devices</b>.</p>`},
    {h:"Common causes of slips, trips and falls", html:`<ul>
      <li>Frayed carpet, slippery rugs, loose tiles, lifted floor edges</li><li>Wet floors; ice or snow</li><li>Cluttered hallways or paths</li><li>Slippery shoes, slippers, or socks</li><li>Poor lighting and burnt-out bulbs</li><li>Loose or missing handrails</li><li>Slipping in tubs or showers</li><li>Getting out of bed or a chair without needed help</li></ul>`},
    {h:"Try it: spot the hazards", html:`<div data-widget="hazard"></div>`},
    {h:"What you can do", html:`<ul>
      <li>Use rubber or slip-proof mats inside and outside tubs and showers</li>
      <li>Watch for residents who need help getting into or out of bed or a chair</li>
      <li>Keep a night light on. <b>Getting up at night to use the bathroom is a common time for falls.</b></li>
      <li>Keep stairways well lit without glare or shadows; if unsure of a fixture's wattage, use 60 watts or lower</li>
      <li><b>Never store anything on stairs, even temporarily</b></li>
      <li>Make sure handrails are sturdy on both sides</li>
      <li>Encourage leg-strengthening exercise like walking or tai chi, one of the best ways to prevent falls</li></ul>
      <p><b>Other hazards:</b> unlocked wheelchair brakes, broken walkers or canes, and medications that cause drowsiness or dizziness all raise fall risk. Lock brakes and report broken equipment.</p>`},
    {h:"Body mechanics and safe resident handling", html:`<p><b>Body mechanics</b> is using good posture and movement to prevent fatigue, strain and injury.</p>
      <div class="acro">
        <div><b>Lift SMART</b><ul class="small" style="margin-top:6px"><li><b>Pull, push or roll</b> instead of lifting when you can</li><li>Keep movements <b>smooth and controlled</b>, not jerky</li><li>Work <b>close to the load</b> and use your strong leg and arm muscles, not your back</li><li>Keep work at a comfortable level: <b>raise the bed!</b></li><li>Take care of yourself. It's easier to use good body mechanics when you're fit.</li></ul></div>
        <div><b>OSHA's three ways to reduce injury</b><ol class="small" style="margin-top:6px"><li><b>Avoid lifting too much weight.</b> OSHA's recommended limit for lifting a resident is <b>35 lbs</b>. Use lifts and get help.</li><li><b>Avoid repetition</b>: the same motion again and again without a break</li><li><b>Avoid awkward postures</b>: leaning over a bed, or twisting while lifting</li></ol></div></div>
      <div class="callout warn"><b>Hurt at work? Report it, no matter how minor.</b><span>Complete an <b>Employee Incident Report</b>, even if you don't think you need a doctor. You may feel differently in the morning.</span></div>`},
    {h:"Lockout / Tagout", html:`<p><b>Only authorized employees</b> may lock out machinery or equipment:</p>
      <ol class="steps"><li><span>Prepare the equipment for shutdown</span></li><li><span>Shut down the machine</span></li><li><span>Locate all devices that isolate it from its energy source</span></li><li><span>Attach a lock and/or tag to each device</span></li><li><span>Release any stored or residual energy (springs, hydraulic pressure)</span></li><li><span>Verify the machine is isolated and de-energized</span></li></ol>`},
    {h:"Hazard Communication: Safety Data Sheets", html:`<p>OSHA's Hazard Communication Standard gives you the right to know about the chemicals you work with. The employer must keep labels on products, keep a <b>Safety Data Sheet (SDS)</b> for each chemical where you can reach it, label workplace containers, and train you.</p>
      <div class="acro">
        <div><b>Every SDS has 16 sections</b><p class="small" style="margin-top:6px">Including identification, hazards, ingredients, <b>first-aid measures</b>, fire-fighting, spill response, handling and storage, and <b>exposure controls / PPE</b>.</p></div>
        <div><b>Pictograms</b><p class="small" style="margin-top:6px">Red-bordered diamond symbols on labels warn of hazards such as flammable, corrosive, toxic, or irritant. Read the label before you use a product.</p></div></div>`},
    {h:"Food from visitors and safe food handling", html:`<ul>
      <li>Any food a visitor brings for a resident must be <b>labeled with the resident's name and the date</b> received. Labels are at the nurses' station.</li>
      <li>Food may be stored for <b>72 hours</b> only. Commercially packaged food is labeled with the resident's name and discarded after the manufacturer's date.</li>
      <li>Wash hands before and after handling food, and wear gloves for raw or ready-to-eat food.</li>
      <li><b>Change gloves between food items:</b> remove gloves, wash hands, put on fresh gloves for each different item.</li></ul>`},
    {h:"Choking prevention", html:`<p>Choking (foreign body airway obstruction) is a leading cause of injury death, and the risk rises sharply in older adults. Risks include poorly fitting dentures, poor or missing teeth, difficulty swallowing (from stroke or advanced dementia, for example), and dry mouth from medications.</p>
      <ul><li>Serve the <b>correct diet texture and liquid consistency</b></li><li>Offer fluids before and during meals</li><li>Seat residents <b>as upright as possible</b> for meals</li><li>When helping someone eat, make sure their <b>mouth is empty before the next bite</b></li><li>Gagging or coughing while eating? <b>Tell nursing.</b> Nursing refers to Speech-Language Pathology for evaluation.</li></ul>`}
  ],
  quiz:[
    {q:"When do many resident falls happen?",o:["During meals","Getting up at night to use the bathroom","During activities","At shift change only"],a:1,
     w:"Nighttime rising to use the bathroom is a common time for falls, which is why night lights matter."},
    {q:"You need to set down a box of supplies for a minute. Can you leave it on the stairs?",o:["Yes, if it's against the wall","Yes, for under five minutes","No. Never store anything on stairs, even temporarily","Only during the day"],a:2,
     w:"Do not store anything on the stairs, even temporarily."},
    {q:"Who may perform lockout/tagout?",o:["Any employee","Only authorized employees","Anyone with a supervisor present","Housekeeping staff"],a:1,
     w:"Only authorized employees may perform lockout/tagout."},
    {q:"What is one of the best ways to prevent falls?",o:["Keeping residents in bed","Encouraging leg-strengthening exercise like walking or tai chi","Using restraints","Turning off lights at night"],a:1,
     w:"Helping residents stay mobile with leg-strengthening exercise is one of the best ways to prevent falls."},
    {q:"What is the final step of lockout/tagout?",o:["Attach the tag","Shut down the machine","Verify the machine is isolated and de-energized","Notify the resident"],a:2,
     w:"After releasing stored energy, verify the machine is isolated and de-energized."},
    {q:"What is OSHA's recommended limit for lifting a resident by hand?",o:["35 lbs","75 lbs","100 lbs","There is no limit"],a:0,
     w:"OSHA's recommended resident-lifting weight is 35 lbs. Use lifts and get help."},
    {q:"You twist your back slightly during a transfer but feel fine. You should:",o:["Ignore it","Complete an Employee Incident Report","Wait to see if it hurts tomorrow","Tell a coworker only"],a:1,
     w:"Report every work injury, no matter how minor, by completing an Employee Incident Report."},
    {q:"A visitor brings homemade cookies for a resident. Before storing them on the unit:",o:["Put them in the fridge as is","Label them with the resident's name and the date; they can be kept 72 hours","Share them with the unit","Throw them out"],a:1,
     w:"Visitor food must be labeled with the resident's name and date and can be stored for 72 hours only."},
    {q:"Where do you find first-aid and PPE information for a cleaning chemical?",o:["On the Safety Data Sheet (SDS)","From a coworker","On the internet","There isn't any"],a:0,
     w:"Every chemical's SDS includes first-aid measures and exposure controls / PPE."},
    {q:"While helping a resident eat, the safest practice is to:",o:["Offer the next bite quickly to finish the meal","Make sure the mouth is empty before the next bite and keep them upright","Let them recline to relax","Skip fluids until after the meal"],a:1,
     w:"Sit residents upright, offer fluids, and make sure the mouth is empty before the next bite."}
  ]
},
{
  id:"codegreen", title:"Emergency Codes & Code Green", tag:"E-Tags · F689 · 28 Pa. Code §211.10", min:16,
  narration:`Every employee has a role in emergency operations. Code Green is our response to a missing resident. Code Green tells staff a resident is missing and starts the search. Elopement is a resident leaving the building or a safe area without authorization or the supervision they need. Residents at high risk are in our Happy Feet Club. Their photos hang at the Lobby, employee, and Rehab entrances, they wear a wander guard that nursing checks every shift, and their names and photos are in the elopement binders. If you notice new or worsening exit-seeking in a resident who isn't in the Happy Feet Club, redirect them back to their unit and alert the Nursing Unit Manager and Supervisor immediately. Keep Happy Feet residents in your direct line of sight when they're off the unit, and if a wander guard is missing, report it to nursing right away. If a resident may be missing, immediately notify the highest-ranking nurse, who checks the sign-out sheet, the appointment list, and the Response Care System, while staff search the resident's immediate area. If they still aren't found, the command nurse dials 5500 and announces Code Green, the resident's name, and their unit three times. That unit's nurses' station becomes the command center. When you hear a Code Green, check your own area first, then report to the command center for an assignment, while one nurse from each unit stays with residents. Open all doors, check every room, unlock locked doors or find someone who can, mark each checked area with a yellow tag, and leave the door open. Report back to the command nurse right away. If you find the resident outside and they refuse to come back, stay with them and notify management. When the resident is found, Code Green All Clear is announced three times, a whole-house census is done, and every staff member involved gives a statement before leaving that shift. Know our emergency codes: Code Red is fire, Code Green is a missing resident, Code Yellow is a disaster, Code White is CPR, Code Silver is a threat, and Active Shooter means an active shooter. The Fire and Disaster Manual is at each department and unit nurses' station. Elopement is when a resident leaves the facility or unit undetected and unsupervised and enters into harm's way. Residents at risk are listed in the white binders on each unit, in each department office, and at the reception desk. Review them at least weekly. Check wander alert bands before any care, and if a band is missing, notify nursing immediately. Code Yellow means an immediate disaster. Code Yellow Stand-by means start planning because danger is not immediate, such as a snow emergency or tornado watch. Code Yellow Receiving means we will receive disaster victims, because Wesley Village is an SOS shelter. For Code White, AEDs are near the time clock in PTNF, on the Rehab Unit, at the Anderson and Myers nurses' stations, and in the Irene Raeder Center. Suction units are in each dining room and crash carts are in the clean utility rooms. A purple name band means the resident is a DNR and does not want CPR. Federal rules require every nursing home to have an emergency plan built on an all-hazards risk assessment, and to train staff on it when they are hired and every year. Ours is in the Fire Disaster Manual at each department and unit nurses' station. It covers fire, severe weather and flooding, power or water loss, outbreaks, chemical spills, and threats or violence. Most emergencies are handled by sheltering in place, where residents stay in the building and we keep caring for them. Evacuation is ordered only by the person in charge, usually the Administrator or the highest-ranking person on site. Report to your supervisor or the personnel pool for your assignment, and never leave residents unattended. You may be called in during a disaster while you are off duty, so keep your phone number and address current with Human Resources. During a power outage, our generator powers emergency lighting and critical equipment. Outlets on emergency power are usually red. Ask Maintenance which ones serve your area, and plug oxygen concentrators and other critical equipment into them. Don't post about an emergency on social media. Code Silver means a threat, a person who is threatening or acting violently. Watch for warning signs like a raised voice, clenched fists, pacing, or threats. Stay calm, keep your distance, keep a clear path to an exit, and don't argue. Call for help, or call 911 if anyone is in danger, and report every incident, even if no one was hurt. If there is an active shooter, remember run, hide, fight. Run if there is a safe way out. Hide if you can't get out, lock or block the door, turn off the lights, and silence your phone. Fight only as a last resort. Call 911 when it's safe, and when police arrive, keep your hands empty and visible.`,
  policies:[{label:"Code Green and Elopement (rev. 09/2024)", file:"policies/code-green-elopement-policy.pdf"},{label:"Wandering and Elopement Risk Identification and Management (rev. 09/2024)", file:"policies/wandering-elopement-risk-policy.pdf"}],
  sections:[
    {h:"Emergency codes at Wesley Village", html:`<p>This is the <b>emergency code card</b> on your badge. Learn it now, and check it any time you hear a code called.</p>
      <div class="ecard" role="table" aria-label="Emergency code badge card">
        <div class="ec-row ec-head" role="row"><span role="columnheader">Emergency code</span><span role="columnheader">Code meaning</span></div>
        <div class="ec-row" role="row"><span class="ec-c" role="cell">Active Shooter</span><span class="ec-m" role="cell">Active shooter</span></div>
        <div class="ec-row" role="row"><span class="ec-c" role="cell" style="background:#E0332D;color:#fff">Red</span><span class="ec-m" role="cell">Fire</span></div>
        <div class="ec-row" role="row"><span class="ec-c" role="cell" style="background:#3E9A4A;color:#fff">Green</span><span class="ec-m" role="cell">Missing resident</span></div>
        <div class="ec-row" role="row"><span class="ec-c" role="cell" style="background:#F2E42E;color:#111">Yellow</span><span class="ec-m" role="cell">Disaster<small>3 variations:</small><ul><li><b>Stand-by</b>: get ready, danger is not immediate</li><li><b>Information</b> about a disaster or evacuation</li><li><b>Receiving</b> residents from another facility</li></ul></span></div>
        <div class="ec-row" role="row"><span class="ec-c" role="cell">White</span><span class="ec-m" role="cell">CPR</span></div>
        <div class="ec-row" role="row"><span class="ec-c" role="cell" style="background:#3A3740;color:#E4E4E8">Silver</span><span class="ec-m" role="cell">Threat</span></div>
      </div>
      <p class="small">Our <b>Fire/Disaster Manual</b> is at each department and unit nurses' station. The Disaster Plan guides how we protect the lives and property of residents, staff and visitors on the Wesley Village campus.</p>`},
    {h:"Code Green: our policy", html:`<p>United Methodist Homes keeps track of the general whereabouts of every resident. If a resident is missing and we don't know where they are, we act right away to find them. <b>Code Green</b> is the emergency code that tells staff a resident is missing and starts the search.</p>
      <p><b>Elopement</b> is a resident leaving the building or a safe area <b>without authorization</b> (a discharge order or leave of absence) and/or without the supervision they need.</p>
      <div class="acro">
        <div><b>Safe wandering</b><p class="small" style="margin-top:6px">Walking around that isn't intrusive or disruptive and is unlikely to put anyone at risk. The resident doesn't go into hazardous areas, doesn't exit-seek, and doesn't say they want to leave.</p></div>
        <div><b>Unsafe wandering</b><p class="small" style="margin-top:6px">Walking without regard to safety that puts the resident or others at risk, may disturb others, and may include <b>trying doors, entering unsafe areas, or following people through exit doors</b>.</p></div></div>`},
    {h:"The Happy Feet Club", html:`<p>The <b>Happy Feet Club</b> is how we identify residents at <b>high risk for elopement</b> or with exit-seeking behavior, so families, staff and other residents can help keep them safe.</p>
