      <ul><li><b>Photo collages</b> of Happy Feet residents hang at the <b>Lobby entrance/exit</b>, the <b>employee entrance/exit (near the elevator)</b>, and the <b>Rehab entrance/exit</b>, with a framed instruction guide nearby. The board can change daily, so look often.</li>
        <li>Each Happy Feet resident wears a <b>wander guard</b> bracelet, anklet or pennant, on their person or their wheelchair or walker. Nursing checks it <b>every shift</b>.</li>
        <li>The <b>elopement binders</b> list each at-risk resident's <b>name and photo</b>. They're <b>on each unit, in each department office, and at the reception desk</b>. Review them at least weekly.</li>
        <li>The <b>Response Care System</b> monitors the wander guards. If a resident wearing one lingers near an exit or passes the floor sensor (the "tombstone"), it alarms at the nurses' stations.</li></ul>
      <p class="small muted">Residents are added after a nursing elopement evaluation, with the physician, family, Nursing, and the Activities Director involved. They're removed only after a reassessment shows the exit-seeking has stopped.</p>`},
    {h:"Spot it, report it", html:`<ul>
      <li><b>New or worsening exit-seeking</b> (trying doors, trying to leave the unit, saying they need to go home) in a resident who <b>isn't</b> in the Happy Feet Club? <b>Redirect them back to their unit</b> and alert the <b>Nursing Unit Manager and Supervisor immediately</b>. You can also tell the DON, ADON or Administrator.</li>
      <li>Think someone should be in the Happy Feet Club? Tell the same people so an evaluation can be done.</li>
      <li>Happy Feet residents <b>off the unit</b>: keep them in <b>direct line of sight and under supervision at all times</b>. Never leave them unattended.</li>
      <li><b>Look for the wander guard before any care.</b> If it's missing, <b>report it to nursing immediately</b> and stay with the resident until it's replaced.</li></ul>`},
    {h:"If a resident may be missing", html:`<ol class="steps">
      <li><span><b>Immediately notify the highest-ranking nurse</b> in the building.</span></li>
      <li><span>The nurse checks the <b>sign-out sheet</b> and the <b>appointment list</b> to make sure the resident isn't signed out or at an appointment.</span></li>
      <li><span>Search the resident's <b>immediate area</b>, the places they like to go, and their unit.</span></li>
      <li><span>Happy Feet resident? The nurse checks the <b>Response Care System</b> to see where the wander guard last alarmed.</span></li></ol>`},
    {h:"Calling a Code Green", html:`<p>If the resident still isn't found, the <b>command nurse</b> (the highest-ranking nurse) dials <b>5500</b> for the loud overhead page and announces <b>three times</b>:</p>
      <div class="callout key"><b>"Code Green, Mr. Smith, please come to West Unit. Check the Rehab entrance."</b><span>The name of the missing resident, their unit, and (if they wear a wander guard) the last place the Response Care System alarmed.</span></div>
      <p>The missing resident's <b>unit nurses' station becomes the command center</b>.</p>`},
    {h:"When you hear a Code Green", html:`<ol class="steps">
      <li><span><b>Check your own unit or work area first</b> and tag each room you've checked.</span></li>
      <li><span>If you're not giving direct care and can safely help, <b>report to the command center</b> for your assignment. <b>One nurse from each unit stays on the unit</b> for resident care.</span></li>
      <li><span>Search your assigned area: <b>open ALL doors</b> and check ALL rooms, including offices, bathrooms, storage rooms and closets. Locked door? <b>Unlock it or find someone who can.</b></span></li>
      <li><span>Mark each checked area with a <b>YELLOW tag</b>, from any nurses' station or behind the reception desk, and <b>leave the door open</b>. (Orange tags are for fire evacuations, when doors are closed.)</span></li>
      <li><span><b>Report back to the command nurse right away</b> with what you found.</span></li></ol>
      <div class="callout warn"><b>Found the resident outside, and they won't come back?</b><span>Stay with them, and notify the nurse or management immediately. Don't leave them alone.</span></div>`},
    {h:"When the resident is found", html:`<ul>
      <li><b>"Code Green, All Clear"</b> is announced three times overhead.</li>
      <li>A <b>whole-house census</b> is done (heads in beds) to make sure every resident is accounted for.</li>
      <li>An RN does a <b>full body assessment</b>, and nursing contacts the physician and the resident's representative.</li>
      <li><b>Every staff member involved gives a statement before leaving that shift</b>, and an incident report is completed.</li>
      <li>The care plan is updated. If the resident wasn't in the Happy Feet Club, they're evaluated and added.</li></ul>
      <p class="small muted">If the resident isn't found within 30 minutes, the search continues while Administration notifies the resident's representative, local law enforcement, the Department of Health, and the Ombudsman.</p>`},
    {h:"Try it: search and tag", html:`<div data-widget="doors"></div>`},
    {h:"Code Yellow: disaster", html:`<div class="tbl"><table><tbody>
      <tr><td><b>Code Yellow</b></td><td>An <b>immediate disaster</b>. All responders on both sides of the campus respond immediately to the scene or to the personnel pools.</td></tr>
      <tr><td><b>Code Yellow Stand-by</b></td><td>Danger is <b>not immediate</b> (for example a snow emergency, loss of water or sewer, or a tornado watch). Start planning for a possible disaster.</td></tr>
      <tr><td><b>Code Yellow Receiving</b></td><td>We will <b>receive disaster victims</b> from outside. Wesley Village is an SOS shelter and part of the area-wide Disaster Plan.</td></tr></tbody></table></div>
      <p>The Fire/Disaster Manual covers where residents will go, what resources we have, continuity of care, communicating with residents and families, coordinating with other agencies, and tracking equipment sent with residents.</p>`},
    {h:"Code White: CPR", html:`<div class="acro">
        <div><b>AEDs are located</b><ul class="small" style="margin-top:6px"><li>Near the time clock in <b>PTNF</b></li><li>On the <b>Rehab Unit</b></li><li>At the nurses' stations in <b>Anderson</b> and <b>Myers</b></li><li>In the <b>Irene Raeder Center</b></li></ul></div>
        <div><b>Other emergency equipment</b><ul class="small" style="margin-top:6px"><li><b>Suction units</b> in each dining room</li><li><b>Crash carts</b> in the clean utility rooms</li></ul></div></div>
      <div class="callout warn"><b>Purple name band = DNR</b><span>A purple name band means the resident has chosen Do Not Resuscitate and does <b>not</b> want CPR.</span></div>`},
    {h:"Emergency preparedness: our all-hazards plan", html:`<p>Federal rules require every nursing home to have an <b>emergency plan</b> built on an <b>all-hazards risk assessment</b>, with policies, a communication plan and staff training at hire and every year (42 CFR §483.73). Ours is in the <b>Fire/Disaster Manual</b> at each department and unit nurses' station. Hazards it covers include fire, severe weather and flooding, power or water loss, infectious disease outbreaks, chemical spills, and threats or violence.</p>
      <div class="acro">
        <div><b>Shelter in place or evacuate?</b><p class="small" style="margin-top:6px">Most emergencies are handled by <b>sheltering in place</b>: residents stay in the building and we keep caring for them. Evacuation is ordered only by the person in charge. Follow their instructions, and never leave residents unattended.</p></div>
        <div><b>Who's in charge</b><p class="small" style="margin-top:6px">The Administrator, or the highest-ranking person on site, leads the response. Report to your supervisor or the personnel pool and take your assignment.</p></div>
        <div><b>Called in during a disaster</b><p class="small" style="margin-top:6px">You may be called in while you're off duty. <b>Keep your phone number and address current with Human Resources.</b> If you can't get to work, call your supervisor.</p></div>
        <div><b>Power outage</b><p class="small" style="margin-top:6px">Our generator powers emergency lighting and critical equipment. Outlets on emergency power are usually <b>red</b>; ask Maintenance which ones serve your area. Plug oxygen concentrators and other critical equipment into them.</p></div></div>
      <ul><li><b>Communication:</b> the facility contacts families, tracks every resident, and shares information with public health and emergency agencies. Don't post about an emergency on social media.</li>
        <li><b>Drills and exercises:</b> we practice through the year. Take part as if it were real.</li></ul>`},
    {h:"Code Silver, workplace violence and active shooter", html:`<p><b>Code Silver</b> means a threat: a person who is threatening or acting violently. Violence can come from visitors, residents or anyone else.</p>
      <ul><li><b>Watch for warning signs:</b> raised voice, clenched fists, pacing, threats.</li>
        <li><b>Stay calm and keep your distance.</b> Keep a clear path to an exit and don't argue.</li>
        <li><b>Get help.</b> Call for a Code Silver, or 911 if anyone is in danger. Protect residents by moving them away if you can do it safely.</li>
        <li><b>Report every incident</b>, even if no one was hurt. You never have to accept violence as "part of the job."</li></ul>
      <div class="callout warn"><b>Active shooter: Run, Hide, Fight</b><span><b>Run</b> if there's a safe way out, and help others if you can. <b>Hide</b> if you can't get out: lock or block the door, turn off lights, silence your phone. <b>Fight</b> only as a last resort. Call 911 when it's safe. When police arrive, keep your hands empty and visible and follow their commands.</span></div>`},
    {h:"", html:P("Code Silver overhead page and lockdown steps","Add Wesley Village's procedure for calling a Code Silver (overhead page number and wording) and any lockdown steps, per the Fire/Disaster Manual.")}
  ],
  quiz:[
    {q:"An elopement-risk resident is going to the chapel off the unit. You should:",o:["Let them go alone if they know the way","Keep them in direct line of sight and under supervision at all times","Check on them in 15 minutes","Ask another resident to go with them"],a:1,
     w:"Off the unit, elopement-risk residents stay in direct line of sight and under supervision at all times."},
    {q:"You can't find a resident who should be on your unit. What is your FIRST step?",o:["Call Code Green yourself","Immediately notify the highest-ranking nurse in the building","Call the family","Call 911"],a:1,
     w:"Immediately notify the highest-ranking nurse, who checks the sign-out sheet, appointments, and the Response Care System while the immediate area is searched."},
    {q:"During a Code Green search, after checking a room you:",o:["Close and lock the door","Tag it with a YELLOW tag and leave the door open","Tag it with an orange tag","Move on without marking it"],a:1,
     w:"Yellow tags, from any nurses' station or behind the reception desk, and leave the door open. Orange tags are for fire evacuation."},
    {q:"You find a wandering resident outside and they refuse to come back in. You:",o:["Leave to get help","Stay with them and notify the nurse or management","Physically carry them inside","Let them continue walking"],a:1,
     w:"If the resident refuses to return, stay with them and notify management immediately. Don't leave them alone."},
    {q:"You reach a locked closet during a Code Green search. You:",o:["Skip it","Unlock it or find someone who can","Assume it's empty","Tag it and move on"],a:1,
     w:"Every room must be checked. Unlock it or find someone who can."},
    {q:"What does Code White mean?",o:["Fire","Missing resident","CPR","Disaster"],a:2,
     w:"Code Red is fire, Code Green is a missing resident, Code Yellow is a disaster, Code White is CPR, and Code Silver is a threat."},
    {q:"Where do you find the list of residents at risk for elopement?",o:["Only in the Administrator's office","The white binders on each unit, in each department office, and at the reception desk","On the bulletin board in the lobby","You ask the resident"],a:1,
     w:"The white elopement binders are on each unit, in each department office, and at reception. Review them at least weekly."},
    {q:"Before giving care, you notice an at-risk resident's wander alert band is missing. You:",o:["Finish care first","Notify nursing immediately","Make a note for next week","Replace it with any band you find"],a:1,
     w:"Check wander bands before any care or treatment. If one is missing, notify nursing immediately."},
    {q:"A resident wears a purple name band. This means:",o:["Fall risk","Allergy","The resident is DNR and does not want CPR","Elopement risk"],a:2,
     w:"A purple name band indicates a Do Not Resuscitate wish."},
    {q:"A \"Code Yellow Stand-by\" is announced because of a tornado watch. This means:",o:["Evacuate immediately","Danger is not immediate; begin planning for a possible disaster","Disaster victims are arriving","The drill is over"],a:1,
     w:"Stand-by means the danger isn't immediate. Start planning. Code Yellow alone is an immediate disaster; Receiving means victims are coming to us."},
    {q:"What is the Happy Feet Club?",o:["A walking exercise group","Our program identifying residents at high risk for elopement","A podiatry clinic","A resident council committee"],a:1,
     w:"Happy Feet residents are at high risk for elopement. Their photos hang at the exits, and they wear a wander guard."},
    {q:"A resident who isn't in the Happy Feet Club keeps trying the door at the end of the hall. You:",o:["Ignore it; they're not on the list","Redirect them back to their unit and alert the Nursing Unit Manager and Supervisor immediately","Lock them in their room","Tell them they can't leave"],a:1,
     w:"New exit-seeking behavior must be reported right away so nursing can do an elopement evaluation."},
    {q:"Where do you report when a Code Green is called?",o:["The front lobby","The command center: the nurses' station on the missing resident's unit","The parking lot","Stay where you are no matter what"],a:1,
     w:"After checking your own area, report to the command center on the missing resident's unit for your assignment. One nurse from each unit stays on the unit."},
    {q:"After a resident is found following a Code Green, staff who were involved must:",o:["Go home","Give a statement before leaving that shift","Write a statement next week","Call the family themselves"],a:1,
     w:"Statements must be obtained from all involved staff before they leave that shift, and an incident report is completed."},
    {q:"The power goes out. Where should a resident's oxygen concentrator be plugged in?",o:["Any outlet","An emergency-power outlet (usually red)","An extension cord from the hallway","Leave it unplugged until the power returns"],a:1,
     w:"Outlets on emergency power, usually red, stay on with the generator. Ask Maintenance which ones serve your area."},
    {q:"Where is our emergency plan kept?",o:["Only in the Administrator's office","In the Fire/Disaster Manual at each department and unit nurses' station","Online only","It isn't written down"],a:1,
     w:"The Fire/Disaster Manual is at each department and unit nurses' station."},
    {q:"During most emergencies, residents:",o:["Are evacuated right away","Shelter in place unless the person in charge orders an evacuation","Go home with family","Are moved to the parking lot"],a:1,
     w:"Most emergencies are handled by sheltering in place. Only the person in charge orders an evacuation."},
    {q:"A visitor is shouting threats at you in the hallway. You:",o:["Argue back","Stay calm, keep your distance and a path to an exit, and call for help (Code Silver, or 911 if anyone is in danger)","Try to grab him","Ignore it and keep working"],a:1,
     w:"Keep yourself and residents safe, get help, and report every incident."},
    {q:"In an active shooter situation, your first choice is to:",o:["Fight","Run, if there's a safe way out","Call your family","Wait at the nurses' station"],a:1,
     w:"Run, Hide, Fight. Get out if you safely can; hide if you can't; fight only as a last resort."}
  ]

{
  id:"fire", title:"Fire Safety: Code Red", tag:"K-Tags", min:13,
  narration:`Fire safety covers RACE, PASS, alarm response, evacuation, fire doors, and smoking safety. Remember RACE: Rescue anyone in immediate danger, Alarm by pulling the nearest pull station and calling out Code Red, Confine the fire by closing doors and windows, and Extinguish if it is safe to do so, or evacuate. To use an extinguisher, remember PASS: Pull the pin, Aim at the base of the fire, Squeeze the handle, and Sweep side to side. In the event of a fire, remove residents from immediate danger, shout Code Red and the room number, pull the nearest alarm, and close all doors in the hallway near the fire. Mark evacuated rooms with an orange door tag. These are kept in the fire extinguisher cabinets. Clear the hallway of obstructions. Evacuate beyond the first set of fire doors. Further evacuation is decided by the fire department. Monitor residents at all times and close doors and windows in unaffected areas. From eight a.m. to eight p.m., the receptionist announces the alarm location, and overnight the East Charge Nurse or Nursing Supervisor does. The announcement is Code Red, the building and location, and the room, repeated four times. Then nine one one is called to report the fire at 209 Roberts Road, Jenkins Township. If an external evacuation is ordered, the primary meeting place is the front parking lot of P T N F. Know your department's role. The Primary Response Team, which is security, maintenance, Nursing Assignment number one from each unit, and the Nursing Supervisor, responds to the fire, along with everyone assigned to that area. Staff elsewhere generally stay in their area and await instructions. If Additional Staff Needed is paged, every unaffected area sends two more people. All Clear is announced four times when the emergency is over. And remember, the entire Wesley Village campus is smoke-free. Fire is even more frightening for our residents than for people at home, because of decreased mobility, confusion from alarms and lights, disorientation, and decreased comprehension. That's why every one of us must know exactly what to do, how to do it, and when to do it. If fire threatens one wing, residents may be moved to a safe area in another wing on the same floor. Evacuate residents in immediate danger first, then ambulatory residents, then semi-ambulatory residents, and finally dependent, bed-bound, and very ill residents. Ambulatory residents hold hands in groups and walk single file with staff. Non-ambulatory residents are moved in wheelchairs, on a sheet or blanket pulled along the floor, or with group carries. After Code Red All Clear, a Code Green Census accounts for every resident. Open residents' doors as soon as possible and reassure them.`,
  sections:[
    {h:"Why fire is so dangerous here", html:`<p>A fire in a long-term care community can be even more terrifying and traumatic for residents than at home, because of:</p>
      <ul><li><b>Decreased mobility:</b> they depend on others or on equipment to move</li><li><b>Confusion</b> from alarms and lights, and too much stimulation</li><li><b>Disorientation:</b> not knowing where they are or where they're going</li><li><b>Decreased comprehension:</b> not understanding what is happening</li></ul>
      <div class="callout key"><b>That's why every one of us must know exactly WHAT to do, HOW to do it, and WHEN to do it.</b><span>The Fire/Disaster Manual is at each department and unit nurses' station.</span></div>`},
    {h:"RACE and PASS", html:`<div class="acro">
      <div><b>RACE: when you find a fire</b><dl><dt>R</dt><dd><b>Rescue</b> anyone in immediate danger</dd><dt>A</dt><dd><b>Alarm</b>: pull the nearest pull station and shout "Code Red"</dd><dt>C</dt><dd><b>Confine</b>: close doors and windows</dd><dt>E</dt><dd><b>Extinguish</b> if safe, or evacuate</dd></dl></div>
      <div><b>PASS: using an extinguisher</b><dl><dt>P</dt><dd><b>Pull</b> the pin</dd><dt>A</dt><dd><b>Aim</b> at the base of the fire</dd><dt>S</dt><dd><b>Squeeze</b> the handle</dd><dt>S</dt><dd><b>Sweep</b> side to side</dd></dl></div></div>`},
    {h:"In the event of a fire", html:`<ol class="steps">
      <li><span>Remove residents from the immediate danger area.</span></li>
      <li><span>Shout <b>"CODE RED"</b> and the room number or location.</span></li>
      <li><span>Pull the nearest fire alarm.</span></li>
      <li><span>Close all hallway doors near the fire. <b>Mark evacuated rooms with an orange door tag</b> (kept in the fire extinguisher cabinets).</span></li>
      <li><span>Clear the hallway of all obstructions.</span></li>
      <li><span>Evacuate <b>beyond the first set of fire doors</b>. The Fire Department decides on further evacuation.</span></li>
      <li><span>Monitor all residents at all times. Close doors and windows in unaffected areas.</span></li></ol>`},
    {h:"Alarm announcements (PTNF)", html:`<ul>
      <li><b>8 a.m.–8 p.m.:</b> the receptionist announces via Page-0 (all page, dial <b>5500</b>)</li>
      <li><b>8 p.m.–8 a.m.:</b> the East Charge Nurse or Nursing Supervisor announces</li>
      <li>Format: <b>Code Red · building and location · room number</b>, repeated <b>four times</b></li>
      <li>After the final announcement, 911 is called: <b>209 Roberts Road, Jenkins Township</b></li>
      <li>"All Clear, Code Red" is announced only after the fire safety expert or fire department calls off the alarm</li></ul>`},
    {h:"Evacuation order and methods", html:`<p>If fire threatens one wing, residents may be moved to a safe area in another wing on the same floor. <b>Evacuate in this order:</b></p>
      <ol class="steps"><li><span>Residents in <b>immediate danger</b></span></li><li><span><b>Ambulatory</b> residents</span></li><li><span><b>Semi-ambulatory</b> residents</span></li><li><span><b>Dependent, bed-bound and very ill</b> residents</span></li></ol>
      <div class="acro">
        <div><b>Ambulatory residents</b><p class="small" style="margin-top:6px">With staff guiding them, hold hands in groups and walk single file to the safe area.</p></div>
        <div><b>Non-ambulatory residents</b><p class="small" style="margin-top:6px">Wheelchairs; a sheet or blanket pulled along the floor; or group carry methods.</p></div></div>
      <p class="small">Every resident has a tag on each unit with their name, diagnosis and unit. Attach it to the resident's arm or clothing (string or rubber band) for an external evacuation.</p>`},
    {h:"External evacuation", html:`<p>If the Fire Department or Administration orders an external evacuation, residents move to the farthest internal point from danger and the Code Yellow evacuation plan begins. <b>The primary meeting place is the front parking lot of PTNF.</b> Charge nurses bring the med-cart laptops and posted schedules for a head count; priority medications go in a labeled bedside bag with each resident; every resident wears a name tag.</p>`},
    {h:"Your department's role", html:`<div class="tbl"><table><thead><tr><th>Department</th><th>What you do</th></tr></thead><tbody>
      <tr><td><b>Primary Response Team</b><br><span class="small muted">Security, Maintenance, Nursing Assignment #1 from each unit, Nursing Supervisor, plus all staff assigned to the alarm area</span></td><td>Respond to the fire location; evacuation and containment</td></tr>
      <tr><td><b>Housekeeping</b></td><td>At the alarm location: assist. Elsewhere: stay in your work area and await instructions</td></tr>
      <tr><td><b>Dietary</b></td><td>At the alarm location: assist. In the department: close doors, turn off equipment, go to the Dining Room (if the alarm is in the kitchen, go to the East Unit)</td></tr>
      <tr><td><b>Business Office</b></td><td>Secure important documents; go to the lobby to redirect visitors (if the alarm is in the lobby, go outside)</td></tr>
      <tr><td><b>Activities</b></td><td>Monitor residents; assist the Primary Response Team if in the alarm area</td></tr>
      <tr><td><b>Therapies</b></td><td>Remain with residents and await instructions</td></tr>
      <tr><td><b>Laundry</b></td><td>Turn off equipment and await instructions (outside to the Employee Entrance if needed)</td></tr>
      <tr><td><b>Administrator, Dept. Heads, Chaplain, Supervisors</b></td><td>Respond if available</td></tr></tbody></table></div>
      <p><b>"Additional Staff Needed"</b> is paged four times when more help is required. Every unaffected work area sends <b>two more people</b> to the scene. <b>"All Clear"</b> is also announced four times.</p>`},
    {h:"Smoking", html:`<div class="callout key"><b>The United Methodist Homes Wesley Village campus is a smoke-free community.</b></div>
`},
    {h:"After the All Clear", html:`<ol class="steps"><li><span><b>"Code Red All Clear"</b> is announced when the drill is complete or the fire is out.</span></li><li><span>It's followed by a <b>"Code Green Census"</b> so we can account for every resident.</span></li><li><span><b>Open residents' doors</b> as soon as possible and <b>reassure them</b>.</span></li></ol>`}
  ],
  quiz:[
    {q:"In RACE, what does the \"A\" stand for?",o:["Assist","Alarm","Assess","Avoid"],a:1,
     w:"Rescue, Alarm, Confine, Extinguish/Evacuate."},
    {q:"What is the first step of PASS?",o:["Point the nozzle","Pull the pin","Press the lever","Prepare the hose"],a:1,
     w:"Pull, Aim, Squeeze, Sweep."},
    {q:"How do you mark a room that has been evacuated during a fire?",o:["Green door tag","Orange door tag","Leave the door wide open","Write on the door"],a:1,
     w:"Orange door tags, kept in the fire extinguisher cabinets. (Yellow tags are for Code Green searches.)"},
    {q:"Where do you first evacuate residents during a fire?",o:["The front parking lot","Beyond the first set of fire doors","Their own rooms","The chapel"],a:1,
     w:"Evacuate beyond the first set of fire doors. Further evacuation is decided by the Fire Department."},
    {q:"You work in Dietary and the alarm is in another building. You:",o:["Run to the alarm","Close doors, turn off equipment, go to the Dining Room and await instructions","Leave the campus","Keep cooking"],a:1,
     w:"Dietary staff in the department close doors, turn off equipment and evacuate to the Dining Room."},
    {q:"When \"Additional Staff Needed\" is paged, each unaffected area sends:",o:["Everyone","Two more people","One supervisor","Nobody"],a:1,
     w:"All unaffected work areas dispatch two more personnel to the alarm scene."},
    {q:"Where can employees smoke on the Wesley Village campus?",o:["The employee entrance","The parking lot","Nowhere. It's a smoke-free campus","Designated smoking hut"],a:2,
     w:"Wesley Village is a smoke-free community."},
    {q:"During a fire evacuation, which residents are moved first (after anyone in immediate danger)?",o:["Bed-bound residents","Ambulatory residents","Residents on the top floor","Residents with visitors"],a:1,
     w:"Order: immediate danger, then ambulatory, semi-ambulatory, and finally dependent, bed-bound and very ill residents."},
    {q:"What follows a \"Code Red All Clear\"?",o:["Nothing","A Code Green Census to account for every resident","A Code Yellow","Everyone goes on break"],a:1,
     w:"A Code Green Census follows the All Clear. Then open residents' doors and reassure them."}
  ]
},
{
  id:"hipaa", title:"HIPAA & Protected Health Information", tag:"HIPAA 45 CFR 160 & 164 · F583", min:12,
  narration:`HIPAA, the Health Insurance Portability and Accountability Act, is the federal law that protects residents' health information. Protected Health Information, or P H I, is any information that identifies a resident and relates to their health, their care, or payment for their care. It can be spoken, written on paper, or electronic. It includes obvious things like diagnoses, medications, and lab results, and also things you might not expect: a resident's name, room number, date of birth, admission date, photo, phone number, Social Security number, Medicare or insurance number, and medical record number. If it can identify the person and it's connected to their care, it's P H I. Protect it every day. Keep your voice down when you discuss residents, and never talk about them in elevators, hallways, the lobby, or the cafeteria. Lock or log out of computers and tablets whenever you step away. Never share your password. Put paper with P H I in a locked shred bin, never the trash. Don't leave charts, census sheets, or report sheets where others can see them. Never take photos or videos of residents on your personal phone, and never post anything about residents on social media, even without a name, and even if the resident says it's okay. Don't text or email P H I except through facility-approved, secure systems. When someone calls asking about a resident, don't confirm anything unless you know they are an approved contact. Residents have rights under HIPAA too. They receive our Notice of Privacy Practices. They can see and get a copy of their records, ask for corrections, ask for a list of certain disclosures, ask for limits on what we share, ask us to contact them a certain way, and file a privacy complaint without fear of retaliation. If you think P H I was shared with the wrong person, lost, or seen by someone who shouldn't have seen it, report it to your supervisor and the Privacy Officer right away. Don't try to fix it yourself. The facility must investigate and may have to notify the resident and the federal government. Protected Health Information may only be shared as permitted and necessary. Our Minimum Necessary policy means you only access, use, or share the minimum amount of P H I needed to do your job. Do not look at or disclose information you don't need. Your system access is based on your job duties. P H I may be shared freely with other healthcare providers when it is needed for a resident's treatment. The minimum necessary rule does not apply when information is shared for treatment, when residents request their own records, when the resident has signed a valid authorization, or when disclosure is required by law or by H H S. Entire medical records should only be released when truly necessary, and requests for complete records go to the Privacy Officer unless an exception applies. The Privacy Officer also reviews any unusual or non-routine request to verify why the information is needed, that only what's necessary is shared, and that all HIPAA requirements are met. Employees who violate this policy may face discipline, up to and including termination.`,
  sections:[
    {h:"What is PHI?", html:`<p><b>Protected Health Information (PHI)</b> is any information that <b>identifies a resident</b> and relates to their <b>health, care, or payment for care</b>. HIPAA (the Health Insurance Portability and Accountability Act) is the federal law that protects it, in <b>every form: spoken, paper, and electronic</b>.</p>
      <div class="acro">
        <div><b>Health information</b><p class="small" style="margin-top:6px">Diagnoses, medications, lab results, care plans, therapy notes, behaviors, falls, wounds, hospital visits.</p></div>
        <div><b>Identifiers (when tied to care)</b><p class="small" style="margin-top:6px">Name, room number, date of birth, admission and discharge dates, photos of the face, address, phone, email, Social Security number, Medicare or insurance number, medical record number, and more (HIPAA lists 18).</p></div>
      </div>
      <div class="callout key"><b>Rule of thumb</b><span>If it could identify the resident and it's connected to their care, it's PHI. A name on a whiteboard, a census sheet, or a photo all count.</span></div>`},
    {h:"Protecting PHI every day", html:`<ul>
      <li><b>Talk quietly</b> and only with people who need to know. Never discuss residents in elevators, hallways, the lobby or cafeteria.</li>
      <li><b>Lock or log out</b> of computers and tablets whenever you step away. <b>Never share your password</b>; everything done under your login is yours.</li>
      <li><b>Paper:</b> keep charts, report sheets and census lists out of public view. Dispose of them in a <b>locked shred bin</b>, never the trash. Don't take them home.</li>
      <li><b>Phones and social media:</b> no photos or videos of residents on personal devices, and <b>never post about residents</b>, even without a name and even if the resident says it's okay.</li>
      <li><b>Texts, email and fax:</b> only through facility-approved, secure systems. Double-check the recipient before you send.</li>
      <li><b>Phone calls:</b> don't confirm a resident is here or share anything unless you know the caller is an approved contact. When unsure, take a message for the nurse.</li></ul>
      <div data-widget="phiok"></div>`},
    {h:"Residents' privacy rights", html:`<p>Under HIPAA, residents (or their representatives) have the right to:</p>
      <ul><li>Receive our <b>Notice of Privacy Practices</b>, explaining how their information is used</li>
      <li><b>See and get a copy</b> of their medical and billing records</li>
      <li>Ask us to <b>correct</b> information they believe is wrong</li>
      <li>Get a <b>list of certain disclosures</b> we made</li>
      <li>Ask us to <b>limit</b> what we share, and to <b>contact them a certain way</b></li>
      <li><b>File a privacy complaint</b> with the facility or with the U.S. Department of Health and Human Services, without retaliation</li></ul>
      <p class="small muted">If a resident asks about any of these, connect them with the Privacy Officer or Social Services.</p>`},
    {h:"Report privacy incidents right away", html:`<div class="callout warn"><b>Shared with the wrong person? Lost? Seen by someone who shouldn't have?</b><span>Tell your supervisor and the <b>Privacy Officer immediately</b>. Examples: a fax or email to the wrong number, a lost report sheet, a resident's papers given to another family, a stolen phone with work email. Don't try to fix it yourself.</span></div>
      <p>The facility must investigate every incident. If it's a breach, the facility must notify the affected resident (no later than <b>60 days</b> after discovery) and report it to HHS. Reporting quickly protects residents, and you will not be retaliated against for reporting in good faith.</p>`},
    {h:"Minimum Necessary", html:`<div class="callout key"><b>Only access or share the PHI you need to do your job.</b><span>Do not look at or disclose information that isn't necessary, even out of curiosity, even about someone you know.</span></div>
      <ul><li>Your access to PHI is based on your job duties</li><li>PHI may be shared freely with other healthcare providers when needed for a resident's <b>treatment</b></li><li>For payment, operations, or other approved purposes, release only the minimum required</li></ul>`},
    {h:"When minimum necessary does not apply", html:`<ul><li>Sharing for resident treatment</li><li>A resident requesting their own records</li><li>A valid signed authorization from the resident</li><li>Disclosures required by law, HIPAA, or HHS</li></ul>`},
    {h:"The Privacy Officer", html:`<p>Requests for <b>complete medical records</b> and any <b>non-routine request</b> go to the Privacy Officer, who verifies why the information is needed, that only what's necessary is shared, and that all HIPAA documentation is in place.</p>
      <div class="callout warn"><b>Failure to comply</b><span>Violations may lead to disciplinary action, up to and including termination.</span></div>`}
  ],
  ack:"I understand what protected health information (PHI) is. I will protect it in every form, follow the Minimum Necessary policy, never post about residents on social media, and report any privacy incident to my supervisor and the Privacy Officer right away.",
  quiz:[
    {q:"Your neighbor was admitted to another unit. Can you look up their chart to see how they're doing?",o:["Yes, if you have system access","Yes, if you don't tell anyone","No. Only access PHI you need for your job","Only on your break"],a:2,
     w:"Only access the PHI you need to complete your job. Curiosity is never a reason."},
    {q:"The minimum necessary rule does NOT apply when:",o:["Sharing information for a resident's treatment","Talking about residents in the break room","Posting on social media","Answering a caller who says they're family"],a:0,
     w:"PHI may be shared freely with other providers when needed for treatment."},
    {q:"Someone requests a resident's complete medical record. This should be:",o:["Copied and handed over immediately","Reviewed by the Privacy Officer unless an exception applies","Refused in all cases","Emailed to the requester"],a:1,
     w:"Requests for complete records go to the Privacy Officer unless an exception applies."},
    {q:"What can happen if you violate the HIPAA minimum necessary policy?",o:["Nothing, if it was an accident","A verbal reminder only","Disciplinary action up to and including termination","A fine paid by the facility only"],a:2,
     w:"Violations may lead to discipline up to and including termination."},
    {q:"Which of these is protected health information (PHI)?",o:["A resident's name and room number on a census sheet","A resident's photo","A resident's date of birth in their chart","All of these"],a:3,
     w:"Names, room numbers, photos and dates of birth are identifiers. Tied to a resident's care, they're all PHI."},
    {q:"A resident asks you to take a picture with her and post it on your Facebook. What do you do?",o:["Post it, since she gave permission","Post it without her name","Politely decline. Staff never post residents on personal social media","Post it to a private group only"],a:2,
     w:"Never post residents on personal social media, even with permission and even without a name."},
    {q:"You realize you faxed a resident's medication list to the wrong number. What do you do?",o:["Nothing; it was an accident","Call the number and ask them to throw it away, then forget it","Tell your supervisor and the Privacy Officer right away","Wait to see if anyone complains"],a:2,
     w:"Report every privacy incident immediately so the facility can investigate and notify if required."},
    {q:"A resident asks to see a copy of her own medical record. This is:",o:["Not allowed","Her right under HIPAA. Connect her with the Privacy Officer or Social Services","Only allowed with a doctor's order","Only allowed for family members"],a:1,
     w:"Residents have the right to see and get a copy of their own records."}
  ]
},
{
  id:"clinical", title:"Clinical Care Standards", tag:"F656 · F677 · F686 · F692 · F697", min:5,
  narration:`Every department supports good clinical care. Care plans must be comprehensive and person-centered, reflecting each resident's goals and preferences. Restorative nursing helps residents maintain or improve their highest practicable physical, mental, and psychosocial well-being. Pressure injury prevention includes risk assessment, skin inspections, repositioning, nutrition, and documentation. A D L care means providing the services residents need to maintain grooming, mobility, continence, nutrition, and function. Pain management means assessing, monitoring, treating, and documenting pain using resident-centered approaches. And nutrition and hydration care prevents significant weight loss and dehydration through assessment and interventions. If you notice a change in a resident, such as a new red area on the skin, a resident in pain, or a resident who isn't eating or drinking, tell the nurse right away.`,
  sections:[
    {h:"The standards", html:`<div class="tbl"><table><thead><tr><th>Area</th><th>Standard</th></tr></thead><tbody>
      <tr><td><b>Care Planning</b> <span class="tag">F656–F657</span></td><td>Comprehensive, person-centered care plans reflect each resident's goals and preferences</td></tr>
      <tr><td><b>Restorative Nursing</b></td><td>Maintain or improve residents' highest practicable physical, mental, and psychosocial well-being</td></tr>
      <tr><td><b>Pressure Injury Prevention</b> <span class="tag">F686</span></td><td>Risk assessment, skin inspections, repositioning, nutrition, and documentation</td></tr>
      <tr><td><b>ADL Care</b> <span class="tag">F677</span></td><td>Services to maintain grooming, mobility, continence, nutrition, and function</td></tr>
      <tr><td><b>Pain Management</b> <span class="tag">F697</span></td><td>Assess, monitor, treat, and document pain using resident-centered approaches</td></tr>
      <tr><td><b>Nutrition & Hydration</b> <span class="tag">F692–F693</span></td><td>Prevent significant weight loss and dehydration through assessment and interventions</td></tr></tbody></table></div>
      <div class="callout key"><b>See a change? Tell the nurse.</b><span>A new red area on the skin, signs of pain, a resident not eating or drinking. Report it right away.</span></div>`},
    {h:"", html:P("Detail for pressure injury, restorative documentation, pain, nutrition and oxygen safety","Slides 57–70 are mostly placeholders (\"Kathy and Annie\", \"What else do you want?\", \"Oxygen Use and Safety\"). Add content, including where to find restorative tasks in POC and how to document.")}

    {q:"A resident's care plan must reflect:",o:["The easiest routine for staff","The resident's goals and preferences","Only the physician's orders","The previous facility's plan"],a:1,
     w:"Comprehensive, person-centered care plans reflect resident goals and preferences."},
    {q:"The goal of restorative nursing is to:",o:["Discharge residents faster","Maintain or improve the resident's highest practicable well-being","Replace therapy","Reduce staffing needs"],a:1,
     w:"Restorative nursing maintains or improves the highest practicable physical, mental, and psychosocial well-being."},

    {q:"You notice a resident wincing and guarding her arm. You should:",o:["Ignore it unless she complains","Tell the nurse right away","Give her medication from the cart","Wait until the next care-plan meeting"],a:1,

{
  id:"qapi", title:"Quality Improvement (QAPI)", tag:"F865–F868", min:5,
  narration:`QAPI stands for Quality Assurance and Performance Improvement. It's the structured process our facility uses to measure quality, identify problems, put improvements in place, and make sure residents receive the safest, highest-quality care possible. Our QAPI program is designed to improve resident outcomes, enhance residents' quality of life, and reduce adverse events like falls, infections, medication errors, and rehospitalizations. It uses data to spot trends and opportunities. And it depends on staff at every level. If you see a better way to do something, or a problem that keeps happening, speak up. That's QAPI in action. At United Methodist Homes, corporate quality management directors support each campus. Past QAPI teams have worked on missing items like clothing, chargers, glasses, and hearing aids; urinary continence through better toileting schedules; falls, by tracking when and how they happen; and safe resident handling, by auditing transfers and lift use.`,
  sections:[
    {h:"What QAPI is", html:`<p><b>Quality Assurance and Performance Improvement</b> is the structured process we use to measure quality, identify problems, implement improvements, and make sure residents receive the safest, highest-quality care possible.</p>`},
    {h:"What it's designed to do", html:`<ul><li>Improve resident care outcomes</li><li>Enhance residents' quality of life</li><li>Reduce adverse events: falls, infections, medication errors, rehospitalizations</li><li>Use data to identify trends and opportunities</li><li><b>Engage staff at all levels</b>. If you see a problem or a better way, speak up.</li></ul>`},
    {h:"QAPI at United Methodist Homes", html:`<p>Corporate quality management directors support each campus as we work on projects to improve care and services. Past QAPI teams have tackled:</p>
      <div class="acro">
        <div><b>Missing items</b><p class="small" style="margin-top:6px">Clothing, chargers, glasses, hearing aids</p></div>
        <div><b>Urinary continence</b><p class="small" style="margin-top:6px">Assessing and scheduling the right toileting times to improve continence</p></div>
        <div><b>Falls</b><p class="small" style="margin-top:6px">Tracking the days, times and patterns of falls to prevent future falls and injuries</p></div>
        <div><b>Safe resident handling</b><p class="small" style="margin-top:6px">Auditing and teaching proper transfer techniques and lift use</p></div></div>`}
  ],
  quiz:[
    {q:"QAPI identifies problems and opportunities by:",o:["Guessing","Using data to identify trends","Waiting for state surveys","Asking only managers"],a:1,
     w:"QAPI uses data to identify trends and opportunities for improvement."},
    {q:"Who takes part in quality improvement?",o:["Only the Administrator","Only nurses","Staff at all levels","Only the QAPI committee"],a:2,
     w:"QAPI engages staff at all levels."},
    {q:"Which is an adverse event QAPI aims to reduce?",o:["Family visits","Falls and infections","Resident activities","Staff training"],a:1,
     w:"Falls, infections, medication errors, and rehospitalizations."},
    {q:"Which is an example of a past QAPI project at UMH?",o:["Choosing new uniforms","Tracking fall patterns to prevent future falls","Planning the holiday party","Changing the parking lot"],a:1,
     w:"Past QAPI teams worked on missing items, continence, falls, and safe resident handling."}
  ]
},
{
  id:"compliance", title:"Compliance & Code of Conduct", tag:"F895", min:11,
  narration:`Our Compliance and Ethics Program promotes a culture of ethical conduct through prevention, detection, and resolution of behavior that doesn't comply with laws, regulations, standards, and our policies. The Code of Conduct is our guide to appropriate workplace behavior and our shared responsibility to do the right thing, including our obligation to report misconduct. It covers all employees, physicians and other providers who serve our residents, contracted workers like agency staff, consultants, and hospice workers, vendors, and volunteers, including our Board of Directors. AQORD Compliance Collaborative supports our program with mock surveys, billing audits, compliance and privacy reviews, education, and management of the compliance hotline. AQORD's Vice President of Compliance, Karla Dreisbach, is our Compliance Officer. Here at Wesley Village, our Compliance Official, Danielle Janeski, coordinates day-to-day compliance, and a Compliance Committee meets at least quarterly. The Compliance Hotline is available twenty-four seven. Calls are taken by an outside agency, and you can report anonymously. Hotline information is posted throughout the facility, on the intranet, and in the employee handbook. Our policy protects you from intimidation and retaliation when you report in good faith, as do state and federal law. Compliance is part of everyone's job description and a condition of employment. Annual compliance education is mandatory, and everyone signs the Code of Conduct attestation upon hire and every year. Violations lead to fair and consistent discipline, and serious violations can lead to termination. Remember: there is no acceptable excuse for unethical behavior. If it doesn't feel right, ask someone. The Code of Conduct expects every employee to document exactly the services provided, cooperate with coworkers, follow regulations, and know our compliance policies on the Intranet. Read the Code of Conduct book you receive from HR. The False Claims Act prohibits submitting false or fraudulent claims to the government. Fraud is getting a benefit by intentionally misrepresenting or hiding facts. Waste is unnecessary cost from poor management or practices. Abuse is excessive or improper use of government resources. Penalties include up to three times what the government paid, fines for each false claim, and exclusion from Medicare and Medicaid. Harassment is unwelcome conduct based on a protected characteristic, such as race, color, religion, sex, including pregnancy, sexual orientation, and gender identity, national origin, age, disability, or genetic information. Quid pro quo harassment ties a job benefit to accepting sexual advances. A hostile work environment is conduct severe or frequent enough to make work intimidating, hostile, or offensive. Harassment can be verbal, physical, visual, or written, and it can come from a coworker, supervisor, resident, family member, visitor, or vendor. Report it to your supervisor, Human Resources, or the Compliance Hotline. You are protected from retaliation. At the end of this module you will sign the Commitment to Compliance, the acknowledgement that you received and read the Code of Conduct.`,
  sections:[
    {h:"Purpose", html:`<p>Our Compliance and Ethics Program promotes a culture of ethical conduct through <b>prevention, detection, and resolution</b> of behavior that doesn't comply with laws, regulations, standards, and our policies. The Code of Conduct is our guide to appropriate workplace behavior, our shared responsibility to do the right thing, and our obligation to report misconduct.</p>`},
    {h:"Who is covered", html:`<ul><li>All employees</li><li>Physicians and other healthcare providers who serve our residents</li><li>Contracted workers: agency staff, consultants, hospice workers</li><li>Vendors who provide goods and services</li><li>Volunteers, including the Board of Directors</li></ul>`},
    {h:"Your compliance team", html:`<div class="tbl"><table><tbody>
      <tr><td><b>Compliance Official</b> (on site)</td><td>Danielle Janeski · djaneski@umhwc.org</td></tr>
      <tr><td><b>Compliance Officer</b></td><td>Karla Dreisbach, VP of Compliance, AQORD Compliance Collaborative</td></tr>
      <tr><td><b>Board responsibility</b></td><td>Board of Directors, through Brian Picchini</td></tr>
      <tr><td><b>Compliance Committee</b></td><td>Key staff from several departments; meets at least quarterly</td></tr></tbody></table></div>`},
    {h:"The Compliance Hotline", html:`<div class="callout key"><b style="font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums">1-800-211-2713</b><span>Available 24/7 · answered by an outside agency · <b>you may report anonymously</b> · issues are sent back to the Community for investigation. Posted throughout the facility, on the intranet, and in the employee handbook.</span></div>
      <p><b>Non-intimidation and non-retaliation:</b> you are protected by our policy and by state and federal law when you report what you believe is not right.</p>`},
    {h:"Eight elements of an effective program", html:`<ol><li>Written policies and procedures</li><li>A designated Compliance Officer</li><li>Training and education</li><li>Communication lines to the Compliance Officer</li><li>Disciplinary policies</li><li>Identifying compliance risk areas</li><li>Responding to compliance issues</li><li>Non-intimidation and non-retaliation</li></ol>`},
    {h:"What's expected of you", html:`<ul><li>Compliance is part of everyone's job description, a <b>condition of employment</b>, and part of performance reviews</li><li>Annual compliance education is mandatory</li><li><b>Sign the Code of Conduct acknowledgement (at the end of this module) on hire and annually</b></li><li>You must report suspected non-compliance</li><li>Discipline is fair and consistent; serious violations can lead to termination</li></ul>
      <div class="callout key"><b>There is no acceptable reason or excuse for unethical behavior.</b><span>If it doesn't feel right, ask someone.</span></div>`},
    {h:"What the Code of Conduct expects", html:`<p>The Code of Conduct helps us meet ethical standards in the complex world of health care and guides day-to-day decisions. All employees are expected to:</p>
      <ul><li><b>Document exactly the services provided</b></li><li>Cooperate with everyone they work with</li><li>Follow regulations as instructed</li><li>Know our compliance policies and procedures (on the Intranet)</li></ul>
      <p>Leaders lead by example, and everyone takes part in a culture of ethics and integrity. <b>Read your Code of Conduct book from HR.</b></p>`},
    {h:"Workplace harassment", html:`<p><b>Harassment</b> is unwelcome conduct based on a protected characteristic, such as race, color, religion, sex (including pregnancy, sexual orientation and gender identity), national origin, age (40 or older), disability or genetic information. It's against our policy and against federal and Pennsylvania law.</p>
      <div class="acro">
        <div><b>Quid pro quo</b><p class="small" style="margin-top:6px">"This for that": a job benefit, like a schedule, promotion or keeping your job, is tied to accepting sexual advances or conduct.</p></div>
        <div><b>Hostile work environment</b><p class="small" style="margin-top:6px">Conduct severe or frequent enough to make work intimidating, hostile or offensive.</p></div>
        <div style="grid-column:1/-1"><b>Forms it can take</b><ul class="small" style="margin-top:6px"><li><b>Verbal:</b> slurs, jokes, insults, comments about someone's body, repeated unwanted requests for dates</li><li><b>Physical:</b> unwanted touching, blocking someone's way</li><li><b>Visual or written:</b> offensive pictures, gestures, texts, emails or social media posts</li></ul></div></div>
      <p>Harassment can come from a coworker, supervisor, resident, family member, visitor or vendor. <b>Report it</b> to your supervisor, Human Resources, or the Compliance Hotline. You're protected from retaliation for reporting or for helping with an investigation.</p>`},
    {h:"The False Claims Act: fraud, waste and abuse", html:`<p>The <b>False Claims Act</b> prohibits submitting false or fraudulent claims to the government, for example billing Medicare or Medicaid for care that wasn't given or documented accurately.</p>
      <div class="acro">
        <div><b>Fraud</b><p class="small" style="margin-top:6px">Getting a benefit by intentionally misrepresenting or hiding facts.</p></div>
        <div><b>Waste</b><p class="small" style="margin-top:6px">Unnecessary costs from poor management, practices or controls.</p></div>
        <div style="grid-column:1/-1"><b>Abuse</b><p class="small" style="margin-top:6px">Excessive or improper use of government resources.</p></div></div>
      <div class="callout warn"><b>Penalties are severe</b><span>Up to three times what the government paid, plus interest, plus a fine for <b>each</b> false claim, and possible exclusion from Medicare and Medicaid. Accurate documentation protects residents, you, and the organization.</span></div>`}
  ],
  signforms:["coc"],
  quiz:[
    {q:"Which is true about the Compliance Hotline?",o:["It's only open business hours","You must give your name","It's available 24/7 and you may report anonymously","It's answered by your supervisor"],a:2,
     w:"The hotline is available 24/7, answered by an outside agency, and reports can be anonymous."},
    {q:"Who is covered by the Code of Conduct?",o:["Employees only","Employees and physicians only","Employees, providers, contracted workers, vendors, and volunteers including the Board","Managers only"],a:2,
     w:"The Code covers everyone who works with or for the Community."},
    {q:"If you report a concern in good faith, you are:",o:["Protected from intimidation and retaliation","Required to prove it first","Reported to the state","Moved to another unit"],a:0,
     w:"Our non-retaliation policy and state and federal law protect good-faith reporters."},
    {q:"When do employees sign the Code of Conduct attestation?",o:["Only on hire","Upon hire and annually","Every five years","Only after a violation"],a:1,
     w:"Everyone signs the attestation upon hire and annually."},
    {q:"The compliance program promotes ethical conduct through:",o:["Prevention, detection, and resolution","Punishment only","Annual surveys only","Hiring and firing"],a:0,
     w:"Prevention, detection, and resolution."},
    {q:"Documenting care you didn't actually provide could violate:",o:["Nothing, if it was planned","The False Claims Act and our Code of Conduct","Only facility dress code","The fire code"],a:1,
     w:"Employees must document exactly the services provided. False documentation that leads to billing can violate the False Claims Act."},
    {q:"A supervisor hints that you'll get better shifts if you go out with him. This is:",o:["Flirting, and not a problem","Quid pro quo sexual harassment; report it","Fine if you say yes","Only a problem if it happens twice"],a:1,
     w:"Tying a job benefit to accepting advances is quid pro quo harassment. Report it to HR or the Compliance Hotline."}
  ]
},
{
  id:"signoff", title:"Final Sign-Off", tag:"28 Pa. Code §201.19(6) · §201.20(d)", min:5,
  narration:`You're almost done. This last step is your sign-off, the same acknowledgments you would sign on paper at the end of orientation. First, the Employee Handbook acknowledgment: open the handbook, read it, and sign that you received and read it. Second, the General Orientation acknowledgment. It lists every topic you received education on, and by signing you confirm that United Methodist Homes Wesley Village Campus educated you on its policies, procedures, and standards of care, that you received orientation to the facility, and that you had the chance to ask questions and got clear answers. Two topics on that list, current COVID requirements and Relias completion requirements, are reviewed with Staff Development. If you have any questions about anything in orientation, ask your supervisor or Staff Development before you sign. When both are signed, you can take the final exam. Some handbook rules new employees ask about most: call your manager at least two hours before your shift if you can't come in. Clocking in eight minutes or more late counts as tardy. Your first three months are your introductory period. Don't use your phone while you're doing your work, never take photos of residents, and never accept tips, gifts, or loans from residents. Swipe your own badge only, never work off the clock, and wear your I D badge where it can be seen at all times. Read the full handbook before you sign.`,
  sections:[
    {h:"Before you sign", html:`<p>These are the same acknowledgments you would sign on paper at the end of orientation. Pennsylvania requires written records of what you were taught and that you attended (28 Pa. Code §201.20(d)), completed within one week of your first day (§201.19(6)).</p>
      <div class="callout key"><b>Questions?</b><span>If anything in orientation wasn't clear, ask your supervisor or Staff Development <b>before</b> you sign. Current COVID requirements and Relias completion requirements are reviewed with Staff Development.</span></div>`},
    {h:"Employee Handbook: rules people ask about most", html:`<p>Read the whole handbook before you sign. These are the rules new employees ask about most:</p>
      <div class="acro">
        <div><b>Calling off and being late</b><ul class="small" style="margin-top:6px"><li>Call your manager <b>at least 2 hours before</b> your shift if you can't come in</li><li>Clocking in <b>8 minutes or more</b> late counts as tardy; call if you'll be more than 15 minutes late</li><li>No call / no show for 3 days in a row is job abandonment</li></ul></div>
        <div><b>Your first 3 months</b><ul class="small" style="margin-top:6px"><li>The first 3 months are your <b>introductory period</b></li><li>PTO can be used after your first 90 days</li><li>Employment is at-will</li></ul></div>
        <div><b>Phones, photos and social media</b><ul class="small" style="margin-top:6px"><li>No personal calls or texts while doing your work; use breaks</li><li>No phones in resident areas</li><li><b>Never</b> photograph residents, and never post about residents or share PHI</li></ul></div>
        <div><b>Residents and gifts</b><ul class="small" style="margin-top:6px"><li>No tips, gifts or loans from residents</li><li>Don't buy from or sell to residents</li><li>Don't discuss your personal issues with residents or families</li></ul></div>
        <div><b>Time clock</b><ul class="small" style="margin-top:6px"><li>Swipe in and out yourself; never swipe another person's badge</li><li>No off-the-clock work</li><li>Missed a punch? Fill out a missed punch form right away</li></ul></div>
        <div><b>Appearance and safety</b><ul class="small" style="margin-top:6px"><li>Wear your ID badge, visible, at all times</li><li>Follow your department's dress code</li><li>No weapons anywhere on campus, including in your car; drug- and alcohol-free workplace</li></ul></div></div>
      <p class="small muted">Questions about pay, benefits, leave or PTO? Ask Human Resources.</p>`}
  ],
  signforms:["handbook","genorient"],
  quiz:[]
}
];


/* ============================== STATE ============================== */
const LS = "wv-orientation-v1";
let S = load();
let db = null, user = null, uid = null, isAdmin = false, downloads = null;
let route = {view:"home"};
let finalDraw = null;

function blank(){ return {profile:null, mods:{}, final:null, startedAt:null}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(LS)); if(s && typeof s==="object") return Object.assign(blank(), s); }catch(e){} return blank(); }
let syncT = null;
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  if(db && uid && S.profile){ clearTimeout(syncT); syncT = setTimeout(pushRecord, 600); }
}
async function pushRecord(){
  try{
    await db.doc("records/"+uid).set({
      name:S.profile.name, dept:S.profile.dept, position:S.profile.position||"", hireDate:S.profile.hireDate||"",
      startedAt:S.startedAt, updatedAt:new Date().toISOString(),
      mods:S.mods, final:S.final||null, completedAt:(S.final&&S.final.passed)?S.final.at:null
    });
  }catch(e){ /* local progress still kept */ }
}
const m = id => S.mods[id] || (S.mods[id] = {});
function modDone(mod){
  const st = S.mods[mod.id]||{};
  const quizOk = !mod.quiz.length || (st.quiz && st.quiz.passed);
  const ackOk = !mod.ack || st.ack;
  const formOk = !mod.form || !!(st.form && st.form.signedAt);
  const aboutOk = !mod.about || aboutDone(st.about);
  const cprOk = !mod.cpr || cprDone(st.cpr);
  return quizOk && ackOk && formOk && aboutOk && cprOk && modSfDone(mod, st);
}
function recModDone(r, mod){
  const st=(r.mods||{})[mod.id]||{};
  return (!mod.quiz.length||(st.quiz&&st.quiz.passed)) && (!mod.ack||st.ack) && (!mod.form||!!(st.form&&st.form.signedAt)) && (!mod.about||aboutDone(st.about)) && (!mod.cpr||cprDone(st.cpr)) && modSfDone(mod, st);
}
function cprDone(c){ return !!(c && c.savedAt && (c.has==="no" || (c.has==="yes" && c.type && c.exp))); }
const CPR_TYPES = ["BLS (Basic Life Support) for Healthcare Providers","Heartsaver CPR/AED","Adult & Pediatric CPR/AED","Other"];
function cprExpired(c){ return !!(c && c.exp && new Date(c.exp+"T23:59:59") < new Date()); }
function cprText(c){
  if(!c||!c.savedAt) return "Not answered";
  if(c.has==="no") return "Not CPR certified";
  return `Certified · ${c.type}${c.org?" · "+c.org:""} · expires ${c.exp?new Date(c.exp+"T12:00:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"—"}${cprExpired(c)?" (EXPIRED)":""} · proof ${c.verified?"verified":"needed"}`;
}
function aboutDone(a){ return !!(a && a.savedAt && (a.memory||"").trim() && (a.know||"").trim()); }
function modStatus(mod){
  if(modDone(mod)) return ["done","Complete"];
  const st = S.mods[mod.id];
  if(st && (st.ack || st.quiz || st.opened || st.form || st.about || st.cpr)) return ["prog","In progress"];
  return ["todo","Not started"];
}
const doneCount = () => MODULES.filter(modDone).length;
const allDone = () => doneCount() === MODULES.length;

/* ============================== HELPERS ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"}) : "";
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const hasPending = mod => mod.sections.some(s => s.html.includes("callout pending"));

function meter(){
  const show = !!S.profile;
  $("#meter").hidden = !show;
  if(show){ const d=doneCount(); $("#meterBar").style.width=(d/MODULES.length*100)+"%"; $("#meterTxt").textContent=`${d} of ${MODULES.length}`; }
  $("#recordsBtn").hidden = !(isAdmin && db);
}

/* ============================== NARRATION ============================== */
const TTS = {
  q:[], i:0, playing:false, paused:false, rate:1, onState:null,
  ok: typeof window.speechSynthesis !== "undefined",
  pref:(()=>{ try{ return localStorage.getItem("rg-voice")||""; }catch(e){ return ""; } })(),
  score(x){ const n=x.name; let sc=0;
    if(/natural|neural/i.test(n)) sc+=100; else if(/premium/i.test(n)) sc+=90; else if(/enhanced/i.test(n)) sc+=80; else if(/online/i.test(n)) sc+=70; else if(/^google/i.test(n)) sc+=60;
    if(/aria|jenny|guy|ava|andrew|emma|brian|michelle|zoe|evan|samantha|allison|nathan|susan/i.test(n)) sc+=20;
    if(/en-US/i.test(x.lang)) sc+=10; else if(/^en/i.test(x.lang)) sc+=5;
    if(/compact|novelty|bad news|bells|bubbles|cellos|jester|whisper|zarvox|trinoids|albert|fred|junior|ralph|kathy|organ|boing|superstar|wobble/i.test(n)) sc-=200;
    return sc; },
  list(){ try{ return speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang)).sort((a,b)=>this.score(b)-this.score(a)); }catch(e){ return []; } },
  voice(){ const l=this.list(); return l.find(x=>x.name===this.pref) || l[0] || null; },
  label(x){ const sc=this.score(x); return x.name.replace(/^Microsoft\s+/,"").replace(/\s+Online\s*\(Natural\)/," (Natural)").replace(/ - English \(United States\)/,"") + (sc>=80?"  ★":""); },
  load(text){ this.stop();
    const sents = text.match(/[^.!?]+[.!?]+["']?|\S[^.!?]*$/g) || [text];
    if(this.claude){ // natural voice: longer passages keep the phrasing smooth
      const q=[]; let cur=""; sents.forEach(t=>{ t=t.trim(); if(cur && (cur+" "+t).length>900){ q.push(cur); cur=t; } else cur=cur?cur+" "+t:t; }); if(cur) q.push(cur);
      this.q=q; } else this.q=sents;
    this.i=0; },
  play(){
    if(!this.ok) return;
    if(this.claude){
      if(this.paused){ this.claude.resume(); return; }
      const lines=this.q.slice(this.i).map((t,k)=>({text:t, id:String(this.i+k), voice:this.cvoice, rate:this.rate, language:"en"}));
      this.playing=true; this.emit();
      this.claude.speak(lines).catch(e=>{ this.playing=false; this.paused=false;
        if(e&&e.code==="not_granted"){ this.ok=false; this.denied=true; }
        else if(e&&e.code==="rate_limited") this.note="Audio is busy. Try again in a moment.";
        this.emit(); });
      return; }
    if(this.paused){ speechSynthesis.resume(); this.paused=false; this.playing=true; this.emit(); return; }
    this.playing=true; this.emit(); this.next();
  },
  next(){
    if(!this.playing) return;
    if(this.i>=this.q.length){ this.playing=false; this.i=0; this.emit(); return; }
    const u = new SpeechSynthesisUtterance(this.q[this.i].trim());
    const v=this.voice(); if(v) u.voice=v; u.rate=this.rate;
    u.onend=()=>{ this.i++; this.next(); };
    u.onerror=()=>{ this.playing=false; this.emit(); };
    speechSynthesis.speak(u); this.emit();
  },
  pause(){ if(!this.ok) return; if(this.claude){ this.claude.pause(); return; } speechSynthesis.pause(); this.paused=true; this.playing=false; this.emit(); },
  stop(){ if(!this.ok) return; this.playing=false; this.paused=false; if(this.claude){ try{ this.claude.stop(); }catch(e){} } else { try{speechSynthesis.cancel();}catch(e){} } this.emit(); },
  setRate(r){ this.rate=r; if(this.claude){ try{ this.claude.setRate(r); }catch(e){} return true; } return false; },
  claude:null, cvoice:(()=>{ try{ return localStorage.getItem("rg-cvoice")||"buttery"; }catch(e){ return "buttery"; } })(),
  CVOICES:[["buttery","Warm"],["airy","Light"],["glassy","Clear"],["rounded","Smooth"]],
  useClaude(t){ this.claude=t; this.ok=true;
    t.onState(({state,reason})=>{ this.playing = state==="speaking"; this.paused = state==="paused";
      if(state==="idle" && reason==="completed"){ this.i=0; } this.emit(); });
    t.onLine(({id})=>{ if(id!=null){ this.i=+id; this.emit(); } }); },
  emit(){ this.onState && this.onState(); }
};
if(TTS.ok){ try{ speechSynthesis.onvoiceschanged=()=>{ const sel=document.getElementById("voice"); if(sel && !TTS.claude) fillVoices(sel); }; }catch(e){} }
function fillVoices(sel){
  if(TTS.claude){ sel.innerHTML=TTS.CVOICES.map(([v,l])=>`<option value="${v}" ${v===TTS.cvoice?"selected":""}>${l}</option>`).join(""); return; }
  const l=TTS.list(); if(!l.length){ sel.innerHTML='<option>Default voice</option>'; return; }
  const cur=TTS.voice();
  sel.innerHTML=l.slice(0,25).map(x=>`<option value="${esc(x.name)}" ${cur&&x.name===cur.name?"selected":""}>${esc(TTS.label(x))}</option>`).join("");
}

function bindNav(root){

      : `<span class="small muted">To finish this module, ${need.join(" and ")}.</span>`;
    bindNav(el);
  }
  foot();
}

        <select id="cpr-type" ${fld}><option value="">Choose one</option>${CPR_TYPES.map(t=>`<option ${c.type===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div class="field"><label for="cpr-org">Issued by <span class="muted">(e.g. American Heart Association, American Red Cross)</span></label><input id="cpr-org" ${fld} value="${esc(c.org||"")}"></div>
      <div class="field"><label for="cpr-exp">Expiration date</label><input id="cpr-exp" type="date" ${fld} value="${esc(c.exp||"")}"></div>
      <div class="callout key"><b>We need to see proof</b><span>Bring your CPR card (front and back, or your eCard) to Staff Development. Your certification is added to your file only after we see it.</span></div>
    </div>
    <p class="err" id="cprErr" hidden></p>
    <div class="row"><button class="btn primary" type="submit">Save</button></div></form>`;
  const f=host.querySelector("#cprF");
  f.querySelectorAll('input[name="cpr-has"]').forEach(r=>r.addEventListener("change",()=>{ f.querySelector("#cprYes").hidden = r.value!=="yes"; }));
  f.addEventListener("submit",e=>{
    e.preventDefault();
    const has=(f.querySelector('input[name="cpr-has"]:checked')||{}).value, er=f.querySelector("#cprErr");
    const type=f.querySelector("#cpr-type").value, org=f.querySelector("#cpr-org").value.trim(), exp=f.querySelector("#cpr-exp").value;
    let msg="";
    if(!has) msg="Please answer yes or no.";
    else if(has==="yes" && !type) msg="Choose your type of CPR certification.";
    else if(has==="yes" && !exp) msg="Enter the expiration date from your card.";
    if(msg){ er.textContent=msg; er.hidden=false; return; }
    st.cpr = has==="yes" ? {has, type, org, exp, savedAt:new Date().toISOString()} : {has, savedAt:new Date().toISOString()};
    delete host.dataset.editing; onChange(); renderCpr(host, st, onChange); toast("CPR answer saved");
  });
}

const VIS_NO = v => `I believe I understand the benefits and risks of ${v} vaccination and decline administration of the ${v} vaccine to me or to the employee named herein who I am authorized to represent. I understand I may re-address this at any time and accept vaccination in the future.`;

  {id:"hepb", name:"Hepatitis B", form:"Hepatitis B Vaccine Consent Form and Administration Record for Employees", head:"UNITED METHODIST HOMES · EMPLOYEE HEALTH PROGRAM",
   vis:"https://www.cdc.gov/vaccines/hcp/current-vis/hepatitis-b.html"},
  {id:"pneu", name:"Pneumococcal Conjugate (PCV)", short:"PCV", stmtName:"Pneumococcal Conjugate Vaccine (PCV)", form:"Pneumococcal Conjugate Vaccine Consent/Declination", head:"INFECTION CONTROL",
   vis:"https://www.cdc.gov/vaccines/hcp/current-vis/pneumococcal-conjugate.html"},
  {id:"flu", name:"Influenza", short:"Influenza", stmtName:"Inactivated or Recombinant Flu vaccine (Influenza)", form:"Influenza Vaccine (Inactivated or Recombinant) Consent/Declination", head:"INFECTION CONTROL", season:true,
   vis:"https://www.cdc.gov/vaccines/hcp/current-vis/flu.html"}
];
const IMZ_LABEL = {consent:"Consent: give vaccine", decline:"Declined", notgiven:"Not given: prior series / immune", community:"Already received (record to Employee Health)",
  inhouse:"Vaccinate here", immune:"Immune (titer)", contra:"Medical contraindication"};
const HEPB_REASON = {medical:"Medical exemption", religious:"Religious exemption", nowish:"Does not wish to receive"};
function fluSeason(d){ d=d?new Date(d):new Date(); const y=d.getFullYear(); return d.getMonth()>=6 ? `${y}–${y+1}` : `${y-1}–${y}`; }
function imzDetail(v, c){
  if(!c) return "";
  if(c.choice==="decline" && c.reason) return HEPB_REASON[c.reason]+(c.reason==="medical"&&c.medNote?": "+c.medNote:"");
  if(c.choice==="notgiven") return c.notReason==="immune" ? "Antibody testing shows immune"+(c.titerNote?": "+c.titerNote:"") : "Series previously received"+(c.priorNote?": "+c.priorNote:"");
  if(c.choice==="consent" && c.screen){ const flags=HEPB_SCREEN.filter(([k])=>c.screen[k]==="yes").map(([k,q,y])=>y); return [flags.length?"Screening: "+flags.join(" "):"Screening: no allergies", c.declineTiter?"Declines antibody testing":""].filter(Boolean).join(" · "); }
  if(c.choice==="community") return [c.date&&("Date "+c.date), c.where].filter(Boolean).join(" · ");
  return "";
}
const box = on => on ? "☒" : "☐";
const CHECK_CSS = "font-family:'Segoe UI Symbol','Apple Symbols',sans-serif";

function renderImzForm(host, st, onChange){

  const draft = JSON.parse(JSON.stringify(f.choices||{}));
  ["hepb","pneu","flu"].forEach(k=>{ if(draft[k] && !["consent","decline","notgiven","community"].includes(draft[k].choice)) delete draft[k]; });
  const info = Object.assign({dept:S.profile.dept||"", physName:"", physAddr:"", minor:false}, f.info||{});

    host.innerHTML = `<div class="imz">

  const radio = (name,val,label,cur,extra="") => `<label class="opt"><input type="radio" name="${name}" value="${val}" ${cur===val?"checked":""} ${extra}><span>${label}</span></label>`;
  host.innerHTML = `<form class="imz" id="imzF" novalidate>
    <p class="small muted">These are the same three forms you would sign on paper. Your answers save as you go, but they don't count until you sign at the bottom.</p>

    <fieldset class="imz-v" data-v="hepb"><legend>Form 1 · Hepatitis B Vaccine Consent Form</legend>
      <span class="vis">United Methodist Homes Employee Health Program · <a href="${IMZ[0].vis}" target="_blank" rel="noopener">CDC VIS: Hepatitis B Vaccine – What You Need to Know</a></span>
      <div class="imz-sub"><div class="grid2">
        <div class="field"><label>Department</label><input data-i="dept" value="${esc(info.dept)}"></div>
        <div class="field"><label>Primary physician name <span class="muted">(optional)</span></label><input data-i="physName" value="${esc(info.physName)}"></div></div>
        <div class="field"><label>Primary physician address <span class="muted">(optional)</span></label><input data-i="physAddr" value="${esc(info.physAddr)}"></div></div>
      <p class="imz-decl">${esc(HEPB_STMT)}</p>
      <div class="imz-opts">
        ${radio("imz-hepb","consent","<b>I DO WISH TO RECEIVE THE HEPATITIS B VACCINE 3-INJECTION SERIES.</b>",(draft.hepb||{}).choice)}
        ${radio("imz-hepb","decline","<b>I DO NOT WISH TO RECEIVE THE HEPATITIS B VACCINE SERIES</b> for the following reason:",(draft.hepb||{}).choice)}
        ${radio("imz-hepb","notgiven","<b>HEPATITIS B VACCINE SERIES NOT GIVEN</b> for the following reason (previously received, or immune):",(draft.hepb||{}).choice)}
      </div><div class="imz-slot"></div></fieldset>

    ${IMZ.slice(1).map(v=>`<fieldset class="imz-v" data-v="${v.id}"><legend>Form ${v.id==="pneu"?2:3} · ${esc(v.form)}${v.season?` · ${fluSeason()} season`:""}</legend>
      <span class="vis">Employee/Legal Representative Consent · <a href="${v.vis}" target="_blank" rel="noopener">CDC VIS: ${esc(v.name)} vaccine</a></span>
      <p class="imz-decl">${esc(VIS_STMT(v.stmtName))}</p>
      <div class="imz-opts">

        ${radio("imz-"+v.id,"decline",esc(VIS_NO(v.short)),(draft[v.id]||{}).choice)}
        ${radio("imz-"+v.id,"community",`I already received ${v.season?"this season's flu vaccine":"pneumococcal vaccine"} somewhere else (pharmacy, doctor, prior employer). <span class="muted">I'll bring my record to Employee Health.</span>`,(draft[v.id]||{}).choice)}
      </div><div class="imz-slot"></div></fieldset>`).join("")}

    <div class="imz-sign">
      <label class="ack"><input type="checkbox" id="imzMinor" ${info.minor?"checked":""}><span>I am under 18 years old. <span class="small muted">A parent or legal guardian must also sign with Employee Health.</span></span></label>
      <label class="ack"><input type="checkbox" id="imzAttest"><span>I have read each statement above and the CDC Vaccine Information Statements, and I had the chance to ask questions. I understand that typing my name below is my electronic signature on all three forms.</span></label>

    </div></form>`;
  const form = host.querySelector("#imzF");

  form.querySelector("#imzMinor").onchange=e=>{ info.minor=e.target.checked; persist(); };
  const bindSub = (slot, c, redraw)=>{
    slot.querySelectorAll("[data-k]").forEach(inp=>{
      const ev = inp.type==="radio"||inp.type==="checkbox" ? "change" : "input";

          <label class="small"><input type="radio" name="scr-${k}" data-k="${k}" data-sub="1" value="yes" ${cur==="yes"?"checked":""}> Yes</label></span>

        <label class="small" style="display:flex;gap:8px;align-items:start"><input type="checkbox" data-k="declineTiter" ${c.declineTiter?"checked":""}><span>I decline Hepatitis B antibody testing (the blood test after the series). <span class="muted">Optional</span></span></label></div>`;
      else if(c.choice==="decline") h=`<div class="imz-sub"><div class="imz-opts">
        ${radio("hepb-reason","medical","Medical exemption",c.reason,'data-k="reason"')}
        ${c.reason==="medical"?`<div class="field"><label>Explain</label><input data-k="medNote" value="${esc(c.medNote||"")}"></div>`:""}
        ${radio("hepb-reason","religious","Religious exemption",c.reason,'data-k="reason"')}
        ${radio("hepb-reason","nowish",esc(HEPB_NOWISH),c.reason,'data-k="reason"')}</div>
        ${c.reason?`<b class="small">OSHA declination statement (29 CFR 1910.1030, Appendix A)</b><p class="imz-decl">${esc(OSHA_DECL)}</p><span class="small muted">OSHA requires this exact statement for anyone who declines. Your signature below applies to it.</span>`:""}</div>`;
      else if(c.choice==="notgiven") h=`<div class="imz-sub"><div class="imz-opts">
        ${radio("hepb-not","prior","Hepatitis B series previously received (3 injections, or 6 injections for non-responders)",c.notReason,'data-k="notReason"')}
