        <div class="field"><label>Date received</label><input type="date" data-k="date" value="${esc(c.date||"")}"></div>
        <div class="field"><label>Where</label><input data-k="where" value="${esc(c.where||"")}"></div></div></div>`;

  const pos = d.position || [S.profile.dept, S.profile.position].filter(Boolean).join(" / ");

    ${F.concerns?`<div class="field"><label>List any compliance concerns</label><textarea rows="3" data-f="concerns" style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;font:inherit;color:inherit">${esc(d.concerns||"")}</textarea>
      <label class="small" style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" data-f="none" ${d.none?"checked":""}> I have no compliance concerns to list.</label></div>`:""}
    ${F.after?`<p class="imz-decl">${esc(F.after)}</p>`:""}
    ${F.review?`<div class="imz-opts"><b class="small">Please check the appropriate box:</b>

      <label class="opt"><input type="radio" name="rv-${key}" data-f="review" value="annual" ${d.review==="annual"?"checked":""}><span>I certify that this is my <b>annual</b> review of the Code of Conduct.</span></label></div>`:""}
    ${F.position?`<div class="field"><label>Department / Position</label><input data-f="position" value="${esc(pos)}"></div>`:""}
    ${locked?`<div class="callout"><b>Finish every other module first</b><span class="small">You can sign this once all other modules are complete.</span></div>`:`

    <div class="row"><button class="btn primary" type="submit">Sign</button></div>`}
  </form>`;
  const form=el.querySelector("form");

  form.querySelectorAll("[data-f]").forEach(inp=>inp.addEventListener(inp.type==="checkbox"||inp.type==="radio"?"change":"input",()=>{

function renderQuiz(host, qs, onDone, prevScore){
  const items = qs.map(q=>{ const order=shuffle(q.o.map((t,i)=>i)); return {...q, order}; });
  host.innerHTML = `<form class="quiz" id="qf">
    ${prevScore!=null?`<div class="result pass">You passed this check with ${prevScore}%. You can retake it for practice.</div>`:""}
    ${items.map((q,qi)=>`<fieldset class="q" data-qi="${qi}"><legend>${qi+1}. ${esc(q.q)}</legend>
      ${q.order.map(oi=>`<label class="opt" data-oi="${oi}"><input type="radio" name="q${q.key}" id="q${q.key}-${oi}" value="${oi}" required><span>${esc(q.o[oi])}</span></label>`).join("")}
      <p class="why" hidden></p></fieldset>`).join("")}
    <div class="row"><button class="btn primary" type="submit">Submit answers</button><span class="small muted" id="qmsg"></span></div>
  </form>`;
  const f=host.querySelector("#qf");
  f.addEventListener("submit",e=>{
    e.preventDefault();
    let right=0;
    items.forEach((q,qi)=>{
      const fs=f.querySelector(`[data-qi="${qi}"]`), pick=fs.querySelector("input:checked"), v=pick?+pick.value:-1;
      fs.querySelectorAll(".opt").forEach(o=>{ const oi=+o.dataset.oi; o.classList.toggle("right",oi===q.a); o.classList.toggle("wrong",oi===v&&v!==q.a); o.querySelector("input").disabled=true; });
      const w=fs.querySelector(".why"); w.hidden=false; w.innerHTML=(v===q.a?"<b>Correct.</b> ":"<b>Not quite.</b> ")+esc(q.w);
      if(v===q.a) right++;
    });
    const score=Math.round(right/items.length*100), passed=score>=PASS;
    const r=document.createElement("div"); r.className="result "+(passed?"pass":"fail");
    r.textContent = passed ? `You scored ${score}% (${right} of ${items.length}). Passed.` : `You scored ${score}% (${right} of ${items.length}). You need ${PASS}% to pass. Review the explanations, then try again.`;
    const btnRow=f.querySelector(".row"); btnRow.innerHTML=""; btnRow.before(r);
    const again=document.createElement("button"); again.type="button"; again.className="btn"; again.textContent=passed?"Retake for practice":"Try again";
    again.onclick=()=>{ renderQuiz(host, qs, onDone, passed?score:prevScore); host.scrollIntoView({behavior:"smooth",block:"start"}); };
    btnRow.append(again);
    r.scrollIntoView({behavior:"smooth",block:"center"});
    const answers = items.map((q,qi)=>{ const pick=f.querySelector(`[data-qi="${qi}"] input:checked`), v=pick?+pick.value:-1;
      return {q:q.q, chosen:v>=0?q.o[v]:"(no answer)", correct:q.o[q.a], ok:v===q.a, from:q.from||""}; });
    onDone({score,passed,right,total:items.length,answers});
  });
}

function dueInfo(r){
  if(!r.hireDate) return {due:null, label:"Start date not entered", cls:"todo"};
  const d=new Date(r.hireDate+"T00:00:00"); d.setDate(d.getDate()+7); d.setHours(23,59,59);
  const dueStr=d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
  if(r.completedAt) return new Date(r.completedAt)<=d ? {due:d, dueStr, label:"On time", cls:"done"} : {due:d, dueStr, label:"Completed late", cls:"pend"};
  return new Date()>d ? {due:d, dueStr, label:"Overdue", cls:"pend"} : {due:d, dueStr, label:"Due "+dueStr, cls:"prog"};
}

  const rows=MODULES.map((mod,i)=>{ const st=mods[mod.id]||{}, ok=recModDone(r,mod);
    const chk=mod.quiz.length?(st.quiz&&st.quiz.passed?`${(st.quiz.pass&&st.quiz.pass.score)||st.quiz.score}%`:"—"):"n/a";
    const ack=mod.ack?(st.ack?fmtDate(st.ackAt):"—"):mod.form?(st.form&&st.form.signedAt?fmtDate(st.form.signedAt):"—"):mod.signforms?(modSfDone(mod,st)?mod.signforms.filter(sfActive).map(k=>fmtDate(st.sf[k].signedAt)).join(", "):"—"):"n/a";
    return `<tr><td>${i+1}</td><td>${esc(mod.title)}</td><td>${esc(mod.tag)}</td><td>${ok?fmtDate(modDoneAt(st)):"<b>Not complete</b>"}</td><td>${chk}</td><td>${ack}</td></tr>`; }).join("");
  const blocks=MODULES.map((mod,i)=>{ const st=mods[mod.id]||{}, ok=recModDone(r,mod), q=st.quiz||{}, pass=q.pass;
    return `<div class="mblock"><h3>Module ${i+1}. ${esc(mod.title)}</h3>
      <p class="meta">Reference: ${esc(mod.tag)} · Status: ${ok?`<span class="ok">Complete ${fmtDT(modDoneAt(st))}</span>`:`<span class="no">Not complete</span>`}</p>
      ${mod.cpr?`<p class="meta"><b>CPR certification (self-reported${st.cpr&&st.cpr.savedAt?" "+fmtDT(st.cpr.savedAt):""}):</b> ${esc(cprText(st.cpr))}</p>`:""}
      ${mod.ack?`<p class="attest"><b>Acknowledgment${st.ack?` — signed ${fmtDT(st.ackAt)}`:" — not signed"}:</b> ${esc(mod.ack)}</p>`:""}
      ${mod.signforms?mod.signforms.filter(sfActive).map(k=>sfDone(st,k)?`<style>${PFORM_CSS}</style>`+sfFormHTML(k,st.sf[k],r.name):`<p class="no">${esc(SIGNFORMS[k].title)} not signed.</p>`).join(""):""}
      ${mod.form?(st.form&&st.form.signedAt?imzSummaryHTML(st,true,r.name).replace(/<p style="margin-top:24px">[\s\S]*$/,""):`<p class="no">Immunization election not signed.</p>`):""}
      ${mod.quiz.length?(q.passed?`<p class="meta"><b>Knowledge check passed</b> ${fmtDT(pass?pass.at:q.at)} · Score ${pass?`${pass.score}% (${pass.right} of ${pass.total})`:q.score+"%"}${pass&&pass.attempt?` · Attempt ${pass.attempt}`:""}${st.attempts?` of ${st.attempts} total`:""}</p>${qaTable(pass)}`:`<p class="no">Knowledge check not passed.</p>`):""}
    </div>`; }).join("");
  const fp=fin.pass;
  return `<div class="audit">
    <img src="${UMH_LOGO}" alt="United Methodist Homes" style="height:44px;width:auto;display:block;margin-bottom:8px">
    <p class="sub"><b style="color:#12074A;letter-spacing:.03em">READY</b><b style="color:#0060AB;font-weight:500;letter-spacing:.03em">GO</b> &nbsp;·&nbsp; United Methodist Homes · Wesley Village · Pittston, PA</p>
    <h1>New Employee Orientation — Training Record</h1>
    <p class="sub">Required education under 28 Pa. Code §201.20 and 42 CFR §483.95</p>
    <div class="kv">
      <b>Employee</b><span>${esc(r.name)}</span>
      <b>Department</b><span>${esc(r.dept)}${r.position?" · "+esc(r.position):""}</span>
      <b>First day of work</b><span>${fmtHire(r.hireDate)}</span>
      <b>Orientation due</b><span>${(()=>{ const di=dueInfo(r); return di.due?`${di.dueStr} (within 1 week of start, 28 Pa. Code §201.19(6)) · <span class="${di.cls==="done"?"ok":di.cls==="pend"?"no":""}">${di.label}</span>`:di.label; })()}</span>
      <b>Orientation started</b><span>${fmtDT(r.startedAt)}</span>
      <b>Orientation completed</b><span>${complete?`<span class="ok">${fmtDT(fin.at)}</span>`:`<span class="no">Not complete (${done} of ${MODULES.length} modules${fin.passed?"":", final exam not passed"})</span>`}</span>
      <b>Final exam</b><span>${fin.passed?`Passed · ${fp?`${fp.score}% (${fp.right} of ${fp.total})`:fin.score+"%"} · passing score ${PASS}%`:fin.attempts?`Not passed (best ${fin.score}%)`:"Not taken"}</span>
      <b>CPR certification</b><span>${esc(cprText((mods.welcome||{}).cpr))}</span>
      <b>Record printed</b><span>${fmtDT(new Date().toISOString())}</span>
    </div>
    <h2>Summary of modules</h2>
    <table><thead><tr><th>#</th><th>Module</th><th>Reference</th><th>Completed</th><th>Check score</th><th>Acknowledged / signed</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Final exam</h2>
    ${fin.passed?`<p class="meta"><b>Passed</b> ${fmtDT(fp?fp.at:fin.at)} · Score ${fp?`${fp.score}% (${fp.right} of ${fp.total})`:fin.score+"%"}${fp&&fp.attempt?` · Attempt ${fp.attempt}`:""}${fin.attempts?` of ${fin.attempts} total`:""}</p>${qaTable(fp,true)}`:`<p class="no">Final exam not passed.</p>`}
    <h2 class="break">Module detail</h2>
    ${blocks}
    <h2>Verification</h2>
    <p>I attest that I completed this orientation myself and that the answers recorded above are my own.</p>
    <div class="sig"><div>Employee signature &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Date</div><div>Staff Development / Educator signature &nbsp;&nbsp;&nbsp;&nbsp; Date</div></div>
    ${mods.immun&&mods.immun.form&&mods.immun.form.signedAt||((mods.welcome||{}).cpr||{}).has==="yes"?`<div class="sig">${mods.immun&&mods.immun.form&&mods.immun.form.signedAt?`<div>Employee Health verification (immunizations) &nbsp;&nbsp; Date</div>`:"<div style='border:0'></div>"}${((mods.welcome||{}).cpr||{}).has==="yes"?`<div>CPR card seen &amp; copy placed in file — verified by &nbsp;&nbsp; Date</div>`:"<div style='border:0'></div>"}</div>`:""}
    <p class="note">Completed electronically through the Wesley Village New Employee Orientation. Dates and times are recorded automatically when each item is completed. Each knowledge check shows the employee's first passing attempt.</p>
  </div>`;
}
function auditFile(r){
  return `<!doctype html><html><head><meta charset="utf-8"><title>Training record · ${esc(r.name)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap"><style>body{margin:0;padding:24px;background:#fff}${AUDIT_CSS}</style></head><body>${auditHTML(r)}</body></html>`;
}
function renderAudit(app){
  const r = route.rec || (S.profile ? recFromState() : null);
  if(!r) return go({view:"home"});
  const back = route.rec ? "records" : (S.final&&S.final.passed ? "cert" : "home");
  app.innerHTML = `<style>${AUDIT_CSS}
    @media print{ .top,.toast,.noprint{display:none!important} body,.wrap{background:#fff!important;padding:0!important;margin:0!important} .read{max-width:none!important} }</style>
    <div class="read" style="max-width:60rem">
      <div class="row noprint"><button class="btn ghost back" data-go="${back}">← Back</button>
        <span id="auSave"></span></div>
      <p class="small muted noprint">Save a copy, then open the saved file and print it (or "Save as PDF") for your audit binder.</p>
      ${auditHTML(r)}
    </div>`;
  bindNav(app);
  if(downloads){
    const b=document.createElement("button"); b.className="btn primary"; b.textContent="Save a copy to print";
    b.onclick=async()=>{ try{ await downloads.save({filename:`Training-Record-${String(r.name).replace(/\W+/g,"-")}.html`, data:auditFile(r)}); toast("Training record saved"); }catch(e){ toast("The record wasn't saved"); } };
    $("#auSave").append(b);
  }
}

let recUnsub=null, recDocs=null;
function imzRecCell(r){
  const f=((r.mods||{}).immun||{}).form||{};
  if(!f.signedAt) return `<span class="muted">Not signed</span>`;
  return IMZ.map(v=>{ const c=(f.choices||{})[v.id]||{}; return `${v.name}: <b>${IMZ_LABEL[c.choice]||"—"}</b>`; }).join("<br>");
}
function renderRecords(app){
  if(!(isAdmin&&db)) return go({view:"home"});
  app.innerHTML=`<div style="display:grid;gap:18px">
    <button class="btn ghost back" data-go="home">← Home</button>
    <div class="lesson-head"><span class="eyebrow">Visible to editors only</span><h1>Orientation Records</h1>
    <p class="muted">Employees who open the orientation while signed in to Claude are recorded here automatically. Employees without a sign-in show their certificate on screen instead.</p></div>
    <div class="row" id="recTools"></div>
    <div id="recBody" class="panel"><p class="muted">Loading records…</p></div></div>`;
  bindNav(app);
  const draw=()=>{
    const body=$("#recBody"); if(!body) return;
    if(!recDocs||!recDocs.length){ body.innerHTML=`<b>No records yet</b><p class="muted small">When a signed-in employee starts orientation, their name, department, progress and scores appear here.</p>`; return; }
    const rows=recDocs.slice().sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
    body.innerHTML=`<div class="tbl"><table><thead><tr><th>Employee</th><th>Department</th><th>First day · due</th><th>Started</th><th>Modules</th><th>CPR</th><th>Immunizations</th><th>Final</th><th>Status</th></tr></thead><tbody>
      ${rows.map(r=>{ const done=MODULES.filter(mod=>recModDone(r,mod)).length;
        const ab=((r.mods||{}).welcome||{}).about||{};
        return `<tr><td><b>${esc(r.name)}</b>${r.position?`<br><span class="small muted">${esc(r.position)}</span>`:""}${ab.memory?`<br><span class="small"><b>Best memory:</b> ${esc(ab.memory)}</span>`:""}${ab.know?`<br><span class="small"><b>Know about me:</b> ${esc(ab.know)}</span>`:""}</td><td>${esc(r.dept)}</td><td class="small">${(()=>{ const di=dueInfo(r); return r.hireDate?`${fmtDate(r.hireDate+"T00:00:00")}<br><span class="chip ${di.cls}">${di.label}</span>`:`<span class="muted">Not entered</span>`; })()}</td><td class="num">${fmtDate(r.startedAt)}</td><td class="num">${done} / ${MODULES.length}</td><td class="small">${(()=>{ const c=((r.mods||{}).welcome||{}).cpr; if(!c||!c.savedAt) return `<span class="muted">—</span>`; if(c.has==="no") return "No"; return `<b>Yes</b> · ${esc(c.type.split(" (")[0])}<br>exp ${esc(c.exp)}${cprExpired(c)?` <span class="chip pend">Expired</span>`:""}<br><span class="chip pend">Proof needed</span>`; })()}</td><td class="small">${imzRecCell(r)}</td><td class="num">${r.final?r.final.score+"%":"—"}</td>
        <td>${r.completedAt?`<span class="chip done">Complete ${new Date(r.completedAt).toLocaleDateString()}</span>`:`<span class="chip prog">In progress</span>`}<br><button class="btn sm" style="margin-top:6px" data-rec="${rows.indexOf(r)}">Training record</button></td></tr>`; }).join("")}
      </tbody></table></div>`;
    body.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>go({view:"audit", rec:rows[+b.dataset.rec]}));
    const tools=$("#recTools"); tools.innerHTML="";
    if(downloads){ const b=document.createElement("button"); b.className="btn"; b.textContent="Export CSV";
      b.onclick=async()=>{ const head=["Name","Department","Position","First day of work","Orientation due","Timeliness","Started","Modules complete","Hepatitis B","Pneumococcal","Influenza","Immunization signed","Code of Conduct signed","General Orientation signed","CPR certified","CPR type","CPR issued by","CPR expires","Best memory","Want us to know","Final score","Completed"];
        const lines=[head].concat(rows.map(r=>{ const done=MODULES.filter(mod=>recModDone(r,mod)).length;
          const imf=((r.mods||{}).immun||{}).form||{}, ch=k=>{ const c=(imf.choices||{})[k]||{}; return imf.signedAt?[IMZ_LABEL[c.choice]||"",imzDetail(null,c)].filter(Boolean).join(" · "):""; };
          const di=dueInfo(r); return [r.name,r.dept,r.position||"",r.hireDate||"",di.due?di.due.toISOString().slice(0,10):"",di.label,(r.startedAt||"").slice(0,10),done,ch("hepb"),ch("pneu"),ch("flu"),(imf.signedAt||"").slice(0,10),((((r.mods||{}).compliance||{}).sf||{}).coc||{}).signedAt?((r.mods.compliance.sf.coc.signedAt)||"").slice(0,10):"",((((r.mods||{}).signoff||{}).sf||{}).genorient||{}).signedAt?((r.mods.signoff.sf.genorient.signedAt)||"").slice(0,10):"",...(()=>{ const c=((r.mods||{}).welcome||{}).cpr||{}; return [c.savedAt?(c.has==="yes"?"Yes":"No"):"",c.type||"",c.org||"",c.exp||""]; })(),(((r.mods||{}).welcome||{}).about||{}).memory||"",(((r.mods||{}).welcome||{}).about||{}).know||"",r.final?r.final.score:"",(r.completedAt||"").slice(0,10)]; }));
        const csv=lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
        try{ await downloads.save({filename:"orientation-records.csv",data:csv}); toast("Records exported"); }catch(e){ toast("The export wasn't saved"); } };
      tools.append(b); }
  };
  if(!recUnsub){
    const timer=setTimeout(()=>{ if(recDocs===null){ const b=$("#recBody"); if(b) b.innerHTML=`<p class="muted">Records are taking a while to load. Check your connection.</p>`; } },10000);
    recUnsub=db.collection("records").onSnapshot(snap=>{ clearTimeout(timer); recDocs=snap.docs.map(d=>d.data()); if(route.view==="records") draw(); },
      ()=>{ clearTimeout(timer); const b=$("#recBody"); if(b) b.innerHTML=`<p class="muted">Records couldn't be loaded.</p>`; });
  } else draw();
}

$("#homeBtn").onclick=()=>go({view:"home"});
$("#recordsBtn").onclick=()=>go({view:"records"});
render();

/* ============================== CAPABILITIES ============================== */
(async()=>{
  if(!window.claude||!window.claude.use) return;
  claude.use("tts").then(t=>{ if(!t) return; TTS.stop(); TTS.useClaude(t);
    if(route.view==="module") render(); }).catch(()=>{});
  try{
    const [u,d,dl]=await Promise.all([claude.use("user"),claude.use("db"),claude.use("downloads")]);
    user=u; downloads=dl;
    if(user){ isAdmin = await user.canEdit(); uid = await user.id(); }
    if(d && uid){
      db=d;
      try{ const snap=await db.doc("records/"+uid).get();
        if(snap.exists){ const r=snap.data();
          if(!S.profile || S.profile.name===r.name){
            const localDone=doneCount();
            const remote={profile:{name:r.name,dept:r.dept,position:r.position||"",hireDate:r.hireDate||""},mods:JSON.parse(JSON.stringify(r.mods||{})),final:r.final?{...r.final}:null,startedAt:r.startedAt};
            const tmp=S; S=remote; const remoteDone=doneCount(); S=tmp;
            if(!S.profile || remoteDone>=localDone){ S=Object.assign(blank(),remote); try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} }
          }
        } else if(S.profile){ pushRecord(); }
      }catch(e){}
    } else if(d && isAdmin){ db=d; }
    if(route.view!=="module") render(); else meter();
    if(route.view==="cert") render();
  }catch(e){}
})();
</script>

</body></html>
